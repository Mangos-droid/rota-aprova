
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rota Aprova</title>

    <style>
        :root {
            --fundo: #0d172d;
            --cartao: #162440;
            --texto: #ffffff;
            --secundario: #b8c5dc;
            --botao: #ffffff;
            --borda: #263653;
        }

        body.claro {
            --fundo: #ffffff;
            --cartao: #f0f4fa;
            --texto: #244778;
            --secundario: #53647e;
            --botao: #ffffff;
            --borda: #dce3f0;
        }

        body {
            background: var(--fundo);
            color: var(--texto);
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 25px;
            transition: 0.3s;
        }

        .cartao {
            background: var(--cartao);
            border: 1px solid var(--borda);
            border-radius: 12px;
            padding: 20px;
            margin: 20px auto;
            max-width: 400px;
        }

        p {
            color: var(--secundario);
        }

        button {
            background: var(--botao);
            color: #000000;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            margin: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <button onclick="trocarTema()" id="tema">
        ☀️ Modo claro
    </button>

    <h1>Rota Aprova</h1>

    <div class="cartao">
        <h2>Seu espaço de aprendizagem!</h2>
        <p>Aqui você aprende e pratica!</p>
        <button>Começar a estudar</button>
    </div>

    <script>
        function trocarTema() {
            document.body.classList.toggle("claro");

            const claro = document.body.classList.contains("claro");

            document.getElementById("tema").innerHTML =
                claro ? "🌙 Modo escuro" : "☀️ Modo claro";

            localStorage.setItem("tema", claro ? "claro" : "escuro");
        }

        if (localStorage.getItem("tema") === "claro") {
            document.body.classList.add("claro");
            document.getElementById("tema").innerHTML = "🌙 Modo escuro";
        }
    </script>

</body>
</html>
