  alts:{A:"John looked around but he couldn't see the monkey.",B:"He is probably in the park.",C:"The water was extremely cold.",D:"He swims well.",E:"I will call you later."}, gab:"D", gabTipo:"verificado",
  res:["\"Quickly\" é advérbio de modo (how?).","\"Well\" em \"He swims well\" também responde \"how?\".","B: probabilidade; C: intensidade; E: tempo. Alternativa D."] },
{ id:"cn20-i4", inst:"CN", ano:2020, fonte:"cn20", materia:"Inglês", assunto:"past", dif:1,
  enun:"Complete com a forma correta do verbo entre parênteses: \"The South Korean movie 'Parasite' (WIN) the Oscar for best picture on Sunday.\"",
  alts:{A:"wins",B:"has won",C:"was winning",D:"is winning",E:"won"}, gab:"E", gabTipo:"verificado",
  res:["\"On Sunday\" marca um momento terminado no passado.","Ação concluída num momento definido → Simple Past: won. Alternativa E."] },
{ id:"cn20-i5", inst:"CN", ano:2020, fonte:"cn20", materia:"Inglês", assunto:"present", dif:2,
  enun:"Mark the sentence (de uma notícia sobre o coronavírus na Itália) that contains the use of Present Continuous.",
  alts:{A:"Three people have died.",B:"The reporting chain worked without delay.",C:"He said the quarantine restrictions could last for weeks.",D:"Officials reported a third death on Sunday, an elderly woman suffering from cancer.",E:"Italian officials say they are still trying to trace the source of the outbreak."}, gab:"E", gabTipo:"verificado",
  res:["Present Continuous = am/is/are + verbo com -ing.","\"They are still trying\" tem essa estrutura. Em D, \"suffering\" não forma tempo verbal com \"to be\".","Alternativa E."] },
{ id:"cn20-i6", inst:"CN", ano:2020, fonte:"cn20", materia:"Inglês", assunto:"reading", dif:2,
  enun:"Mark the option in which all nouns are uncountable.",
  alts:{A:"beauty, computer, strawberry, diary",B:"money, painting, window, love",C:"electricity, advice, help, oxygen",D:"cookie, candy, fruit, shop",E:"knowledge, idea, man, air"}, gab:"C", gabTipo:"verificado",
  res:["Incontáveis não têm plural comum: electricity, advice, help, oxygen.","As outras listas trazem contáveis (computer, window, cookie, idea, man…). Alternativa C."] },
{ id:"cn20-i7", inst:"CN", ano:2020, fonte:"cn20", materia:"Inglês", assunto:"present", dif:2,
  enun:"Mark the correct question for the answer \"Meditation can give you a sense of calm, peace and balance.\"",
  alts:{A:"What do you do during meditation?",B:"What are the benefits of meditation?",C:"Why meditation is good for you?",D:"What benefits do meditation have?",E:"Does meditation have benefits?"}, gab:"B", gabTipo:"verificado",
  res:["A resposta lista benefícios, então a pergunta é sobre benefícios.","C erra a ordem (falta \"is meditation\"); D erra a concordância (\"does\"); E pede só sim/não.","Alternativa B."] },
{ id:"cn20-i8", inst:"CN", ano:2020, fonte:"cn20", materia:"Inglês", assunto:"comparatives", dif:2,
  enun:"Em \"the worst outbreak of the coronavirus in Europe\", o superlativo \"worst\" é irregular. Which adjective forms its superlative in the same way?",
  alts:{A:"High.",B:"Good.",C:"Early.",D:"Elderly.",E:"Extraordinary."}, gab:"B", gabTipo:"verificado",
  res:["Bad → worse → worst é irregular.","Good → better → best também é irregular.","High/highest e early/earliest são regulares; elderly e extraordinary usam \"most\". Alternativa B."] },
{ id:"cn20-i9", inst:"CN", ano:2020, fonte:"cn20", materia:"Inglês", assunto:"reading", dif:1,
  enun:"Um texto conta um casamento coletivo na Coreia do Sul durante a pandemia. Mark the pair of words that is NOT normally related to weddings.",
  alts:{A:"happy day / tie the knot.",B:"brides / grooms.",C:"sanitizer / surgical masks.",D:"couples / newlyweds.",E:"marriage vows / guests."}, gab:"C", gabTipo:"verificado",
  res:["Álcool em gel e máscaras aparecem por causa da pandemia, não por serem coisas de casamento.","Alternativa C."] },

/* ================= Português — EPCAR (oficial) ================= */
{ id:"ep24-07", inst:"EPCAR", ano:2023, fonte:"epcar24", num:7, materia:"Português", assunto:"figuras", dif:2,
  enun:"Numa tirinha da Mafalda (Quino), Susanita diz: \"A ciência me chama!\". A figura de linguagem presente nessa fala é:",
  alts:{A:"metáfora.",B:"hipérbole.",C:"eufemismo.",D:"personificação."}, gab:"D", gabTipo:"oficial",
  res:["\"Chamar\" é ação de um ser animado.","A ciência (algo abstrato) recebe uma ação humana: personificação (prosopopeia).","Alternativa D."] },
{ id:"ep24-08", inst:"EPCAR", ano:2023, fonte:"epcar24", num:8, materia:"Português", assunto:"coesao", dif:3,
  enun:"Na tirinha, Susanita usa \"portanto\" para fechar um raciocínio e \"quando\" para falar do que fará no futuro. Julgue: I. \"Portanto\" encerra uma ideia com base no que foi dito antes. II. Trocar \"quando\" por \"assim que\" muda muito o sentido, pois Susanita passaria a ter certeza do futuro. III. \"Quando\" expressa circunstância de tempo em relação ao verbo principal. A sequência correta é:",
  alts:{A:"V – F – F",B:"F – V – F",C:"V – F – V",D:"F – V – V"}, gab:"C", gabTipo:"oficial",
  res:["I: \"portanto\" é conclusivo. Verdadeira.","II: \"assim que\" também é temporal; a troca não muda muito o sentido. Falsa.","III: \"quando\" introduz oração adverbial temporal. Verdadeira. Alternativa C."] },
{ id:"ep24-10", inst:"EPCAR", ano:2023, fonte:"epcar24", num:10, materia:"Português", assunto:"interpretacao", dif:2,
  enun:"Numa tirinha de Calvin e Haroldo, Calvin defende que \"qualquer palavra pode ter qualquer significado\" e brinca de dar novos sentidos às palavras. O fenômeno linguístico que a tirinha tenta explicar é:",
  alts:{A:"polissemia.",B:"sinonímia.",C:"homonímia.",D:"ambiguidade."}, gab:"A", gabTipo:"oficial",
  res:["Polissemia: uma mesma palavra assume vários sentidos conforme o contexto.","É disso que Calvin fala. Alternativa A."] },
{ id:"ep24-14", inst:"EPCAR", ano:2023, fonte:"epcar24", num:14, materia:"Português", assunto:"sintaxe", dif:4,
  enun:"Sobre trechos do texto \"Conflito de Gerações\" (Fernando Bonassi), avalie os comentários: I. Em \"Vi sem querer, espiando banho\", a vírgula separa uma oração subordinada adverbial. II. Em \"Deus me livre de saber\", a próclise pode virar ênclise sem problema gramatical. III. Em \"Então ficou ouvindo…\", \"então\" pode ser trocado por \"não obstante\" sem mudar o sentido. IV. Em \"Ferida cavocada é o bonito\", \"bonito\" está correto porque o artigo \"o\" o substantiva. Estão corretos:",
  alts:{A:"todos.",B:"apenas um.",C:"apenas dois.",D:"apenas três."}, gab:"C", gabTipo:"oficial",
  res:["I: \"espiando banho\" é oração reduzida de gerúndio com valor adverbial. Correto.","II: frase optativa (desejo) exige próclise: \"Deus me livre\". Incorreto.","III: \"não obstante\" é concessivo e mudaria o sentido. Incorreto.","IV: \"o bonito\" é adjetivo substantivado. Correto. Dois corretos: alternativa C."] },
{ id:"ep27-43", inst:"EPCAR", ano:2026, fonte:"epcar27", num:43, materia:"Português", assunto:"sintaxe", dif:3,
  enun:"Num texto sobre a \"tirania da produtividade\", aparece a expressão \"estratégia de sobrevivência\". Em relação ao substantivo \"estratégia\", a locução \"de sobrevivência\":",
  alts:{A:"indica a matéria de que algo é feito.",B:"nomeia o agente da ação.",C:"acrescenta uma circunstância.",D:"especifica a finalidade do substantivo."}, gab:"D", gabTipo:"oficial",
  res:["\"Estratégia de sobrevivência\" = estratégia para sobreviver.","A locução indica a finalidade (para quê). Alternativa D."] },

/* ================= Português — CN 2020 (verificado) ================= */
{ id:"cn20-p1", inst:"CN", ano:2020, fonte:"cn20", materia:"Português", assunto:"crase", dif:2,
  enun:"Assinale a opção em que o acento indicativo de crase foi empregado corretamente.",
  alts:{A:"As novas tecnologias têm gerado muito estranhamento à pessoas que não nasceram na era digital.",B:"As notícias falsas começam à chegar rapidamente através da internet.",C:"O problema das fake news é um assunto sério relativo à toda a sociedade contemporânea.",D:"Em relação as notícias falsas, devemos procurar iniciativas que nos levem à uma solução imediata.",E:"Textos alarmistas e sensacionalistas ganham destaque à medida que vão sendo compartilhados."}, gab:"E", gabTipo:"verificado",
  res:["Não há crase antes de palavra no plural sem artigo (A), de verbo (B), de \"toda\" (C) e de \"uma\" (D). Em D faltou a crase em \"em relação às\".","\"À medida que\" é locução conjuntiva feminina: crase obrigatória.","Alternativa E."] },
{ id:"cn20-p2", inst:"CN", ano:2020, fonte:"cn20", materia:"Português", assunto:"sintaxe", dif:3,
  enun:"Assinale a opção em que a colocação do pronome oblíquo NÃO está de acordo com a norma-padrão.",
  alts:{A:"Já me enviaram uma ou outra mensagem contendo notícias falsas.",B:"Se o mundo corporativo despreocupar-se com as fake news, fechará as portas para o mercado.",C:"Confia-se nas mensagens a ponto de compartilhá-las, sem questionar suas origens.",D:"Atualmente, convivemos com uma tecnologia que nos fascina e facilita muito a vida.",E:"Nada nem ninguém nos preparou para as mudanças tecnológicas que vivemos hoje."}, gab:"B", gabTipo:"verificado",
  res:["Palavras atrativas (advérbio, \"que\", pronome indefinido, conjunção subordinativa) puxam o pronome para antes do verbo.","Em B, a conjunção \"se\" (condicional) exige próclise: \"Se o mundo corporativo se despreocupar…\".","Alternativa B."] },
{ id:"cn20-p3", inst:"CN", ano:2020, fonte:"cn20", materia:"Português", assunto:"concordancia", dif:3,
  enun:"Em \"Eu tenho muitos livros\", a palavra \"muitos\" concorda corretamente com o substantivo. Assinale a opção em que também há concordância nominal correta.",
  alts:{A:"A autora ficou meia preocupada com as críticas a seu novo livro.",B:"Nos dias atuais, há bastante pessoas que admiram os novos escritores.",C:"Uma boa leitura é necessário para passar o tempo rapidamente.",D:"O autor enviou os próximos capítulos do livro anexos ao contrato.",E:"A escritora mesmo participou da apresentação comentada de seu livro."}, gab:"D", gabTipo:"verificado",
  res:["A: \"meio\" advérbio não varia (meio preocupada). B: \"bastante\" adjetivo varia (bastantes pessoas).","C: com artigo, o adjetivo concorda (é necessária). E: \"mesma\" concorda com \"escritora\".","D: \"anexos\" concorda com \"capítulos\". Alternativa D."] },
{ id:"cn20-p4", inst:"CN", ano:2020, fonte:"cn20", materia:"Português", assunto:"classes", dif:3,
  enun:"Assinale a opção em que o substantivo tem plural metafônico, isto é, o \"o\" fechado do singular passa a aberto no plural.",
  alts:{A:"trocos",B:"bolsos",C:"polvos",D:"sogros",E:"almoços"}, gab:"C", gabTipo:"verificado",
  res:["Metafonia: pôlvo (ô) → pólvos (ó), como ôvo → óvos.","Trocos, bolsos, sogros e almoços mantêm o \"o\" fechado no plural.","Alternativa C."] },
{ id:"cn20-p5", inst:"CN", ano:2020, fonte:"cn20", materia:"Português", assunto:"coesao", dif:3,
  enun:"Reescreva mantendo o sentido e a norma-padrão: \"De vez em quando, por acreditar no que chega por meio de amigos no seu WhatsApp, me envia uma ou outra mensagem contendo uma fake news.\"",
  alts:{A:"Às vezes, para acreditar no que chega através de amigos no seu WhatsApp, me traz uma ou outra mensagem contendo uma fake news.",B:"Uma vez por dia, para acreditar no que chega por culpa de amigos no seu WhatsApp, me encaminha uma ou outra mensagem contendo uma fake news.",C:"Raramente, ao acreditar no que chega por causa de amigos no seu WhatsApp, destina-me uma ou outra mensagem contendo uma fake news.",D:"Dia sim, dia não, como acredita no que chega através de amigos no seu WhatsApp, me destina uma ou outra mensagem contendo uma fake news.",E:"Vez por outra, como acredita no que chega através de amigos no seu WhatsApp, encaminha-me uma ou outra mensagem contendo uma fake news."}, gab:"E", gabTipo:"verificado",
  res:["\"De vez em quando\" = vez por outra (frequência ocasional). \"Por acreditar\" indica causa = \"como acredita\".","A e B trocam causa por finalidade (\"para\"); B e D mudam a frequência; C troca por \"raramente\" e por valor temporal.","Alternativa E."] },
{ id:"cn20-p6", inst:"CN", ano:2020, fonte:"cn20", materia:"Português", assunto:"sintaxe", dif:3,
  enun:"Em \"Ninguém nos preparou para essas mudanças que revolucionaram a comunicação\", o pronome relativo \"que\" é sujeito. Em qual opção o pronome relativo tem a mesma função?",
  alts:{A:"As informações diárias que nós recebemos pelos celulares podem ser falsas.",B:"O jornalista de quem peguei as últimas informações descartou a possibilidade de fake news.",C:"Esses são os jornalistas por quem as notícias sensacionalistas foram analisadas.",D:"O processo democrático a que somos favoráveis corre risco.",E:"Conhecemos o jornalista que defenderá o problema nas redes sociais."}, gab:"E", gabTipo:"verificado",
  res:["Troque o relativo pelo antecedente: \"o jornalista defenderá o problema\" — é o sujeito de \"defenderá\".","A: objeto direto (recebemos as informações). B: complemento com \"de\". C: agente da passiva. D: complemento nominal de \"favoráveis\".","Alternativa E."] },
{ id:"cn20-p7", inst:"CN", ano:2020, fonte:"cn20", materia:"Português", assunto:"sintaxe", dif:4,
  enun:"No trecho \"Um dos maiores estudos sobre notícias falsas, publicado no ano passado na revista Science, foi realizado pelo Instituto de Tecnologia de Massachusetts\", os termos \"no ano passado\" e \"pelo Instituto de Tecnologia de Massachusetts\" exercem, respectivamente, a função de:",
  alts:{A:"adjunto adverbial e agente da passiva.",B:"objeto indireto e complemento nominal.",C:"complemento nominal e objeto indireto.",D:"adjunto adverbial e predicativo do objeto.",E:"predicativo do sujeito e agente da passiva."}, gab:"A", gabTipo:"verificado",
  res:["\"No ano passado\" indica tempo: adjunto adverbial.","\"Foi realizado pelo Instituto…\" está na voz passiva; quem pratica a ação é o agente da passiva.","Alternativa A."] },
{ id:"cn20-p8", inst:"CN", ano:2020, fonte:"cn20", materia:"Português", assunto:"interpretacao", dif:2,
  enun:"Num texto sobre fake news, o autor afirma: \"Confia-se a ponto de compartilhar, sem questionar.\" Infere-se que:",
  alts:{A:"a falta de entendimento básico faz com que as pessoas apostem em notícias fantasiosas.",B:"o compartilhamento de notícias falsas ocorre apenas quando a informação agrada o indivíduo.",C:"as informações falsas apelam diretamente para a parte emocional do leitor.",D:"o indivíduo deixa de lado a crítica e a análise para confiar cegamente na informação recebida.",E:"a democratização da internet faz das redes sociais as únicas fontes de notícias falsas."}, gab:"D", gabTipo:"verificado",
  res:["\"A ponto de\" indica intensidade: a confiança é tanta que a pessoa compartilha.","\"Sem questionar\" = sem crítica. Alternativa D.","A, B, C e E trazem ideias que o trecho não afirma (ou generalizam com \"apenas\", \"únicas\")."] },

/* ================= História — CN 2022 (verificado) ================= */
{ id:"cn22-27", inst:"CN", ano:2022, fonte:"cn22", num:27, materia:"História", assunto:"independencia-imperio", dif:3,
  enun:"Sobre os desdobramentos da Guerra do Paraguai (1864–1870), assinale a afirmativa correta.",
  alts:{A:"O território paraguaio foi dividido entre Argentina, Uruguai e Brasil, em cláusula contestada pelos ingleses.",B:"O conflito trouxe derrotas a Brasil, Argentina e Uruguai, mostrando a força do Paraguai, apoiado por Reino Unido e EUA.",C:"Originou a Guerra do Prata, entre Argentina e Brasil, retomando rivalidades da Guerra Cisplatina.",D:"Consolidou as fronteiras e fez toda a classe militar concluir que a monarquia deveria ser mantida.",E:"Apesar da vitória, as finanças brasileiras foram muito afetadas, e parte dos militares sentia que a Monarquia não lhes dava reconhecimento e apoio."}, gab:"E", gabTipo:"verificado", gabNota:"Coincide com a correção comentada do Estratégia Militares.",
  res:["A guerra aumentou a dívida externa (empréstimos britânicos) e fortaleceu o Exército, que passou a cobrar prestígio do governo imperial.","Esse descontentamento ajudou a aproximar militares da República.","A Guerra do Prata foi antes (1851–52) e o Paraguai não teve apoio britânico. Alternativa E."] },
{ id:"cn22-28", inst:"CN", ano:2022, fonte:"cn22", num:28, materia:"História", assunto:"brasil-colonia", dif:3,
  enun:"A França Antártica (Rio de Janeiro, 1555–1567) e a França Equinocial (Maranhão, 1612–1615) acabaram com a expulsão dos franceses. Que fatores contribuíram para isso?",
  alts:{A:"Apoio espanhol e inglês levou Portugal a aliar-se aos holandeses, que expulsaram os franceses.",B:"Falta de recursos, disputas internas entre católicos e huguenotes e alianças entre portugueses e indígenas deixaram os franceses em desvantagem.",C:"O surgimento da Igreja Anglicana enfraqueceu os colonos franceses, que voltaram à Europa.",D:"A exploração de prata nos domínios espanhóis atraiu os colonos franceses para fora das colônias.",E:"A Contrarreforma, com apoio total da França, levou à rendição sem resistência."}, gab:"B", gabTipo:"verificado", gabNota:"Coincide com a correção comentada do Estratégia Militares.",
  res:["As colônias francesas sofriam com os conflitos religiosos da França (católicos × huguenotes) e com pouco apoio.","Portugueses, com aliados indígenas, aproveitaram essa fraqueza.","Alternativa B."] },
{ id:"cn22-29", inst:"CN", ano:2022, fonte:"cn22", num:29, materia:"História", assunto:"republica", dif:2,
  enun:"Sobre a economia brasileira entre 1895 e 1930, assinale a afirmativa correta.",
  alts:{A:"Mesmo com o café como principal exportação, houve impulso à industrialização, em parte financiada por capitais de cafeicultores.",B:"O principal produto exportado foi o açúcar refinado, graças a engenhos modernizados pelo governo.",C:"Houve auge da indústria de bens de capital com rodovias que substituíram as ferrovias.",D:"A indústria de base foi a principal atividade do setor secundário.",E:"Novas jazidas de ouro perto do Rio de Janeiro atraíram indústrias estrangeiras."}, gab:"A", gabTipo:"verificado", gabNota:"Coincide com a correção comentada do Estratégia Militares.",
  res:["Lucros do café foram reinvestidos em bancos, comércio e fábricas.","Rodovias ganham força com JK (anos 1950) e a indústria de base com Vargas (CSN, Vale).","Alternativa A."] },
{ id:"cn22-30", inst:"CN", ano:2022, fonte:"cn22", num:30, materia:"História", assunto:"guerras-mundiais", dif:2,
  enun:"Sobre a participação militar do Brasil na Segunda Guerra Mundial: I. Os militares atuaram só como observadores e o Brasil foi neutro durante todo o conflito. II. O envio de militares à Itália marcou a participação ao lado dos Aliados, após o estado de guerra declarado em agosto de 1942. III. A participação ao lado do Eixo foi fundamental para as vitórias alemãs até 1941. Está correto o que se afirma apenas em:",
  alts:{A:"I.",B:"II.",C:"III.",D:"I e II.",E:"II e III."}, gab:"B", gabTipo:"verificado", gabNota:"Coincide com a correção comentada do Estratégia Militares.",
  res:["Em 1942 o Brasil declarou guerra ao Eixo; a FEB foi enviada à Itália em 1944.","I e III são falsas: o Brasil deixou a neutralidade e lutou contra o Eixo.","Alternativa B."] },
{ id:"cn22-31", inst:"CN", ano:2022, fonte:"cn22", num:31, materia:"História", assunto:"independencia-imperio", dif:3,
  enun:"Sobre o processo de independência do Brasil, assinale a afirmativa correta.",
  alts:{A:"Houve apenas combates na Cisplatina, contra invasores argentinos e paraguaios.",B:"Mercenários e populares lutaram em todo o litoral contra forças inglesas.",C:"Houve lutas entre forças brasileiras e tropas portuguesas fiéis a Lisboa, que resistiram na Bahia, no Maranhão, no Grão-Pará e na Cisplatina até serem expulsas, com a adesão ao Império.",D:"O processo foi totalmente pacífico, concluído com o reconhecimento internacional.",E:"A independência só se completou após combates contra outros países americanos, inclusive os EUA."}, gab:"C", gabTipo:"verificado", gabNota:"Coincide com a correção comentada do Estratégia Militares.",
  res:["Tropas portuguesas resistiram em várias províncias; D. Pedro I contratou mercenários como Lorde Cochrane.","A independência na Bahia, por exemplo, só se completou em 2 de julho de 1823.","Alternativa C."] },
{ id:"cn22-32", inst:"CN", ano:2022, fonte:"cn22", num:32, materia:"História", assunto:"brasil-colonia", dif:3,
  enun:"Sobre o Tratado de Tordesilhas (1494), assinado por Portugal e Espanha, assinale a opção correta.",
  alts:{A:"Foi obtido por pressão espanhola para que as terras a 100 léguas de Cabo Verde ficassem com a Espanha.",B:"Previa a exploração conjunta de todo o Atlântico pelos dois países.",C:"Resultou da pressão espanhola após a Bula Inter Coetera (1493).",D:"Foi assinado após D. João II ameaçar guerra à Espanha, por considerar desvantajosa a Bula Inter Coetera, que dava a Portugal uma área menor.",E:"Portugal continuou a considerá-lo desvantajoso, pois impedia bases no Atlântico Sul."}, gab:"D", gabTipo:"verificado", gabNota:"Coincide com a correção comentada do Estratégia Militares.",
  res:["A Bula Inter Coetera fixava a linha a 100 léguas de Cabo Verde, desfavorável a Portugal.","D. João II pressionou e o tratado levou a linha para 370 léguas.","Alternativa D."] },

/* ================= História — CN 2020 (verificado) ================= */
{ id:"cn20-h1", inst:"CN", ano:2020, fonte:"cn20", materia:"História", assunto:"republica", dif:2,
  enun:"A partir do discurso de Ulysses Guimarães na promulgação da Constituição (5/10/1988), assinale a opção correta sobre a Constituição de 1988.",
  alts:{A:"Tornou o voto facultativo para maiores de 16 anos e obrigatório para analfabetos.",B:"Instituiu licença-paternidade de cinco dias e licença à gestante de 180 dias.",C:"Permitiu decretar um novo AI-5, desde que aprovado pelo Congresso.",D:"Determinou que a prática do racismo é crime inafiançável e imprescritível, sujeito à pena de reclusão.",E:"Ao invocar a proteção de Deus, instituiu o cristianismo como religião oficial."}, gab:"D", gabTipo:"verificado",
  res:["O art. 5º, XLII, define o racismo como crime inafiançável e imprescritível.","O voto é facultativo para analfabetos e jovens de 16–17 anos; a licença-gestante é de 120 dias; o Estado é laico.","Alternativa D."] },
{ id:"cn20-h2", inst:"CN", ano:2020, fonte:"cn20", materia:"História", assunto:"republica", dif:3,
  enun:"Em 1993 a inflação passou de 2 700% ao ano; em 1994 veio a URV e, em 1º de julho, o Real. Sobre o Plano Real, é correto afirmar:",
  alts:{A:"Foi lançado por Itamar Franco e garantiu a reeleição do presidente.",B:"Foi implantado por Fernando Collor, com bloqueio de contas bancárias.",C:"Foi implantado por Fernando Henrique Cardoso, que acabou com a inflação congelando salários.",D:"Foi implementado no governo Itamar Franco, que, entre outras medidas, equiparou a moeda ao dólar e controlou a inflação.",E:"Chamava-se inicialmente Plano Cruzado e foi lançado por FHC."}, gab:"D", gabTipo:"verificado",
  res:["O Real foi lançado no governo Itamar Franco (FHC era ministro da Fazenda).","O real começou valendo 1 dólar (âncora cambial). Não houve congelamento nem bloqueio de contas (isso foi o Plano Collor).","Alternativa D."] },
{ id:"cn20-h3", inst:"CN", ano:2020, fonte:"cn20", materia:"História", assunto:"brasil-colonia", dif:3,
  enun:"Portugueses e espanhóis se expandiram além da linha de Tordesilhas e depois fixaram fronteiras por tratados. Sobre os tratados que definiram o território brasileiro no período colonial, assinale a correta.",
  alts:{A:"O Tratado de Rio Negro, assinado pelo Barão do Rio Branco, anexou o Acre.",B:"O Tratado de Badajós, entre Portugal e França, reconheceu a Guiana Francesa.",C:"O primeiro Tratado de Utrecht fixou o Oiapoque como limite com a atual Venezuela.",D:"As guerras guaraníticas resultaram do Tratado de Badajós.",E:"O Tratado de Madri passou a Colônia do Sacramento aos espanhóis e os Sete Povos das Missões aos portugueses."}, gab:"E", gabTipo:"verificado",
  res:["Madri (1750) aplicou o princípio do uti possidetis e trocou Sacramento pelos Sete Povos.","O Acre veio pelo Tratado de Petrópolis (1903); as guerras guaraníticas resultaram de Madri; Utrecht fixou o Oiapoque com a França.","Alternativa E."] },
{ id:"cn20-h4", inst:"CN", ano:2020, fonte:"cn20", materia:"História", assunto:"independencia-imperio", dif:3,
  enun:"Uma pauta alfandegária do Segundo Reinado tributou 2 919 artigos importados: o imposto passou de 15% para 30% e muitos itens chegaram a 40%, 50% ou 60%. Essa medida foi a:",
  alts:{A:"Tarifa Alves Branco, voltada a resolver o déficit das finanças públicas.",B:"Tarifa Silva Ferraz, que reduziu impostos sobre máquinas e ferramentas.",C:"reforma de Rui Barbosa, o encilhamento.",D:"política do funding loan de Campos Sales.",E:"Tratado de Comércio e Navegação com a Inglaterra."}, gab:"A", gabTipo:"verificado",
  res:["A Tarifa Alves Branco (1844) elevou as taxas de importação para 30% a 60%.","Seu objetivo principal era aumentar a arrecadação; o estímulo à indústria foi um efeito.","Alternativa A."] },
{ id:"cn20-h5", inst:"CN", ano:2020, fonte:"cn20", materia:"História", assunto:"republica", dif:2,
  enun:"A cisão entre as elites dos grandes estados em 1929 levou ao fim da Primeira República. Assinale a opção que identifica corretamente acontecimentos da Era Vargas.",
  alts:{A:"Em 1930, a Aliança Liberal lançou Júlio Prestes à presidência.",B:"Vargas impulsionou a industrialização, tendo a Usina Siderúrgica de Volta Redonda (RJ) como obra emblemática.",C:"A população agrária cresceu em relação à urbana.",D:"No Estado Novo, AIB e ANL se aliaram contra o regime.",E:"O DIP era um órgão policial de repressão violenta."}, gab:"B", gabTipo:"verificado",
  res:["A CSN, em Volta Redonda, é símbolo da industrialização de base de Vargas.","A Aliança Liberal lançou Vargas (Júlio Prestes era o candidato oficial); o DIP cuidava de propaganda e censura.","Alternativa B."] },
{ id:"cn20-h6", inst:"CN", ano:2020, fonte:"cn20", materia:"História", assunto:"republica", dif:4,
  enun:"A industrialização brasileira ganhou força a partir dos anos 1930, favorecida por condições internas e externas. Sobre esse processo, assinale a correta.",
  alts:{A:"Antes de 1930 não havia nenhuma manufatura no país, por causa da Primeira Guerra e da crise de 1929.",B:"A expressão \"substituição de importações\" se refere ao fato de o crescimento industrial depender de conjunturas externas, como as guerras mundiais e as oscilações dos mercados e dos juros internacionais.",C:"O processo se consolidou com Vargas por meio do incentivo ao capital externo na indústria de base.",D:"Desde os anos 1950, a ênfase em bens duráveis garantiu forte dinamismo até os anos 1980.",E:"Entre 1969 e 1973 houve crise por falta de capitais internacionais."}, gab:"B", gabTipo:"verificado",
  res:["Crises externas (guerras, 1929) dificultavam importar, e o país passou a produzir o que comprava de fora.","Já havia indústrias antes de 1930 (A); Vargas apostou no Estado e no nacionalismo (C); 1969–73 foi o \"milagre econômico\" (E).","Alternativa B."] },
{ id:"cn20-h7", inst:"CN", ano:2020, fonte:"cn20", materia:"História", assunto:"brasil-colonia", dif:2,
  enun:"Um texto descreve escravizados que circulavam pela cidade oferecendo serviços para entregar ao senhor uma quantia combinada e se sustentar com o restante. O trabalho reduzia os gastos dos senhores e dava alguma autonomia aos cativos. Essa modalidade se chamava:",
  alts:{A:"escravo do eito.",B:"escravo doméstico.",C:"escravo de ganho.",D:"escravo \"tigre\".",E:"escravo da liteira."}, gab:"C", gabTipo:"verificado",
  res:["Escravos de ganho vendiam produtos ou serviços nas ruas e repassavam parte do ganho ao senhor.","Alternativa C."] },

/* ================= História — PSACN 2007 e 2006 (verificado) ================= */
{ id:"ps07-14", inst:"CN", ano:2007, fonte:"psacn07", num:14, materia:"História", assunto:"independencia-imperio", dif:3,
  enun:"Na Guerra do Paraguai, sob o comando de Caxias, o Brasil obteve em dezembro de 1868 uma série de vitórias rápidas, a \"Dezembrada\". Que batalhas a compõem?",
  alts:{A:"Itororó, Avaí, Angostura e Lomas Valentinas.",B:"Riachuelo, Curupaiti, Tuiuti e Humaitá.",C:"Riachuelo, Avaí, Angostura e Humaitá.",D:"Curupaiti, Tuiuti, Angostura e Lomas Valentinas.",E:"Avaí, Tuiuti, Curupaiti e Lomas Valentinas."}, gab:"A", gabTipo:"verificado",
  res:["Riachuelo (1865), Tuiuti (1866) e Curupaiti (1866) são anteriores.","Em dezembro de 1868: Itororó, Avaí, Lomas Valentinas e Angostura.","Alternativa A."] },
{ id:"ps07-15", inst:"CN", ano:2007, fonte:"psacn07", num:15, materia:"História", assunto:"independencia-imperio", dif:3,
  enun:"No Período Regencial (1831–1840), os proprietários se dividiam em tendências políticas. Qual grupo está corretamente descrito?",
  alts:{A:"Liberal exaltado ou chimango: defendia a monarquia centralizada e a escravidão.",B:"Restaurador ou caramuru: defendia a volta de D. Pedro I e reunia comerciantes portugueses, militares conservadores e altos funcionários.",C:"Liberal exaltado ou caramuru: defendia governo centralizado.",D:"Liberal moderado ou chimango: defendia a volta de D. Pedro I.",E:"Restaurador ou caramuru: defendia a ordem vigente, liderado por José Bonifácio."}, gab:"B", gabTipo:"verificado",
  res:["Chimangos = liberais moderados; jurujubas (farroupilhas) = exaltados; caramurus = restauradores.","Os caramurus queriam o retorno de D. Pedro I.","Alternativa B."] },
{ id:"ps07-16", inst:"CN", ano:2007, fonte:"psacn07", num:16, materia:"História", assunto:"independencia-imperio", dif:3,
  enun:"Sobre os acontecimentos que antecederam a Independência, assinale a correta.",
  alts:{A:"O \"Partido Brasileiro\", grupo heterogêneo, uniu-se momentaneamente contra as Cortes de Lisboa e o projeto de recolonização.",B:"O Dia do Fico não representou avanço rumo ao rompimento com Portugal.",C:"A aristocracia rural queria uma monarquia absolutista.",D:"O ministério liderado por Antônio Carlos criou o \"Cumpra-se\".",E:"A convocação da Constituinte, em junho de 1822, transformou profundamente a economia e a sociedade."}, gab:"A", gabTipo:"verificado",
  res:["Grupos com interesses diferentes se uniram contra a tentativa das Cortes de recolonizar o Brasil.","O Fico foi um passo para a ruptura; o \"Cumpra-se\" é do ministério de José Bonifácio.","Alternativa A."] },
{ id:"ps07-18", inst:"CN", ano:2007, fonte:"psacn07", num:18, materia:"História", assunto:"brasil-colonia", dif:3,
  enun:"França, Inglaterra e Países Baixos contestaram o Tratado de Tordesilhas. Qual fato demonstra esse questionamento?",
  alts:{A:"A presença holandesa no comércio do açúcar de Pernambuco.",B:"A presença francesa no Maranhão, com a fundação de São Luís no fim do século XVI.",C:"Piratas ingleses financiados pela Coroa que fundaram colônias no Brasil.",D:"A invasão holandesa ao Recife, motivada unicamente pelos conflitos com a Espanha.",E:"A presença francesa nos primeiros tempos da colonização, com a França Antártica no Rio de Janeiro."}, gab:"E", gabTipo:"verificado",
  res:["A França Antártica (1555) foi uma ocupação direta de terras portuguesas, desafiando Tordesilhas.","São Luís foi fundada em 1612 (século XVII); a invasão holandesa teve vários motivos.","Alternativa E."] },
{ id:"ps07-19", inst:"CN", ano:2007, fonte:"psacn07", num:19, materia:"História", assunto:"republica", dif:2,
  enun:"Uma notícia de 2000 falava na retomada de um programa criado no fim de 1975, durante a crise do petróleo. Trata-se do:",
  alts:{A:"projeto de Itaipu.",B:"projeto de gás na Bolívia.",C:"Programa Nacional do Álcool (Proálcool).",D:"Projeto Nuclear Brasileiro.",E:"acordo petrolífero com México e Venezuela."}, gab:"C", gabTipo:"verificado",
  res:["O Proálcool foi criado em novembro de 1975 para reduzir a dependência do petróleo importado.","Alternativa C."] },
{ id:"ps07-21", inst:"CN", ano:2007, fonte:"psacn07", num:21, materia:"História", assunto:"independencia-imperio", dif:3,
  enun:"Uma charge de Angelo Agostini mostra o marechal Deodoro sendo afastado pelo gabinete ministerial. O episódio faz parte da:",
  alts:{A:"Questão Religiosa.",B:"Questão Militar, motivada pela punição de militares que criticaram publicamente o tratamento dado ao Exército.",C:"insubordinação após a Guerra da Cisplatina.",D:"\"Revolta Militar\" ligada à campanha contra Aguirre.",E:"Revolta Religiosa em apoio a D. Pedro II."}, gab:"B", gabTipo:"verificado",
  res:["Nos anos 1880, oficiais punidos por falar à imprensa (Sena Madureira, Cunha Matos) geraram a Questão Militar; Deodoro os apoiou e foi afastado.","Alternativa B."] },
{ id:"ps07-22", inst:"CN", ano:2007, fonte:"psacn07", num:22, materia:"História", assunto:"brasil-colonia", dif:3,
  enun:"Sobre a Conjuração Baiana, assinale a correta.",
  alts:{A:"A Coroa executou todos os envolvidos.",B:"Os conjurados queriam levar mão de obra da cidade para o campo.",C:"A direção era formada só por pessoas pobres.",D:"Os conspiradores queriam autonomia, mas divergiam sobre mudanças internas; a elite se afastou quando as camadas populares defenderam o fim de privilégios e da escravidão.",E:"O trabalho livre com indenização aos senhores era a bandeira intransigente dos líderes populares."}, gab:"D", gabTipo:"verificado",
  res:["O movimento começou com participação de letrados e ganhou caráter popular (alfaiates, soldados).","Com a defesa do fim da escravidão, a elite se afastou. Só quatro foram executados.","Alternativa D."] },
{ id:"ps07-23", inst:"CN", ano:2007, fonte:"psacn07", num:23, materia:"História", assunto:"republica", dif:3,
  enun:"A CLT (1943) reuniu leis trabalhistas do período Vargas. Ela trazia:",
  alts:{A:"jornada semanal de 44 horas e sindicatos independentes.",B:"13º salário e FGTS.",C:"sindicatos independentes e institutos de previdência.",D:"salário mínimo, férias, jornada diária de até oito horas, proteção ao trabalho da mulher e do menor e estabilidade.",E:"FGTS e aposentadoria para camponeses."}, gab:"D", gabTipo:"verificado",
  res:["O 13º é de 1962, o FGTS de 1966 e as 44 horas de 1988.","Os sindicatos eram atrelados ao Estado. Alternativa D."] },
{ id:"ps06-14", inst:"CN", ano:2006, fonte:"psacn06", num:14, materia:"História", assunto:"independencia-imperio", dif:2,
  enun:"Os conflitos do século XIX entre Brasil, Uruguai, Argentina e Paraguai foram motivados principalmente:",
  alts:{A:"apenas pelo desejo de impedir a industrialização do Paraguai.",B:"pela rivalidade entre liberais e conservadores.",C:"pela consolidação do Tratado de Madri.",D:"pelas disputas pelo controle da bacia do Rio da Prata.",E:"pela oposição entre trabalho assalariado e escravismo."}, gab:"D", gabTipo:"verificado",
  res:["A navegação e o comércio pelos rios Paraná, Paraguai e Uruguai eram estratégicos.","Alternativa D."] },
{ id:"ps06-15", inst:"CN", ano:2006, fonte:"psacn06", num:15, materia:"História", assunto:"brasil-colonia", dif:2,
  enun:"No sistema de Capitanias Hereditárias:",
  alts:{A:"o território ficava subordinado a um Governador-Geral.",B:"o governo português executaria toda a colonização com capital privado.",C:"o governo português transferia aos donatários a responsabilidade financeira da colonização.",D:"buscava-se um poder político centralizado.",E:"as comunidades eram independentes do Estado português."}, gab:"C", gabTipo:"verificado",
  res:["Sem recursos, a Coroa entregou as terras a donatários, que bancariam a ocupação.","O Governo-Geral (1548) veio depois, para centralizar. Alternativa C."] },
{ id:"ps06-16", inst:"CN", ano:2006, fonte:"psacn06", num:16, materia:"História", assunto:"brasil-colonia", dif:3,
  enun:"A Conjuração Baiana (1798):",
  alts:{A:"teve participação de membros da elite, mas caráter acentuadamente popular.",B:"foi elitista e não quis alterar a estrutura escravista.",C:"queria a república mantendo o escravismo.",D:"teve participação popular, mas foi decididamente elitista.",E:"não se diferenciou da Inconfidência Mineira."}, gab:"A", gabTipo:"verificado",
  res:["Alfaiates, soldados e escravizados tiveram papel central, e o movimento defendia igualdade e o fim da escravidão.","Por isso é chamada também de Revolta dos Alfaiates. Alternativa A."] },
{ id:"ps06-17", inst:"CN", ano:2006, fonte:"psacn06", num:17, materia:"História", assunto:"independencia-imperio", dif:2,
  enun:"Após a Independência (1822), o novo regime foi marcado pela adoção de uma monarquia que:",
  alts:{A:"era liberal, com autonomia provincial.",B:"era absolutista e defendia a burguesia.",C:"protegia os cafeicultores do oeste paulista.",D:"era parlamentar, com autonomia provincial.",E:"preservava os interesses básicos dos proprietários de terras e de escravos."}, gab:"E", gabTipo:"verificado",
  res:["A Independência manteve a escravidão e o latifúndio.","O oeste paulista só ganha força depois de 1850; o Império foi centralizado. Alternativa E."] },
{ id:"ps06-18", inst:"CN", ano:2006, fonte:"psacn06", num:18, materia:"História", assunto:"independencia-imperio", dif:2,
  enun:"No Segundo Reinado, dizia-se que liberais e conservadores eram \"farinha do mesmo saco\" porque:",
  alts:{A:"representavam basicamente a elite agrária latifundiária e escravista.",B:"defendiam total subordinação das províncias.",C:"queriam a república federalista.",D:"defendiam a abolição gradual.",E:"defendiam a autonomia do Ato Adicional."}, gab:"A", gabTipo:"verificado",
  res:["Os dois partidos vinham da mesma elite e se alternavam no poder sem mudanças profundas.","Alternativa A."] },
{ id:"ps06-20", inst:"CN", ano:2006, fonte:"psacn06", num:20, materia:"História", assunto:"independencia-imperio", dif:2,
  enun:"Sobre a Constituição de 1824, é correto afirmar que:",
  alts:{A:"subordinou o Legislativo e o Moderador ao Executivo.",B:"garantiu autonomia às províncias, no modelo dos EUA.",C:"deu direito de voto a todos, exceto escravizados.",D:"deu predomínio ao imperador sobre os demais poderes, por meio do Poder Moderador.",E:"criou o Poder Moderador para atuar junto ao Legislativo."}, gab:"D", gabTipo:"verificado",
  res:["O Poder Moderador, exclusivo do imperador, permitia intervir nos outros poderes.","O voto era censitário. Alternativa D."] },
{ id:"ps06-21", inst:"CN", ano:2006, fonte:"psacn06", num:21, materia:"História", assunto:"republica", dif:3,
  enun:"Um episódio é lembrado como aquele em que \"o vencedor militar perdeu e o derrotado militar venceu\". Trata-se da:",
  alts:{A:"Revolução de 1930.",B:"Revolução Constitucionalista de 1932.",C:"Revolução Paulista de 1924.",D:"Intentona Comunista de 1935.",E:"Intentona Integralista de 1938."}, gab:"B", gabTipo:"verificado",
  res:["São Paulo foi derrotado em 1932, mas a principal exigência (uma Constituição) foi atendida em 1934.","Alternativa B."] },
{ id:"ps06-22", inst:"CN", ano:2006, fonte:"psacn06", num:22, materia:"História", assunto:"republica", dif:2,
  enun:"Em 1929 o Brasil produziu cerca de 21 milhões de sacas de café, mas exportou só 14 milhões. A queda estava ligada:",
  alts:{A:"à crise econômica, com a superprodução norte-americana e a quebra da Bolsa de Nova York.",B:"ao Tratado de Versalhes.",C:"à corrida imperialista na África e na Ásia.",D:"ao café colombiano.",E:"ao tenentismo."}, gab:"A", gabTipo:"verificado",
  res:["A crise de 1929 derrubou o consumo e o preço do café, principal exportação brasileira.","Alternativa A."] },
{ id:"ps06-24", inst:"CN", ano:2006, fonte:"psacn06", num:24, materia:"História", assunto:"republica", dif:3,
  enun:"Um jingle da campanha presidencial de 1960 prometia varrer a corrupção. O vencedor teve 48% dos votos e renunciou em agosto de 1961. Identifique-o e uma característica do governo.",
  alts:{A:"Jânio Quadros; apoiou a Aliança para o Progresso e o isolamento de Cuba.",B:"Getúlio Vargas; reatou com a União Soviética.",C:"Getúlio Vargas; garantiu o monopólio das reservas minerais.",D:"João Goulart; mobilizou a sociedade por reformas de base.",E:"Jânio Quadros; defendia uma política externa independente e buscou reatar relações com a União Soviética."}, gab:"E", gabTipo:"verificado",
  res:["O símbolo da campanha de Jânio era a vassoura; ele renunciou em agosto de 1961.","Sua política externa independente aproximou o Brasil do bloco socialista (o reatamento com a URSS se concretizou em novembro de 1961). Ele se opôs ao isolamento de Cuba.","Alternativa E."] },
{ id:"ps06-25", inst:"CN", ano:2006, fonte:"psacn06", num:25, materia:"História", assunto:"republica", dif:1,
  enun:"Uma canção celebra Brasília, grande obra de um governo. Nesse governo foi criado o:",
  alts:{A:"Plano SALTE.",B:"Plano de Metas, com obras de infraestrutura e estímulo à industrialização.",C:"Plano Trienal.",D:"PND com câmbio flutuante.",E:"Plano Cruzado."}, gab:"B", gabTipo:"verificado",
  res:["Brasília foi construída no governo JK, cujo lema era \"50 anos em 5\".","Alternativa B."] },

/* ================= Geografia — CN 2020 (verificado) ================= */
{ id:"cn20-g1", inst:"CN", ano:2020, fonte:"cn20", materia:"Geografia", assunto:"geo-economia", dif:3,
  enun:"Sobre ferrovias e rodovias no Brasil: I. A expansão ferroviária começou no Segundo Reinado, ligada ao café, e o trem costuma ser mais barato que o caminhão. II. A malha ferroviária tem baixa conectividade e liga sobretudo áreas produtoras aos portos. III. As rodovias são o principal meio de transporte de cargas, apesar dos altos custos de manutenção. IV. Desde os anos 1990, o governo federal concede rodovias à iniciativa privada. Está correto o que se afirma em:",
  alts:{A:"II, apenas.",B:"III, apenas.",C:"I e IV, apenas.",D:"II e III, apenas.",E:"I, II, III e IV."}, gab:"E", gabTipo:"verificado",
  res:["As ferrovias do café surgem no Segundo Reinado; o frete ferroviário é mais barato em longas distâncias.","A malha é desconectada (ligações porto–interior) e o rodoviarismo domina as cargas.","As concessões de rodovias federais começaram em meados dos anos 1990. Todas corretas: alternativa E."] },
{ id:"cn20-g2", inst:"CN", ano:2020, fonte:"cn20", materia:"Geografia", assunto:"globalizacao", dif:3,
  enun:"Sobre as políticas neoliberais adotadas no Brasil, assinale a correta.",
  alts:{A:"Começaram nos anos 1970, com privatizações e abertura financeira.",B:"Estão associadas ao controle da inflação pelo Plano Real, baseado na valorização da moeda.",C:"Encareceram os produtos estrangeiros a partir dos anos 1990.",D:"Geraram balança comercial positiva por toda a década de 1990.",E:"Ampliaram o crédito estatal para a maioria das empresas."}, gab:"B", gabTipo:"verificado",
  res:["As reformas neoliberais ganham força nos anos 1990 (abertura, privatizações).","O Plano Real usou o real valorizado (âncora cambial) para segurar os preços, o que barateou importados.","Alternativa B."] },
{ id:"cn20-g3", inst:"CN", ano:2020, fonte:"cn20", materia:"Geografia", assunto:"biomas", dif:3,
  enun:"O El Niño (aquecimento anormal do Pacífico) altera a circulação atmosférica, as chuvas e as temperaturas. Qual correlação entre região brasileira e consequência está correta?",
  alts:{A:"Norte: mais chuva e menos incêndios florestais.",B:"Nordeste: estação chuvosa mais longa e temperaturas em queda acentuada.",C:"Centro-Oeste: chuvas torrenciais e quedas bruscas de temperatura.",D:"Sudeste: muita chuva o ano todo e quedas bruscas de temperatura no inverno.",E:"Sul: maior ocorrência de chuvas e elevação da temperatura."}, gab:"E", gabTipo:"verificado",
  res:["Com El Niño, o Sul tem chuvas acima da média e temperaturas mais altas.","Norte e Nordeste enfrentam secas (e mais queimadas); o Sudeste tende a invernos mais quentes.","Alternativa E."] },
{ id:"cn20-g4", inst:"CN", ano:2020, fonte:"cn20", materia:"Geografia", assunto:"populacao", dif:3,
  enun:"A partir do século XIX, com o fim do tráfico de escravizados, o Brasil recebeu muitos imigrantes. Sobre esses fluxos, assinale a correta.",
  alts:{A:"Os portugueses, grupo mais numeroso desde 1822, dedicaram-se só a atividades urbanas em São Paulo.",B:"Os italianos chegaram a partir de 1870 e foram primeiro para o RS e o PR, só depois para SP.",C:"Os espanhóis chegaram no fim do século XIX para as fazendas de café paulistas e estão entre os cinco maiores grupos europeus.",D:"Os alemães vieram ocupar sobretudo o Sudeste.",E:"Os japoneses chegaram na primeira metade do século XIX."}, gab:"C", gabTipo:"verificado",
  res:["Os espanhóis vieram em grande número para o café paulista no fim do século XIX.","Os italianos foram principalmente para SP; os alemães, para o Sul; os japoneses chegaram em 1908.","Alternativa C."] },
{ id:"cn20-g5", inst:"CN", ano:2020, fonte:"cn20", materia:"Geografia", assunto:"geo-economia", dif:3,
  enun:"O aumento da oferta e do consumo de energia no Brasil trouxe conforto e problemas ambientais. Assinale a correta.",
  alts:{A:"O petróleo é fonte renovável e a mais consumida, com maior produção no Rio de Janeiro.",B:"O gás natural é fonte não renovável, cujo consumo vem sendo incentivado; é considerado mais limpo e, por ser mais leve que o ar, dissipa-se com facilidade.",C:"O carvão mineral é fonte renovável, produzido sobretudo em Carajás (PA).",D:"A hidreletricidade é limpa e não causa problemas socioambientais.",E:"A biomassa não causa poluição nem desequilíbrio ambiental."}, gab:"B", gabTipo:"verificado",
  res:["Petróleo e carvão são não renováveis; o carvão brasileiro vem do Sul.","Hidrelétricas alagam áreas e deslocam populações; biomassa também polui.","Alternativa B."] },

/* ================= Geografia — PSACN 2007 e 2006 (verificado) ================= */
{ id:"ps07-01", inst:"CN", ano:2007, fonte:"psacn07", num:1, materia:"Geografia", assunto:"geo-economia", dif:3,
  enun:"Sobre a modernização da agropecuária brasileira, assinale a correta.",
  alts:{A:"A produção foi descentralizada pelos baixos preços da terra.",B:"O complexo agropecuário moderno do Centro-Sul está ligado às necessidades industriais e depende de fluxos financeiros.",C:"MS, MT e GO dependem da produtividade amazônica.",D:"O Nordeste não tem áreas de modernização intensa.",E:"A metade sul gaúcha é a maior produtora de soja do país."}, gab:"B", gabTipo:"verificado",
  res:["A agricultura moderna é integrada à indústria (máquinas, insumos, agroindústria) e ao crédito.","Há polos modernos no Nordeste (oeste baiano, vale do São Francisco) e o maior produtor de soja é MT.","Alternativa B."] },
{ id:"ps07-02", inst:"CN", ano:2007, fonte:"psacn07", num:2, materia:"Geografia", assunto:"relevo-hidro", dif:3,
  enun:"Sobre o Aquífero Guarani, assinale a correta.",
  alts:{A:"A reposição pelas chuvas impede o esgotamento e favorece o uso intensivo.",B:"Por estar sob áreas agrícolas, não é usado para abastecimento urbano.",C:"Cerca de 70% de sua extensão está no Brasil, o que garante o uso sustentável.",D:"O arenito impermeável impede a infiltração.",E:"A pureza das águas é ameaçada por adubos e defensivos que se infiltram, sobretudo no solo brasileiro."}, gab:"E", gabTipo:"verificado",
  res:["Nas áreas de recarga, agrotóxicos e fertilizantes podem contaminar o aquífero.","O arenito é poroso e permeável; muitas cidades usam suas águas; estar no Brasil não garante sustentabilidade.","Alternativa E."] },
{ id:"ps07-03", inst:"CN", ano:2007, fonte:"psacn07", num:3, materia:"Geografia", assunto:"regioes", dif:2,
  enun:"Sobre a Amazônia hoje, assinale a correta.",
  alts:{A:"A soberania está resolvida, pois não há conflitos de fronteira.",B:"A pressão internacional resolveu o problema ambiental.",C:"Os núcleos urbanos, mesmo ocupando pequena área, contribuem para a devastação por construções, lixo e esgoto sem tratamento.",D:"O potencial genético está protegido nas mãos das comunidades da floresta.",E:"O Plano Amazônia Sustentável freou a devastação na porção ocidental."}, gab:"C", gabTipo:"verificado",
  res:["As cidades amazônicas cresceram sem saneamento adequado, gerando impactos.","As demais afirmam que problemas complexos (soberania, biopirataria, desmatamento) já estariam resolvidos.","Alternativa C."] },
{ id:"ps07-05", inst:"CN", ano:2007, fonte:"psacn07", num:5, materia:"Geografia", assunto:"populacao", dif:2,
  enun:"Sobre o crescimento vegetativo brasileiro, assinale a correta.",
  alts:{A:"A mortalidade infantil só começou a cair nos anos 1980.",B:"Desde o fim dos anos 1960, a natalidade cai de forma generalizada, reduzindo o crescimento natural.",C:"A natalidade cai mais rápido no campo que na cidade.",D:"A fecundidade aumenta em todas as regiões.",E:"O número de jovens está aumentando."}, gab:"B", gabTipo:"verificado",
  res:["Urbanização, acesso a contraceptivos e mulheres no mercado de trabalho reduziram a natalidade.","A queda é mais rápida nas cidades; a população está envelhecendo.","Alternativa B."] },
{ id:"ps07-07", inst:"CN", ano:2007, fonte:"psacn07", num:7, materia:"Geografia", assunto:"relevo-hidro", dif:4,
  enun:"Sobre a relação entre eras geológicas e formas de relevo no Brasil, assinale a correta.",
  alts:{A:"As províncias Mantiqueira, Borborema e Tocantins, do Proterozoico, formaram-se no ciclo Brasiliano, e suas serras são vestígios de antigos dobramentos.",B:"As bacias do Paraná e do Parnaíba surgiram no fim do Mesozoico.",C:"No fim do Proterozoico, rochas magmáticas substituíram a sedimentação marinha pela continental.",D:"Os derrames de lava do \"Trapp\" do Paraná ocorreram no Arqueozoico.",E:"A Bacia Amazônica tem apenas sedimentos do Cenozoico."}, gab:"A", gabTipo:"verificado",
  res:["As faixas de dobramentos do ciclo Brasiliano são do Proterozoico; as serras são restos desgastados delas.","As grandes bacias sedimentares começam no Paleozoico; os derrames basálticos do Sul são do Mesozoico.","Alternativa A."] },
{ id:"ps07-09", inst:"CN", ano:2007, fonte:"psacn07", num:9, materia:"Geografia", assunto:"biomas", dif:3,
  enun:"Sobre os tipos climáticos do Brasil, assinale a correta.",
  alts:{A:"O clima equatorial tem temperaturas altas e pequenas amplitudes térmicas anuais, menores que as diárias.",B:"O clima tropical tem menor variação térmica que o equatorial.",C:"No semiárido, as chuvas se concentram no inverno.",D:"No litoral oriental do Nordeste, as chuvas se concentram na primavera e no verão.",E:"No clima subtropical, as amplitudes diárias superam as anuais."}, gab:"A", gabTipo:"verificado",
  res:["Na Amazônia a temperatura varia pouco ao longo do ano (cerca de 2 °C), menos que entre o dia e a noite.","No litoral oriental do Nordeste chove mais no outono-inverno; no Sul as amplitudes anuais são grandes.","Alternativa A."] },
{ id:"ps07-11", inst:"CN", ano:2007, fonte:"psacn07", num:11, materia:"Geografia", assunto:"geo-economia", dif:2,
  enun:"Sobre o etanol brasileiro como alternativa energética, assinale a correta.",
  alts:{A:"Não causa nenhum impacto ambiental.",B:"É produzido a partir do milho, mais barato que a cana.",C:"A tecnologia nacional para motores a álcool aumentou o interesse de outros países, favorecendo negócios para o Brasil.",D:"A cana é cultivada em terras pouco férteis, sem conflito com alimentos.",E:"Beneficiou principalmente os transportes coletivos."}, gab:"C", gabTipo:"verificado",
  res:["O etanol brasileiro vem da cana e o país domina a tecnologia de motores a álcool/flex.","A expansão da cana tem impactos (monocultura, queimadas) e disputa terras férteis.","Alternativa C."] },
{ id:"ps06-04", inst:"CN", ano:2006, fonte:"psacn06", num:4, materia:"Geografia", assunto:"geo-economia", dif:3,
  enun:"Sobre os Arranjos Produtivos Locais (APLs), assinale a INCORRETA.",
  alts:{A:"São aglomerações de empresas da mesma cadeia produtiva numa mesma cidade ou região.",B:"Resultam de iniciativa exclusivamente privada, sem incentivo de políticas públicas.",C:"A formalização das empresas ajuda a combater o trabalho infantil.",D:"A formalização permite vender para fora do estado legalmente.",E:"Criam empregos longe das metrópoles e aumentam a renda local."}, gab:"B", gabTipo:"verificado",
  res:["APLs recebem apoio de políticas públicas (governos, Sebrae, bancos públicos).","Por isso \"exclusivamente privada\" é falso. Alternativa B."] },
{ id:"ps06-05", inst:"CN", ano:2006, fonte:"psacn06", num:5, materia:"Geografia", assunto:"geo-economia", dif:2,
  enun:"Sobre a modernização do campo, assinale a correta.",
  alts:{A:"Apesar das tecnologias modernas, a agricultura continua dependente dos ritmos da natureza.",B:"Os produtores deixaram de depender de insumos industriais.",C:"A integração democratizou as decisões entre pequenos e grandes produtores.",D:"A tecnologia está disponível a todos e reduz as desigualdades.",E:"Campo e cidade já não podem ser analisados separadamente."}, gab:"A", gabTipo:"verificado",
  res:["Clima, estações e pragas ainda afetam a produção.","A modernização aumentou a dependência de insumos e concentrou renda. Alternativa A."] },
{ id:"ps06-10", inst:"CN", ano:2006, fonte:"psacn06", num:10, materia:"Geografia", assunto:"biomas", dif:2,
  enun:"Sobre a Caatinga, assinale a correta.",
  alts:{A:"Tem solos muito profundos, que reduzem a evapotranspiração.",B:"Tem grandes amplitudes térmicas anuais.",C:"Tem espécies de folhas caducas, que reduzem a perda de água na transpiração.",D:"Tem baixo impacto ambiental por ter poucas atividades econômicas.",E:"Não tem lençóis freáticos."}, gab:"C", gabTipo:"verificado",
  res:["Na seca, muitas plantas perdem as folhas (caducifólias) para economizar água.","Os solos são rasos e pedregosos; a amplitude térmica anual é pequena. Alternativa C."] },

/* ================= Ciências — CN 2020 (verificado) ================= */
{ id:"cn20-c1", inst:"CN", ano:2020, fonte:"cn20", materia:"Ciências", assunto:"materia", dif:2,
  enun:"Na chuva ácida, ocorrem as reações I. SO₂ + H₂O → H₂SO₃ e II. SO₃ + H₂O → H₂SO₄. Os ácidos formados são, respectivamente:",
  alts:{A:"ácido sulfuroso e ácido sulfúrico.",B:"ácido sulfúrico e ácido sulfuroso.",C:"ácido sulfúrico e ácido sulfídrico.",D:"ácido sulfídrico e ácido sulfúrico.",E:"ácido sulfuroso e ácido sulfídrico."}, gab:"A", gabTipo:"verificado",
  res:["H₂SO₃ (menos oxigênio) = ácido sulfuroso; H₂SO₄ = ácido sulfúrico.","Sulfídrico é o H₂S, sem oxigênio. Alternativa A."] },
{ id:"cn20-c2", inst:"CN", ano:2020, fonte:"cn20", materia:"Ciências", assunto:"energia", dif:2,
  enun:"Sem chuveiro elétrico, um estudante mistura na banheira 2 panelas de água a 100 °C e 8 panelas iguais de água a 20 °C. Desprezando perdas, qual é a temperatura final?",
  alts:{A:"30 °C",B:"32 °C",C:"34 °C",D:"36 °C",E:"38 °C"}, gab:"D", gabTipo:"verificado",
  res:["Massas iguais por panela: a temperatura final é a média ponderada.","(2 × 100 + 8 × 20) ÷ 10 = 360 ÷ 10 = 36 °C (alternativa D)."] },
{ id:"cn20-c3", inst:"CN", ano:2020, fonte:"cn20", materia:"Ciências", assunto:"ondas", dif:2,
  enun:"Uma rádio emite ondas de 3 m de comprimento. Que frequência o ouvinte deve sintonizar? (velocidade da luz: 3,0 × 10⁸ m/s)",
  alts:{A:"100 MHz",B:"300 MHz",C:"600 MHz",D:"900 MHz",E:"1 000 MHz"}, gab:"A", gabTipo:"verificado",
  res:["v = λ · f ⇒ f = v ÷ λ.","f = 3 × 10⁸ ÷ 3 = 10⁸ Hz = 100 MHz (alternativa A)."] },
{ id:"cn20-c4", inst:"CN", ano:2020, fonte:"cn20", materia:"Ciências", assunto:"corpo-humano", dif:1,
  enun:"Indique, respectivamente, o que acontece na inspiração e na expiração.",
  alts:{A:"Saída de ar, diafragma contrai / entrada de ar, diafragma relaxa.",B:"Entrada de ar, diafragma contrai / saída de ar, diafragma relaxa.",C:"Entrada de ar, diafragma relaxa / saída de ar, diafragma contrai.",D:"Entrada de ar, diafragma contrai / saída de ar, diafragma contrai.",E:"Saída de ar, diafragma relaxa / entrada de ar, diafragma contrai."}, gab:"B", gabTipo:"verificado",
  res:["Na inspiração o diafragma contrai e desce, o tórax aumenta e o ar entra.","Na expiração ele relaxa e sobe, e o ar sai. Alternativa B."] },
{ id:"cn20-c5", inst:"CN", ano:2020, fonte:"cn20", materia:"Ciências", assunto:"atomo", dif:1,
  enun:"Diamante e grafite são formados pelo mesmo elemento (carbono). O fenômeno em que um elemento forma duas ou mais substâncias simples diferentes chama-se:",
  alts:{A:"atomicidade.",B:"Avogadro.",C:"estrutura cristalina.",D:"alotropia.",E:"covalência."}, gab:"D", gabTipo:"verificado",
  res:["Formas diferentes de um mesmo elemento = alótropos (como O₂ e O₃).","Alternativa D."] },
{ id:"cn20-c6", inst:"CN", ano:2020, fonte:"cn20", materia:"Ciências", assunto:"ondas", dif:2,
  enun:"A miopia é corrigida com lentes divergentes. Para um objeto real, a imagem formada por uma lente divergente é sempre:",
  alts:{A:"real e maior.",B:"real e igual.",C:"real e menor.",D:"virtual e maior.",E:"virtual e menor."}, gab:"E", gabTipo:"verificado",
  res:["Lentes divergentes espalham os raios: a imagem fica do mesmo lado do objeto (virtual), direita e reduzida.","Alternativa E."] },
{ id:"cn20-c7", inst:"CN", ano:2020, fonte:"cn20", materia:"Ciências", assunto:"movimento", dif:2,
  enun:"Para ultrapassar, um motorista aumentou a velocidade de 15 m/s para 25 m/s em 5,0 s, com aceleração constante. Que distância percorreu nesse intervalo?",
  alts:{A:"100 m",B:"120 m",C:"140 m",D:"160 m",E:"180 m"}, gab:"A", gabTipo:"verificado",
  res:["Com aceleração constante, a velocidade média é (15 + 25) ÷ 2 = 20 m/s.","d = 20 × 5 = 100 m (alternativa A)."] },
{ id:"cn20-c8", inst:"CN", ano:2020, fonte:"cn20", materia:"Ciências", assunto:"corpo-humano", dif:2,
  enun:"Sobre os métodos contraceptivos, é correto afirmar que:",
  alts:{A:"a tabelinha suspende as relações durante a menstruação.",B:"o coito interrompido consiste em retirar o pênis da vagina antes da ejaculação.",C:"a pílula impede a menstruação.",D:"a vasectomia impede a produção de espermatozoides e a ejaculação.",E:"a camisinha libera enzimas que matam os óvulos."}, gab:"B", gabTipo:"verificado",
  res:["A tabelinha evita o período fértil; a pílula impede a ovulação; a vasectomia corta os ductos, mas há ejaculação.","A camisinha é barreira mecânica. Alternativa B (método pouco eficaz, diga-se)."] },
{ id:"cn20-c9", inst:"CN", ano:2020, fonte:"cn20", materia:"Ciências", assunto:"ecologia", dif:2,
  enun:"Sobre a presença de óleo nos oceanos (como no derramamento no litoral brasileiro em 2019), é correto afirmar que:",
  alts:{A:"esse glicídio é insolúvel em água.",B:"o zooplâncton não é afetado por esse lipídio.",C:"o óleo impede a passagem de luz, afetando o fitoplâncton.",D:"o ecossistema não é afetado, pois o óleo fica só na superfície.",E:"o óleo é uma substância inorgânica."}, gab:"C", gabTipo:"verificado",
  res:["A mancha bloqueia a luz e prejudica a fotossíntese do fitoplâncton, base da cadeia alimentar.","Petróleo é orgânico e não é glicídio. Alternativa C."] },
{ id:"cn20-c10", inst:"CN", ano:2020, fonte:"cn20", materia:"Ciências", assunto:"materia", dif:1,
  enun:"Pelo modelo de Dalton, substância simples é formada por um só elemento. Qual opção contém apenas substâncias simples?",
  alts:{A:"HClO₄, H₂O e Br₂",B:"O₃, I₂ e N₂",C:"He, I₂ e H₂O",D:"Cl₂, O₃ e K₂Cr₂O₇",E:"H₂O, HNO₃ e KMnO₄"}, gab:"B", gabTipo:"verificado",
  res:["O₃ (só O), I₂ (só I) e N₂ (só N).","As outras opções trazem compostos (H₂O, HClO₄, K₂Cr₂O₇…). Alternativa B."] },
{ id:"cn20-c11", inst:"CN", ano:2020, fonte:"cn20", materia:"Ciências", assunto:"materia", dif:3,
  enun:"Balanceie: H₂SO₄ + Ca(OH)₂ → CaSO₄ + x H₂O e y HCl + Al(OH)₃ → AlCl₃ + z H₂O. Os valores de x, y e z são:",
  alts:{A:"2, 2 e 2",B:"2, 3 e 2",C:"2, 3 e 3",D:"3, 2 e 3",E:"3, 3 e 3"}, gab:"C", gabTipo:"verificado",
  res:["1ª: 2 H⁺ + 2 OH⁻ → 2 H₂O ⇒ x = 2.","2ª: o Al(OH)₃ tem 3 OH⁻ e precisa de 3 HCl ⇒ y = 3 e z = 3.","Alternativa C."] },
{ id:"cn20-c12", inst:"CN", ano:2020, fonte:"cn20", materia:"Ciências", assunto:"ecologia", dif:2,
  enun:"Considere as cadeias I. planta → gafanhoto → pássaro → cobra e II. planta → pássaro → gavião. Assinale a correta.",
  alts:{A:"Em I e II o pássaro ocupa o mesmo nível trófico.",B:"As plantas são heterotróficas.",C:"O produtor fica sempre no último nível trófico.",D:"As plantas são consideradas produtores.",E:"Em I a cobra é consumidora secundária."}, gab:"D", gabTipo:"verificado",
  res:["Plantas fazem fotossíntese: são autotróficas e produtoras (1º nível).","O pássaro é consumidor secundário em I e primário em II; a cobra é consumidora terciária. Alternativa D."] },
{ id:"cn20-c13", inst:"CN", ano:2020, fonte:"cn20", materia:"Ciências", assunto:"atomo", dif:4,
  enun:"Átomos A, B e C: número de massa de A = 101, de C = 96; número atômico de B = 47. A é isóbaro de B, B é isótono de C e o íon C²⁺ é isoeletrônico de A. Os números atômicos de A e C são:",
  alts:{A:"42 e 40",B:"40 e 42",C:"50 e 52",D:"52 e 50",E:"45 e 47"}, gab:"B", gabTipo:"verificado",
  res:["Isóbaros têm a mesma massa: B tem A = 101 ⇒ nêutrons de B = 101 − 47 = 54.","Isótonos têm os mesmos nêutrons: C tem 54 nêutrons ⇒ Z(C) = 96 − 54 = 42.","C²⁺ tem 40 elétrons = elétrons de A ⇒ Z(A) = 40. Alternativa B."] },
{ id:"cn20-c14", inst:"CN", ano:2020, fonte:"cn20", materia:"Ciências", assunto:"energia", dif:2,
  enun:"Um carrinho de montanha-russa parte do repouso a 25 m do solo. Sem atrito e com g = 10 m/s², qual é sua velocidade num ponto a 20 m do solo?",
  alts:{A:"5 m/s",B:"10 m/s",C:"15 m/s",D:"20 m/s",E:"30 m/s"}, gab:"B", gabTipo:"verificado",
  res:["Conservação de energia: m·g·Δh = m·v²/2.","Δh = 5 m ⇒ v² = 2 × 10 × 5 = 100 ⇒ v = 10 m/s (alternativa B)."] },

/* ================= Ciências — CN 2012/2013 (verificado) ================= */
{ id:"cn12-33", inst:"CN", ano:2012, fonte:"cn12", num:33, materia:"Ciências", assunto:"materia", dif:2,
  enun:"Aponte a definição INCORRETA de uma propriedade da matéria.",
  alts:{A:"Extensão: ocupar lugar no espaço.",B:"Impenetrabilidade: dois corpos não ocupam o mesmo lugar ao mesmo tempo.",C:"Dureza: capacidade de resistir a impactos sem se fragmentar.",D:"Elasticidade: voltar à forma inicial quando a força cessa.",E:"Inércia: tendência a manter o repouso ou o movimento retilíneo uniforme."}, gab:"C", gabTipo:"verificado", gabNota:"Coincide com a resolução publicada pelo curso Pensi.",
  res:["Dureza é a resistência a ser riscado.","Resistir ao impacto sem quebrar é tenacidade. Alternativa C."] },
{ id:"cn12-34", inst:"CN", ano:2012, fonte:"cn12", num:34, materia:"Ciências", assunto:"materia", dif:1,
  enun:"Qual é a massa, em gramas, de 3 mL de um solvente puro de densidade 0,78 g/mL?",
  alts:{A:"0,26",B:"0,38",C:"2,21",D:"2,34",E:"3,85"}, gab:"D", gabTipo:"verificado", gabNota:"Coincide com a resolução publicada pelo curso Pensi.",
  res:["m = d × V = 0,78 × 3 = 2,34 g (alternativa D)."] },
{ id:"cn12-35", inst:"CN", ano:2012, fonte:"cn12", num:35, materia:"Ciências", assunto:"materia", dif:1,
  enun:"Ao passar álcool na pele, sentimos frio. Isso se explica pela:",
  alts:{A:"sublimação do álcool.",B:"insolubilidade do álcool em água.",C:"mudança de estado do álcool, fenômeno exotérmico.",D:"liquefação do álcool.",E:"evaporação do álcool, fenômeno endotérmico."}, gab:"E", gabTipo:"verificado", gabNota:"Coincide com a resolução publicada pelo curso Pensi.",
  res:["Para evaporar, o álcool absorve calor da pele (endotérmico).","Alternativa E."] },
{ id:"cn12-37", inst:"CN", ano:2012, fonte:"cn12", num:37, materia:"Ciências", assunto:"materia", dif:4,
  enun:"Numa estação de tratamento de água, quais substâncias são usadas, respectivamente, na coagulação, na desinfecção, na fluoretação e na correção do pH?",
  alts:{A:"Al(OH)₃ e Al₂(SO₄)₃ / NaClO e O₃ / NaF e CaF₂ / Na₂CO₃",B:"Al(OH)₂ e AlSO₄ / NaClO e O₃ / NaF e CaF₂ / Na₂CO₃",C:"Al(OH)₃ e Al₂(SO₄)₃ / NaClO₂ e O₂ / NaF e CaF₂ / NaHCO₃",D:"Al(OH)₂ e AlSO₄ / NaClO e O₃ / Na₂F e CaF / Na₂CO₃",E:"Al(OH)₃ e Al₂(SO₄)₃ / NaClO₂ e O₂ / Na₂F e CaF / NaHCO₃"}, gab:"A", gabTipo:"verificado", gabNota:"Coincide com a resolução publicada pelo curso Pensi.",
  res:["Al³⁺ forma Al(OH)₃ e Al₂(SO₄)₃ (Al(OH)₂ e AlSO₄ têm cargas erradas).","Desinfecção com hipoclorito (NaClO) e ozônio (O₃); O₂ não desinfeta.","Na⁺ e F⁻ formam NaF (não Na₂F). Só a alternativa A tem todas as fórmulas coerentes."] },
{ id:"cn12-38", inst:"CN", ano:2012, fonte:"cn12", num:38, materia:"Ciências", assunto:"materia", dif:2,
  enun:"Quais métodos de separação se baseiam, respectivamente, em: I. diferença de temperatura de ebulição; II. diferença de densidade; III. diferença de tamanho das partículas?",
  alts:{A:"evaporação, floculação, filtração.",B:"condensação, tamização, decantação.",C:"destilação, filtração, destilação.",D:"decantação, peneiração, filtração.",E:"destilação, decantação, peneiração."}, gab:"E", gabTipo:"verificado", gabNota:"Coincide com a resolução publicada pelo curso Pensi.",
  res:["Ebulição → destilação; densidade → decantação; tamanho → peneiração (tamisação).","Alternativa E."] },
{ id:"cn12-40", inst:"CN", ano:2012, fonte:"cn12", num:40, materia:"Ciências", assunto:"movimento", dif:4,

{ id:"razao", materia:"Matemática", titulo:"Razão, proporção, escala e divisão proporcional",
  resumo:["Razão é a comparação por divisão: a/b. Proporção é a igualdade de duas razões: a/b = c/d, e vale ad = bc (multiplicar cruzado).",
          "Escala = medida no desenho ÷ medida real, com as duas na mesma unidade. 1 : 50 000 quer dizer que 1 cm no mapa vale 50 000 cm (500 m) no real.",
          "Divisão diretamente proporcional: some as partes, divida o total pela soma (constante k) e multiplique cada parte por k.",

  exemplo:{ q:"Divida 900 em partes diretamente proporcionais a 2, 3 e 4.",

  ex:[ { q:"Num mapa de escala 1 : 50 000, dois pontos estão a 4 cm. Qual a distância real?", a:["200 m","2 km","20 km","0,2 km"], c:1, e:"4 × 50 000 = 200 000 cm = 2 000 m = 2 km." },

  flash:[["Propriedade fundamental da proporção","a/b = c/d ⇒ a·d = b·c"],["Escala","medida no desenho ÷ medida real (mesma unidade)"]] },

{ id:"proporcionalidade", materia:"Matemática", titulo:"Regra de três e grandezas proporcionais",
  resumo:["Grandezas diretamente proporcionais: quando uma dobra, a outra dobra (a razão é constante). Ex.: quantidade e preço.",
          "Inversamente proporcionais: quando uma dobra, a outra cai pela metade (o produto é constante). Ex.: número de trabalhadores e tempo.",
          "Regra de três simples: monte a tabela, marque se é direta ou inversa e resolva. Na inversa, inverta uma das colunas antes de multiplicar cruzado.",

  exemplo:{ q:"3 torneiras iguais enchem um tanque em 8 h. Em quanto tempo 4 torneiras enchem o mesmo tanque?",
            passos:["Mais torneiras → menos tempo: inversa.","Produto constante: 3 × 8 = 24 = 4 × t.","t = 6 h."] },
  ex:[ { q:"5 kg de arroz custam R$ 40,00. Quanto custam 8 kg?", a:["R$ 56,00","R$ 60,00","R$ 64,00","R$ 72,00"], c:2, e:"R$ 8,00 o quilo × 8 = R$ 64,00." },
       { q:"6 pedreiros fazem um muro em 10 dias. Em quantos dias 4 pedreiros fariam o mesmo muro?", a:["12","15","8","20"], c:1, e:"Inversa: 6 × 10 = 4 × t ⇒ t = 15." },
       { q:"Um carro faz 240 km com 20 L. Quantos litros gasta em 360 km?", a:["25 L","28 L","30 L","32 L"], c:2, e:"12 km por litro: 360 ÷ 12 = 30 L." } ],
  flash:[["Inversamente proporcionais","o produto das grandezas é constante"],["Diretamente proporcionais","a razão entre as grandezas é constante"]] },

{ id:"eq1", materia:"Matemática", titulo:"Equações do 1º grau e sistemas",

{ id:"eq2", materia:"Matemática", titulo:"Equação do 2º grau",
  resumo:["Forma geral: ax² + bx + c = 0, com a ≠ 0.",

          "Fórmula de Bhaskara: x = (−b ± √Δ) ÷ 2a.",
          "Soma das raízes = −b/a; produto = c/a. Ajuda a resolver de cabeça: x² − 5x + 6 = 0 tem raízes com soma 5 e produto 6, ou seja, 2 e 3.",

  flash:[["Δ (discriminante)","b² − 4ac"],["Soma e produto das raízes","S = −b/a; P = c/a"]] },

{ id:"medias", materia:"Matemática", titulo:"Médias, moda, mediana e tabelas",
  resumo:["Média aritmética = soma dos valores ÷ quantidade. Truque útil: soma = média × quantidade.",
          "Média ponderada: multiplique cada valor pelo seu peso, some e divida pela soma dos pesos.",
          "Mediana: o valor do meio, depois de ordenar. Se a quantidade for par, é a média dos dois centrais.",

  exemplo:{ q:"A média de 4 notas é 7. Qual deve ser a 5ª nota para a média subir para 7,4?",

  ex:[ { q:"Qual a mediana de 3, 8, 5, 10 e 1?", a:["3","5","5,4","8"], c:1, e:"Ordenando: 1, 3, 5, 8, 10. O do meio é 5." },

  flash:[["Soma a partir da média","soma = média × quantidade"],["Mediana","valor central dos dados ordenados"]] },

{ id:"juros", materia:"Matemática", titulo:"Juros simples, compostos e parcelas",

  flash:[["Juros simples","J = C · i · t"],["Montante composto","M = C · (1 + i)ᵗ"]] },

{ id:"medidas", materia:"Matemática", titulo:"Grandezas e medidas: comprimento, área, volume e tempo",
  resumo:["Comprimento: km, hm, dam, m, dm, cm, mm — cada passo vale ×10.",
