  exemplo:{ q:"Um filme começa às 19h50 e dura 2h15. Que horas termina?",
            passos:["19h50 + 2h = 21h50.","21h50 + 15 min = 22h05."] },
  ex:[ { q:"3,5 km equivalem a:", a:["35 m","350 m","3 500 m","35 000 m"], c:2, e:"1 km = 1 000 m." },
       { q:"2 m³ equivalem a:", a:["20 L","200 L","2 000 L","20 000 L"], c:2, e:"1 m³ = 1 000 L." },
       { q:"1h20min equivalem a quantos minutos?", a:["70","80","120","140"], c:1, e:"60 + 20 = 80." } ],
  flash:[["1 hectare","10 000 m²"],["1 dm³","1 litro"]] },

{ id:"potencias", materia:"Matemática", titulo:"Potências, radicais, produtos notáveis e fatoração",
  resumo:["aᵐ · aⁿ = aᵐ⁺ⁿ; aᵐ ÷ aⁿ = aᵐ⁻ⁿ; (aᵐ)ⁿ = aᵐⁿ; a⁰ = 1; a⁻ⁿ = 1/aⁿ.",
          "Radicais: √(a·b) = √a · √b. Simplifique tirando quadrados perfeitos: √50 = √(25·2) = 5√2.",
          "Produtos notáveis: (a + b)² = a² + 2ab + b²; (a − b)² = a² − 2ab + b²; (a + b)(a − b) = a² − b².",
          "Fatoração: coloque o fator comum em evidência e agrupe termos. Ex.: x² − xz + 2xy − 2yz = (x − z)(x + 2y).",
          "Use a diferença de quadrados para fazer contas grandes: 101² − 99² = (101 − 99)(101 + 99) = 400."],
  exemplo:{ q:"Simplifique √72.",
            passos:["72 = 36 × 2.","√72 = √36 · √2 = 6√2."] },
  ex:[ { q:"2³ · 2⁴ é igual a:", a:["2⁷ = 128","2¹² = 4 096","4⁷","64"], c:0, e:"Some os expoentes: 2⁷ = 128." },
       { q:"(x + 3)² é igual a:", a:["x² + 9","x² + 3x + 9","x² + 6x + 9","x² + 6x + 6"], c:2, e:"x² + 2·3·x + 9." },
       { q:"101² − 99² vale:", a:["2","200","400","20 000"], c:2, e:"(101 − 99)(101 + 99) = 2 × 200 = 400." } ],
  flash:[["(a + b)(a − b)","a² − b²"],["(a + b)²","a² + 2ab + b²"]] },

{ id:"problemas", materia:"Matemática", titulo:"Problemas aritméticos: idades, trocas e contagens",
  resumo:["Leia o problema duas vezes e organize os dados numa tabela (passado, hoje, futuro).",
          "Em problemas de idade, a diferença de idade entre duas pessoas nunca muda.",
          "Quando dinheiro ou objetos só trocam de mãos, o total do grupo não muda.",
          "\"Se A der x a B, ficam iguais\" quer dizer que a diferença inicial é 2x.",
          "Na dúvida em uma prova objetiva, teste as alternativas no enunciado."],
  exemplo:{ q:"Um pai tem 40 anos e o filho 10. Daqui a quantos anos o pai terá o dobro da idade do filho?",
            passos:["40 + x = 2(10 + x).","40 + x = 20 + 2x ⇒ x = 20.","Daqui a 20 anos (60 e 30)."] },
  ex:[ { q:"João tem o triplo da idade de Pedro, e juntos somam 48 anos. Pedro tem:", a:["10","12","16","36"], c:1, e:"p + 3p = 48 ⇒ p = 12." },
       { q:"Se Ana der R$ 10 a Beto, os dois ficam com a mesma quantia. Quanto Ana tem a mais que Beto?", a:["R$ 5","R$ 10","R$ 20","R$ 30"], c:2, e:"Ela perde 10 e ele ganha 10: a diferença era 20." },
       { q:"Há 5 anos Carla tinha 8 anos. Daqui a 5 anos ela terá:", a:["13","15","18","20"], c:2, e:"Hoje tem 13; daqui a 5, 18." } ],
  flash:[["Diferença de idades","é constante ao longo do tempo"],["\"Se A der x a B, ficam iguais\"","A tem 2x a mais que B"]] },

/* ======================= PORTUGUÊS ======================= */
{ id:"interpretacao", materia:"Português", titulo:"Interpretação de texto e gêneros textuais",
  resumo:["Leia primeiro as perguntas, depois o texto, sublinhando as ideias principais de cada parágrafo.",
          "\"Segundo o texto\" ou \"de acordo com o autor\" pede informação explícita. \"Infere-se\" ou \"depreende-se\" pede uma conclusão que o texto permite, sem ir além dele (extrapolação é erro).",
          "Tipos textuais: narrativo (conta fatos), descritivo (caracteriza), expositivo (explica), argumentativo (defende uma tese) e injuntivo (dá instruções).",
          "Gêneros comuns em provas: notícia, reportagem, artigo de opinião, crônica, charge, tirinha, poema, anúncio. Charges e tirinhas costumam usar humor e crítica."],
  exemplo:{ q:"Uma charge mostra um homem andando de carro sozinho num engarrafamento enorme. Qual a crítica provável?",
            passos:["Observe o contraste: muitos carros com uma pessoa só.","A crítica é ao uso excessivo do transporte individual e à falta de mobilidade urbana."] },
  ex:[ { q:"Um enunciado que começa com \"Segundo o texto\" pede:", a:["a opinião do leitor","uma informação explícita no texto","conhecimentos de fora do texto","uma informação implícita"], c:1, e:"\"Segundo o texto\" remete ao que está escrito." },
       { q:"Texto assinado, publicado em jornal, que defende a opinião do autor sobre um tema atual:", a:["notícia","artigo de opinião","receita","conto"], c:1, e:"O artigo de opinião é argumentativo e assinado." } ],
  flash:[["Inferir","concluir algo que o texto permite, sem extrapolar"],["Texto argumentativo","defende uma tese com argumentos"]] },

{ id:"classes", materia:"Português", titulo:"Classes de palavras",
  resumo:["São dez classes: substantivo, adjetivo, artigo, numeral, pronome, verbo, advérbio, preposição, conjunção e interjeição.",
          "A classe depende do uso na frase. \"O jantar estava ótimo\": jantar é substantivo. \"Vamos jantar\": jantar é verbo.",
          "Advérbio modifica verbo, adjetivo ou outro advérbio e indica circunstância (tempo, lugar, modo, intensidade): cedo, aqui, bem, muito.",
          "Preposições ligam palavras (a, de, em, para, com, por). Conjunções ligam orações (e, mas, porque, embora, quando)."],
  exemplo:{ q:"Classifique \"muito\" em \"Ela é muito dedicada\".",
            passos:["\"Muito\" intensifica o adjetivo \"dedicada\".","É advérbio de intensidade."] },
  ex:[ { q:"Em \"Ela chegou cedo\", a palavra \"cedo\" é:", a:["adjetivo","advérbio","substantivo","preposição"], c:1, e:"Indica tempo e modifica o verbo." },
       { q:"Em \"O correr do rio me acalma\", \"correr\" é:", a:["verbo","substantivo","adjetivo","advérbio"], c:1, e:"Antecedido de artigo, o verbo está substantivado." } ],
  flash:[["Advérbio","modifica verbo, adjetivo ou advérbio (circunstância)"],["Conjunção","liga orações"]] },

{ id:"concordancia", materia:"Português", titulo:"Concordância verbal e nominal",
  resumo:["O verbo concorda com o sujeito em número e pessoa, mesmo que o sujeito venha depois: \"Chegaram as notas\".",
          "\"Haver\" no sentido de existir e \"fazer\" indicando tempo são impessoais (ficam no singular): \"Havia muitas pessoas\"; \"Faz dois anos\".",
          "O adjetivo concorda com o substantivo: \"provas difíceis\".",
          "\"Meio\" como advérbio (= um pouco) não varia: \"Ela ficou meio cansada\". Como numeral (= metade), varia: \"meia hora\".",
          "\"Anexo\", \"obrigado\" e \"mesmo\" concordam com o termo a que se referem: \"Seguem anexas as fotos\"; \"Ela disse: obrigada\"."],
  exemplo:{ q:"Corrija: \"Haviam muitos alunos na quadra.\"",
            passos:["\"Haver\" = existir é impessoal.","Forma correta: \"Havia muitos alunos na quadra.\""] },
  ex:[ { q:"Assinale a frase correta:", a:["Haviam muitas pessoas na fila.","Havia muitas pessoas na fila.","Houveram vários problemas.","Fazem dois anos que me mudei."], c:1, e:"Haver (existir) e fazer (tempo) são impessoais." },
       { q:"\"Ela ficou ___ preocupada.\"", a:["meia","meio","meios","meias"], c:1, e:"Advérbio (= um pouco): invariável." } ],
  flash:[["Haver = existir","impessoal: sempre no singular"],["\"Meio\" advérbio","não varia: meio cansada"]] },

{ id:"coesao", materia:"Português", titulo:"Coesão e conectivos",
  resumo:["Conectivos indicam a relação entre ideias. Trocar um por outro de sentido diferente muda o texto.",
          "Adição: e, além disso. Oposição: mas, porém, contudo, entretanto, no entanto, todavia.",
          "Concessão: embora, ainda que, apesar de. Causa: porque, já que, visto que. Consequência: de modo que, tão… que.",
          "Conclusão: portanto, logo, assim. Condição: se, caso. Finalidade: para que, a fim de. Tempo: quando, enquanto.",
          "Coesão referencial: pronomes e sinônimos retomam termos já citados e evitam repetição."],
  exemplo:{ q:"Reescreva \"Estava cansado, mas continuou\" começando com \"Embora\".",
            passos:["Concessão aceita a ideia contrária sem impedir o fato.","\"Embora estivesse cansado, continuou.\""] },
  ex:[ { q:"\"Estudou muito; ___, foi aprovado.\" O conectivo que indica conclusão é:", a:["porém","portanto","embora","caso"], c:1, e:"Portanto = conclusão." },
       { q:"Em \"Embora chovesse, saímos\", a relação é de:", a:["causa","condição","concessão","finalidade"], c:2, e:"\"Embora\" introduz concessão." } ],
  flash:[["Embora / ainda que","concessão"],["Contudo / no entanto","oposição"]] },

{ id:"crase", materia:"Português", titulo:"Crase",
  resumo:["Crase é a fusão da preposição \"a\" com o artigo \"a\": vou a + a escola = vou à escola.",
          "Teste: troque a palavra feminina por uma masculina. Se aparecer \"ao\", há crase (vou à escola → vou ao colégio).",
          "Não há crase antes de palavra masculina, de verbo, da maioria dos pronomes e quando o \"a\" (singular) vem antes de palavra no plural.",
          "Há crase nas horas (às 8h) e em locuções femininas (à noite, às pressas, à medida que).",
          "Lugares: \"vou à Bahia\" (volto da Bahia) e \"vou a Brasília\" (volto de Brasília)."],
  exemplo:{ q:"Há crase em \"Entreguei o livro a professora\"?",
            passos:["Troque: \"entreguei o livro ao professor\".","Apareceu \"ao\": há crase. \"Entreguei o livro à professora.\""] },
  ex:[ { q:"Assinale a frase correta:", a:["Fui à pé.","Fui à escola.","Comecei à estudar.","Entreguei à ele."], c:1, e:"Antes de masculino, verbo e pronome pessoal não há crase." },
       { q:"\"A reunião começa ___ 10h.\"", a:["a","à","às","há"], c:2, e:"Horas: às 10h." } ],
  flash:[["Teste da crase","trocar por masculino: se vira \"ao\", há crase"],["Crase antes de verbo?","nunca"]] },

{ id:"pontuacao", materia:"Português", titulo:"Pontuação",
  resumo:["Não se separa o sujeito do verbo por vírgula: \"Os alunos do 9º ano fizeram a prova\".",
          "Use vírgula para isolar vocativo (\"Pedro, venha cá\"), aposto (\"Rio, capital fluminense, …\") e adjunto adverbial deslocado (\"Ontem à noite, estudamos\").",
          "Use vírgula antes de \"mas\", \"porém\" e afins e para separar itens de uma enumeração.",
          "Ponto e vírgula separa itens longos ou orações que já têm vírgulas; dois-pontos anunciam explicação, enumeração ou fala."],
  exemplo:{ q:"Pontue: \"Maria minha prima chegou ontem\".",
            passos:["\"minha prima\" explica quem é Maria: é aposto.","\"Maria, minha prima, chegou ontem.\""] },
  ex:[ { q:"Qual frase tem ERRO de pontuação?", a:["Os alunos do 9º ano, fizeram a prova.","Ontem, choveu muito.","Pedro, venha aqui.","Estudei, mas não fui bem."], c:0, e:"A vírgula separou o sujeito do verbo." },
       { q:"Em \"Pedro, venha aqui\", a vírgula isola um:", a:["aposto","vocativo","adjunto adverbial","sujeito"], c:1, e:"Pedro é chamado: vocativo." } ],
  flash:[["Sujeito e verbo","não se separam por vírgula"],["Vocativo","termo que chama alguém; vem entre vírgulas"]] },

{ id:"figuras", materia:"Português", titulo:"Figuras de linguagem",
  resumo:["Metáfora: comparação sem conectivo (\"Ele é uma fera\"). Comparação: com conectivo (\"forte como um touro\").",
          "Metonímia: troca por relação próxima (\"Li Machado\" = a obra de Machado de Assis).",
          "Hipérbole: exagero. Eufemismo: suavização. Ironia: dizer o contrário do que se pensa.",
          "Personificação (prosopopeia): características humanas a seres não humanos. Antítese: ideias opostas. Paradoxo: ideias opostas que parecem impossíveis juntas.",
          "Onomatopeia: palavras que imitam sons (tique-taque, au-au)."],
  exemplo:{ q:"Identifique a figura: \"Ela partiu desta para melhor\".",
            passos:["A frase suaviza a ideia de morte.","Eufemismo."] },
  ex:[ { q:"\"Já te disse isso um milhão de vezes!\"", a:["metonímia","hipérbole","eufemismo","antítese"], c:1, e:"Exagero intencional." },
       { q:"\"O vento cantava na janela.\"", a:["personificação","comparação","onomatopeia","ironia"], c:0, e:"Vento não canta: ação humana atribuída a um elemento da natureza." } ],
  flash:[["Metáfora x comparação","comparação usa conectivo (como, tal qual)"],["Eufemismo","suaviza uma ideia desagradável"]] },

{ id:"acentuacao", materia:"Português", titulo:"Acentuação gráfica",
  resumo:["Proparoxítonas: todas são acentuadas (lâmpada, matemática).",
          "Oxítonas terminadas em a(s), e(s), o(s), em, ens: sofá, café, avô, também, parabéns.",
          "Paroxítonas são acentuadas quando NÃO terminam em a, e, o, em, ens: fácil, útil, táxi, vírus, açúcar.",
          "Acordo Ortográfico: ditongos abertos éi e ói só levam acento em oxítonas (herói, papéis); nas paroxítonas não (ideia, assembleia, joia).",
          "Hiatos com i e u tônicos levam acento (saída, baú). Acentos diferenciais: pôde (passado) e pode; pôr (verbo) e por; têm e vêm (plural)."],
  exemplo:{ q:"Por que \"herói\" tem acento e \"heroico\" não?",
            passos:["\"Herói\" é oxítona com ditongo aberto ói: acentua.","\"Heroico\" é paroxítona: pelo Acordo, não acentua."] },
  ex:[ { q:"Assinale a palavra corretamente grafada pelo Acordo vigente:", a:["idéia","herói","assembléia","jóia"], c:1, e:"Ditongo aberto só leva acento em oxítona." },
       { q:"\"Eles ___ muitos livros.\"", a:["tem","têm","teem","tém"], c:1, e:"Plural de \"ter\": têm." } ],
  flash:[["Paroxítona terminada em -l, -r, -x, -n, -i(s), -us","é acentuada (fácil, açúcar, táxi)"],["têm / vêm","plural de ter / vir"]] },

/* ======================= CIÊNCIAS ======================= */
{ id:"celula", materia:"Ciências", titulo:"Célula: estrutura e organelas",
  resumo:["Todos os seres vivos são formados por células (teoria celular).",
          "Procariontes (bactérias) não têm núcleo organizado; eucariontes (animais, plantas, fungos) têm.",
          "Membrana plasmática controla o que entra e sai; citoplasma abriga as organelas; núcleo guarda o DNA.",
          "Mitocôndria: respiração celular (libera energia). Ribossomo: produz proteínas.",
          "Células vegetais têm também parede celular, cloroplastos (fotossíntese) e um grande vacúolo."],
  exemplo:{ q:"Por que as plantas conseguem produzir o próprio alimento?",
            passos:["Suas células têm cloroplastos com clorofila.","Ali ocorre a fotossíntese: gás carbônico + água + luz → glicose + oxigênio."] },
  ex:[ { q:"A organela responsável pela respiração celular é:", a:["ribossomo","mitocôndria","cloroplasto","vacúolo"], c:1, e:"A mitocôndria libera energia da glicose." },
       { q:"Estrutura presente na célula vegetal e ausente na animal:", a:["membrana plasmática","ribossomo","parede celular","mitocôndria"], c:2, e:"A parede celular (de celulose) é típica das plantas." } ],
  flash:[["Mitocôndria","respiração celular"],["Cloroplasto","fotossíntese"]] },

{ id:"corpo-humano", materia:"Ciências", titulo:"Sistemas do corpo humano",
  resumo:["Digestório: boca → esôfago → estômago (ácido, digere proteínas) → intestino delgado (maior parte da absorção) → intestino grosso (absorve água).",
          "Respiratório: nos alvéolos pulmonares ocorre a troca de gases (entra O₂, sai CO₂).",
          "Circulatório: o coração tem 4 cavidades; artérias levam o sangue do coração para o corpo, veias trazem de volta.",
          "Excretor: os rins filtram o sangue e formam a urina.",
          "Nervoso: encéfalo e medula formam o sistema nervoso central. Endócrino: glândulas liberam hormônios (a insulina, do pâncreas, reduz a glicose no sangue)."],
  exemplo:{ q:"Por que a falta de insulina eleva a glicose no sangue?",
            passos:["A insulina ajuda a glicose a entrar nas células.","Sem ela, a glicose fica acumulada no sangue."] },
  ex:[ { q:"Onde ocorre a maior parte da absorção de nutrientes?", a:["estômago","intestino delgado","intestino grosso","esôfago"], c:1, e:"As vilosidades do intestino delgado absorvem os nutrientes." },
       { q:"Hormônio que reduz a taxa de glicose no sangue:", a:["adrenalina","insulina","glucagon","tiroxina"], c:1, e:"A insulina é produzida pelo pâncreas." } ],
  flash:[["Alvéolos","trocas gasosas"],["Artérias","saem do coração"]] },

{ id:"ecologia", materia:"Ciências", titulo:"Ecologia: cadeias alimentares e relações",
  resumo:["Níveis: indivíduo → população (mesma espécie) → comunidade (várias espécies) → ecossistema (comunidade + ambiente).",
          "Cadeia alimentar: produtores (fazem fotossíntese) → consumidores primários → secundários… Decompositores (fungos e bactérias) reciclam a matéria.",
          "A energia diminui a cada nível da cadeia, por isso há menos predadores de topo.",
          "Relações: mutualismo (ambos ganham e dependem), comensalismo (um ganha, outro indiferente), parasitismo, predação e competição.",
          "Impactos humanos: desmatamento, poluição, aquecimento global pelo aumento do efeito estufa."],
  exemplo:{ q:"Numa cadeia capim → gafanhoto → sapo → cobra, quem é o consumidor secundário?",
            passos:["Capim: produtor. Gafanhoto: consumidor primário.","Sapo: consumidor secundário."] },
  ex:[ { q:"Fungos e bactérias que reciclam a matéria orgânica são:", a:["produtores","consumidores primários","decompositores","parasitas"], c:2, e:"Eles devolvem nutrientes ao ambiente." },
       { q:"Relação em que as duas espécies se beneficiam e dependem uma da outra:", a:["comensalismo","mutualismo","parasitismo","competição"], c:1, e:"Ex.: líquen (fungo + alga)." } ],
  flash:[["Mutualismo","ambos se beneficiam (dependência)"],["Energia na cadeia","diminui a cada nível"]] },

{ id:"materia", materia:"Ciências", titulo:"Matéria: estados, misturas e separação",
  resumo:["Mudanças de estado: fusão (sólido → líquido), vaporização (líquido → gasoso), condensação (gasoso → líquido), solidificação (líquido → sólido) e sublimação (sólido ↔ gasoso).",
          "Substância pura tem composição fixa; mistura reúne duas ou mais substâncias.",
          "Mistura homogênea tem uma só fase (água com sal dissolvido); heterogênea tem mais de uma (água e óleo).",
          "Separação: filtração (sólido de líquido), decantação (por densidade), evaporação (obtém o sólido dissolvido), destilação (recupera o líquido).",
          "Fenômeno físico não muda a substância (derreter gelo); químico forma novas substâncias (queimar papel, enferrujar)."],
  exemplo:{ q:"Como obter sal a partir da água do mar?",
            passos:["O sal está dissolvido (mistura homogênea).","Deixe a água evaporar nas salinas: sobra o sal."] },
  ex:[ { q:"Para obter o sal da água do mar, usa-se:", a:["filtração","evaporação","decantação","peneiração"], c:1, e:"A água evapora e o sal fica." },
       { q:"Qual é um fenômeno químico?", a:["derreter gelo","queimar papel","quebrar vidro","dissolver açúcar"], c:1, e:"A queima forma novas substâncias." } ],
  flash:[["Sublimação","passagem direta sólido ↔ gasoso"],["Destilação","separa e recupera o líquido"]] },

{ id:"atomo", materia:"Ciências", titulo:"Átomo e tabela periódica",
  resumo:["O átomo tem núcleo (prótons, positivos, e nêutrons, sem carga) e eletrosfera (elétrons, negativos).",
          "Número atômico Z = número de prótons. Número de massa A = prótons + nêutrons.",
          "Íons: átomos que ganharam (ânion) ou perderam (cátion) elétrons. Isótopos: mesmo número de prótons.",
          "Na tabela periódica, os períodos (linhas) indicam o número de camadas; as famílias (colunas) reúnem elementos de propriedades parecidas.",
          "Gases nobres (família 18) são estáveis. Metais conduzem bem eletricidade e calor."],
  exemplo:{ q:"O sódio tem Z = 11 e A = 23. Quantos nêutrons tem?",
            passos:["N = A − Z.","N = 23 − 11 = 12."] },
  ex:[ { q:"Um átomo com Z = 11 e A = 23 tem quantos nêutrons?", a:["11","12","23","34"], c:1, e:"23 − 11 = 12." },
       { q:"Isótopos têm o mesmo número de:", a:["nêutrons","prótons","massa","elétrons perdidos"], c:1, e:"Isótopos = mesmo Z." } ],
  flash:[["Número atômico (Z)","número de prótons"],["Número de massa (A)","prótons + nêutrons"]] },

{ id:"movimento", materia:"Ciências", titulo:"Movimento, velocidade e leis de Newton",
  resumo:["Velocidade média: v = distância ÷ tempo. Para converter km/h em m/s, divida por 3,6.",
          "Movimento uniforme: s = s₀ + v·t. Para encontros, use a velocidade relativa (subtraia as velocidades se vão no mesmo sentido; some se vão em sentidos opostos).",
          "Aceleração: a = variação da velocidade ÷ tempo.",
          "1ª lei (inércia): um corpo tende a manter seu estado de movimento. 2ª lei: F = m · a. 3ª lei: toda ação tem uma reação de mesma intensidade e sentido oposto."],
  exemplo:{ q:"Um carro a 90 km/h está a quantos m/s?",
            passos:["90 ÷ 3,6 = 25 m/s."] },
  ex:[ { q:"72 km/h correspondem a:", a:["7,2 m/s","20 m/s","25 m/s","259,2 m/s"], c:1, e:"72 ÷ 3,6 = 20." },
       { q:"Um carro percorre 150 km em 2 h. Sua velocidade média é:", a:["50 km/h","75 km/h","150 km/h","300 km/h"], c:1, e:"150 ÷ 2 = 75." } ],
  flash:[["km/h → m/s","dividir por 3,6"],["2ª lei de Newton","F = m · a"]] },

{ id:"energia", materia:"Ciências", titulo:"Energia e eletricidade",
  resumo:["Formas de energia: cinética (movimento), potencial (posição), térmica, elétrica, química, luminosa. A energia se transforma, mas não se cria nem se destrói.",
          "Lei de Ohm: U = R · i (tensão = resistência × corrente).",
          "Potência elétrica: P = U · i. Consumo de energia: E = P × tempo, em kWh (potência em kW, tempo em horas).",
          "Em série, a corrente é a mesma em todos; em paralelo, a tensão é a mesma (é assim nas tomadas de casa).",
          "A matriz elétrica brasileira tem grande participação de hidrelétricas, uma fonte renovável."],
  exemplo:{ q:"Um chuveiro de 5 500 W fica ligado 20 min por dia. Quanto consome por dia?",
            passos:["5 500 W = 5,5 kW; 20 min = 1/3 h.","E = 5,5 × 1/3 ≈ 1,83 kWh."] },
  ex:[ { q:"Um aparelho de 2 000 W ligado por 30 minutos consome:", a:["0,5 kWh","1 kWh","2 kWh","60 kWh"], c:1, e:"2 kW × 0,5 h = 1 kWh." },
       { q:"Com U = 220 V e R = 110 Ω, a corrente é:", a:["0,5 A","2 A","110 A","24 200 A"], c:1, e:"i = U ÷ R = 2 A." } ],
  flash:[["Lei de Ohm","U = R · i"],["Consumo em kWh","potência (kW) × tempo (h)"]] },

{ id:"genetica", materia:"Ciências", titulo:"Genética e hereditariedade",
  resumo:["O DNA carrega as informações hereditárias. Gene é um trecho do DNA; os genes ficam nos cromossomos.",
          "A espécie humana tem 46 cromossomos nas células do corpo (23 pares) e 23 nos gametas.",
          "Alelos são versões de um gene. O dominante (A) se manifesta com uma cópia; o recessivo (a), só em dose dupla (aa).",
          "Genótipo é a composição genética; fenótipo é a característica observada (influenciada também pelo ambiente).",
          "Cruzamento Aa × Aa: 1 AA : 2 Aa : 1 aa. Probabilidade de aa: 1/4 (25%)."],
  exemplo:{ q:"Pais Aa e aa. Qual a chance de um filho aa?",
            passos:["Combinações: Aa, Aa, aa, aa.","2 em 4: 50%."] },
  ex:[ { q:"No cruzamento Aa × Aa, a probabilidade de nascer aa é:", a:["0%","25%","50%","75%"], c:1, e:"1 em 4." },
       { q:"Número de cromossomos de uma célula do corpo humano (não reprodutiva):", a:["23","44","46","48"], c:2, e:"23 pares = 46." } ],
  flash:[["Aa × Aa","1 AA : 2 Aa : 1 aa"],["Fenótipo","característica observável"]] },

/* ======================= HISTÓRIA ======================= */
{ id:"brasil-colonia", materia:"História", titulo:"Brasil Colônia",
  resumo:["Em 1500 os portugueses chegaram ao território. A primeira atividade foi a extração do pau-brasil com trabalho indígena.",
          "Capitanias hereditárias (1534) e Governo-Geral (1549, com sede em Salvador) organizaram a colonização.",
          "Nos séculos XVI e XVII, o açúcar no Nordeste foi a base econômica, com mão de obra de africanos escravizados.",
          "No século XVIII, a mineração em Minas Gerais levou a capital para o Rio de Janeiro (1763).",
          "Resistências e revoltas: quilombos (como Palmares), Inconfidência Mineira (1789) e Conjuração Baiana (1798)."],
  exemplo:{ q:"Por que a capital saiu de Salvador para o Rio de Janeiro em 1763?",
            passos:["O eixo econômico mudou para a mineração no Centro-Sul.","O porto do Rio ficava mais perto das minas e facilitava o controle do ouro."] },
  ex:[ { q:"Principal atividade econômica do Nordeste colonial nos séculos XVI e XVII:", a:["café","borracha","açúcar","algodão"], c:2, e:"Os engenhos de açúcar dominaram o período." },
       { q:"A capital da colônia foi transferida para o Rio de Janeiro em:", a:["1549","1763","1808","1822"], c:1, e:"Ligado à mineração." } ],
  flash:[["Governo-Geral","1549, sede em Salvador"],["Inconfidência Mineira","1789"]] },

{ id:"independencia-imperio", materia:"História", titulo:"Independência e Império",
  resumo:["1808: a família real portuguesa chega ao Brasil e abre os portos às nações amigas. Em 1815, o Brasil vira Reino Unido a Portugal e Algarves.",
          "1822: D. Pedro proclama a Independência. A Constituição de 1824 criou o Poder Moderador, exclusivo do imperador.",
          "Período Regencial (1831–1840): revoltas como Cabanagem, Farroupilha, Sabinada, Balaiada e Revolta dos Malês.",
          "Segundo Reinado (D. Pedro II): expansão do café, Guerra do Paraguai (1864–1870) e leis abolicionistas graduais: Eusébio de Queirós (1850), Ventre Livre (1871), Sexagenários (1885) e Lei Áurea (1888)."],
  exemplo:{ q:"Por que a abolição foi gradual?",
            passos:["A elite agrária dependia do trabalho escravizado.","Leis parciais adiaram o fim, que veio só com a Lei Áurea (1888)."] },
  ex:[ { q:"Poder exclusivo do imperador na Constituição de 1824:", a:["Executivo","Judiciário","Moderador","Legislativo"], c:2, e:"O Poder Moderador permitia intervir nos demais." },
       { q:"A Lei Áurea foi assinada em:", a:["1850","1871","1885","1888"], c:3, e:"13 de maio de 1888." } ],
  flash:[["Poder Moderador","Constituição de 1824, exclusivo do imperador"],["Lei Áurea","1888"]] },

{ id:"republica", materia:"História", titulo:"Brasil República",
  resumo:["1889: Proclamação da República. República da Espada (militares) e República Oligárquica (política do café com leite entre SP e MG; coronelismo e voto de cabresto).",
          "Revolução de 1930: Getúlio Vargas no poder. Estado Novo (1937–1945); CLT em 1943.",
          "1946–1964: período democrático; JK e a construção de Brasília (1960).",
          "1964–1985: ditadura militar, com censura e repressão (AI-5, 1968).",
          "Redemocratização: Diretas Já e Constituição de 1988, chamada de Constituição Cidadã."],
  exemplo:{ q:"O que era o voto de cabresto?",
            passos:["O voto era aberto e o coronel controlava os eleitores da região.","Eles votavam no candidato indicado por medo ou troca de favores."] },
  ex:[ { q:"A política do café com leite alternava no poder as elites de:", a:["RJ e SP","SP e MG","MG e RS","BA e PE"], c:1, e:"São Paulo (café) e Minas (leite)." },
       { q:"A Constituição atual do Brasil foi promulgada em:", a:["1946","1967","1985","1988"], c:3, e:"5 de outubro de 1988." } ],
  flash:[["Estado Novo","1937–1945, Vargas"],["AI-5","1968, endurecimento da ditadura"]] },

{ id:"rev-industrial", materia:"História", titulo:"Revolução Industrial",
  resumo:["Começou na Inglaterra no século XVIII, com a máquina a vapor e a indústria têxtil.",
          "Fatores: acúmulo de capital, reservas de carvão e ferro e mão de obra vinda do campo após os cercamentos.",
          "Consequências: urbanização, jornadas longas, trabalho infantil, surgimento da classe operária.",
          "Reações operárias: ludismo (quebra de máquinas), cartismo (direitos políticos) e sindicatos.",
          "Segunda Revolução Industrial (século XIX): eletricidade, petróleo, aço e produção em larga escala."],
  exemplo:{ q:"Por que o êxodo rural ajudou a industrialização inglesa?",
            passos:["Os cercamentos expulsaram camponeses das terras comuns.","Eles foram para as cidades e viraram mão de obra barata nas fábricas."] },
  ex:[ { q:"País pioneiro da Revolução Industrial:", a:["França","Alemanha","Inglaterra","Estados Unidos"], c:2, e:"Século XVIII." },
       { q:"Movimento de operários que quebravam as máquinas:", a:["cartismo","ludismo","socialismo","iluminismo"], c:1, e:"Ludismo." } ],
  flash:[["Ludismo","quebra de máquinas"],["2ª Revolução Industrial","eletricidade, petróleo e aço"]] },

{ id:"rev-francesa", materia:"História", titulo:"Revolução Francesa",
  resumo:["No Antigo Regime, a sociedade se dividia em três estados: clero, nobreza e o terceiro estado (a maioria, que pagava impostos).",
          "A crise financeira levou à convocação dos Estados Gerais. Em 14 de julho de 1789, a população tomou a Bastilha.",
          "Declaração dos Direitos do Homem e do Cidadão (1789). Lema: Liberdade, Igualdade, Fraternidade.",
          "Fases: Monarquia Constitucional, Convenção (jacobinos de Robespierre e o período do Terror) e Diretório.",
          "Em 1799, o golpe do 18 Brumário levou Napoleão Bonaparte ao poder."],
  exemplo:{ q:"Por que o terceiro estado se revoltou?",
            passos:["Pagava quase todos os impostos e tinha pouca voz política.","A crise econômica e as ideias iluministas aumentaram a insatisfação."] },
  ex:[ { q:"Data da tomada da Bastilha:", a:["14 de julho de 1789","7 de setembro de 1822","4 de julho de 1776","18 Brumário de 1799"], c:0, e:"Marco do início da Revolução." },
       { q:"Grupo radical liderado por Robespierre:", a:["girondinos","jacobinos","monarquistas","bonapartistas"], c:1, e:"Jacobinos." } ],
  flash:[["Tomada da Bastilha","14/07/1789"],["18 Brumário","1799, Napoleão no poder"]] },

{ id:"guerras-mundiais", materia:"História", titulo:"Guerras Mundiais",
  resumo:["1ª Guerra (1914–1918): causas foram imperialismo, nacionalismo e alianças militares (Tríplice Entente x Tríplice Aliança). O estopim foi o assassinato do arquiduque Francisco Ferdinando. Guerra de trincheiras. Tratado de Versalhes.",
          "Entreguerras: crise de 1929 e ascensão do nazifascismo.",
          "2ª Guerra (1939–1945): começa com a invasão da Polônia pela Alemanha. Eixo x Aliados. Holocausto.",
          "O Brasil enviou a Força Expedicionária Brasileira (FEB) à Itália.",
          "Fim com as bombas atômicas em Hiroshima e Nagasaki; criação da ONU (1945) e início da Guerra Fria."],
  exemplo:{ q:"Por que o Tratado de Versalhes é ligado à 2ª Guerra?",
            passos:["Impôs à Alemanha perdas territoriais e indenizações pesadas.","O ressentimento e a crise econômica ajudaram a ascensão do nazismo."] },
  ex:[ { q:"Estopim da 1ª Guerra Mundial:", a:["invasão da Polônia","assassinato de Francisco Ferdinando","crise de 1929","ataque a Pearl Harbor"], c:1, e:"Em Sarajevo, 1914." },
       { q:"Tropa brasileira enviada à Itália na 2ª Guerra:", a:["FAB","FEB","Marinha Mercante","Guarda Nacional"], c:1, e:"Força Expedicionária Brasileira." } ],
  flash:[["Início da 2ª Guerra","invasão da Polônia, 1939"],["FEB","tropa brasileira na Itália"]] },

/* ======================= GEOGRAFIA ======================= */
{ id:"cartografia", materia:"Geografia", titulo:"Cartografia: escala, coordenadas e fusos",
  resumo:["Escala numérica 1 : 100 000: 1 cm no mapa = 100 000 cm (1 km) no terreno. Distância real = distância no mapa × denominador.",
          "Latitude: distância em graus do Equador (0° a 90°, Norte ou Sul). Longitude: distância do meridiano de Greenwich (0° a 180°, Leste ou Oeste).",
          "Fusos horários: a Terra gira 360° em 24 h, então cada fuso tem 15°. Indo para leste, as horas aumentam.",
          "Projeções distorcem algo: a de Mercator preserva formas e aumenta as áreas perto dos polos; a de Peters preserva as áreas."],
  exemplo:{ q:"Em Brasília são 10h (fuso −3). Que horas são em Londres (fuso 0)?",
            passos:["Londres está 3 fusos a leste.","10h + 3h = 13h."] },
  ex:[ { q:"Em um mapa de escala 1 : 100 000, 5 cm correspondem a:", a:["500 m","5 km","50 km","0,5 km"], c:1, e:"5 × 100 000 cm = 500 000 cm = 5 km." },
       { q:"Cada fuso horário corresponde a:", a:["10° de longitude","15° de longitude","15° de latitude","24° de longitude"], c:1, e:"360° ÷ 24 h = 15°." } ],
  flash:[["Fuso horário","15° de longitude = 1 hora"],["Latitude","distância ao Equador (N/S)"]] },

{ id:"biomas", materia:"Geografia", titulo:"Climas e biomas brasileiros",
  resumo:["Amazônia: maior bioma, floresta equatorial, clima quente e úmido.",
          "Cerrado: savana do Centro-Oeste, chamado de berço das águas, muito pressionado pela agropecuária.",
          "Caatinga: semiárido nordestino, bioma exclusivamente brasileiro.",
          "Mata Atlântica: ao longo do litoral, o bioma mais devastado.",
          "Pampa: campos do Rio Grande do Sul. Pantanal: maior planície alagável do mundo.",
          "Climas do Brasil: equatorial, tropical, tropical de altitude, semiárido e subtropical."],
  exemplo:{ q:"Por que a Mata Atlântica foi tão devastada?",
            passos:["Fica onde começou a colonização e onde estão as maiores cidades.","Ciclos econômicos (pau-brasil, cana, café) e a urbanização a reduziram."] },
  ex:[ { q:"Bioma exclusivamente brasileiro do semiárido:", a:["Cerrado","Caatinga","Pampa","Pantanal"], c:1, e:"Caatinga." },
       { q:"Bioma brasileiro mais devastado:", a:["Amazônia","Mata Atlântica","Pantanal","Pampa"], c:1, e:"Restou uma pequena parte da cobertura original." } ],
  flash:[["Caatinga","semiárido, exclusivamente brasileira"],["Pantanal","maior planície alagável"]] },

{ id:"populacao", materia:"Geografia", titulo:"População",
  resumo:["População absoluta é o total de habitantes; densidade demográfica é habitantes por km². País populoso não é o mesmo que país povoado.",
          "Crescimento vegetativo = taxa de natalidade − taxa de mortalidade.",
          "Transição demográfica: com urbanização e acesso à saúde, natalidade e mortalidade caem e a população envelhece.",
          "Pirâmide etária com base larga indica muitos jovens; com topo largo, população envelhecida.",
          "Migrações internas marcaram o Brasil, como o êxodo rural e a migração de nordestinos para o Sudeste no século XX."],
  exemplo:{ q:"Um país tem 10 milhões de habitantes e 500 000 km². Qual a densidade?",
            passos:["10 000 000 ÷ 500 000 = 20 hab/km²."] },
  ex:[ { q:"Densidade demográfica é medida em:", a:["habitantes por km²","nascimentos por ano","km² por habitante","pessoas por família"], c:0, e:"hab/km²." },
       { q:"Crescimento vegetativo é:", a:["imigração − emigração","natalidade − mortalidade","natalidade + imigração","população ÷ área"], c:1, e:"Não inclui as migrações." } ],
  flash:[["Crescimento vegetativo","natalidade − mortalidade"],["Densidade demográfica","habitantes ÷ área"]] },

{ id:"urbanizacao", materia:"Geografia", titulo:"Urbanização",
  resumo:["O Brasil se urbanizou rapidamente na segunda metade do século XX, puxado pela industrialização e pelo êxodo rural.",
          "Problemas urbanos: moradias precárias e favelização, segregação espacial, trânsito e transporte público insuficiente, enchentes.",
          "Metrópole: cidade que polariza uma região. Conurbação: quando cidades vizinhas crescem até suas manchas urbanas se unirem.",
          "Rede urbana: as cidades se ligam em hierarquia (metrópoles, capitais regionais, centros locais).",
          "A Região Metropolitana do Rio de Janeiro é um exemplo de conurbação (Rio, Niterói, São Gonçalo, Baixada Fluminense)."],
  exemplo:{ q:"Por que a falta de transporte público afeta mais a periferia?",
            passos:["Os empregos se concentram nas áreas centrais.","Quem mora longe gasta mais tempo e dinheiro para se deslocar."] },
  ex:[ { q:"Conurbação é:", a:["o crescimento da população rural","a junção das manchas urbanas de cidades vizinhas","a saída do campo para a cidade","a criação de um novo município"], c:1, e:"As cidades se \"emendam\"." },
       { q:"Êxodo rural é:", a:["a saída da cidade para o campo","a saída do campo para a cidade","a migração entre países","o crescimento natural da população"], c:1, e:"Campo → cidade." } ],
  flash:[["Conurbação","cidades vizinhas cujas áreas urbanas se unem"],["Êxodo rural","migração do campo para a cidade"]] },

{ id:"globalizacao", materia:"Geografia", titulo:"Globalização e blocos econômicos",
  resumo:["Globalização é a integração econômica, tecnológica e cultural entre os países, acelerada pela internet e pelos transportes.",
          "Empresas transnacionais espalham etapas da produção por vários países.",
          "Blocos econômicos: Mercosul (fundado por Brasil, Argentina, Paraguai e Uruguai), União Europeia (com moeda comum, o euro, em boa parte dos membros) e o acordo entre Estados Unidos, México e Canadá.",
          "A globalização aproxima mercados, mas também aumenta desigualdades e a dependência entre economias."],
  exemplo:{ q:"Por que um tênis pode ser desenhado em um país e fabricado em outro?",
            passos:["As transnacionais buscam custos menores de produção.","Os transportes e a comunicação permitem coordenar tudo à distância."] },
  ex:[ { q:"Países fundadores do Mercosul:", a:["Brasil, Chile, Peru e Bolívia","Brasil, Argentina, Paraguai e Uruguai","Brasil, Argentina, Chile e Uruguai","Brasil, Venezuela, Paraguai e Uruguai"], c:1, e:"Tratado de Assunção (1991)." },
       { q:"Moeda comum adotada por boa parte da União Europeia:", a:["dólar","libra","euro","franco"], c:2, e:"Euro." } ],
  flash:[["Mercosul (fundadores)","Brasil, Argentina, Paraguai e Uruguai"],["Transnacional","empresa com produção em vários países"]] },

{ id:"regioes", materia:"Geografia", titulo:"Regiões do Brasil e o estado do Rio de Janeiro",
  resumo:["O IBGE divide o Brasil em 5 regiões: Norte, Nordeste, Centro-Oeste, Sudeste e Sul. São 26 estados e o Distrito Federal.",
          "Há também a divisão em três regiões geoeconômicas: Amazônia, Nordeste e Centro-Sul.",
          "O Rio de Janeiro fica no Sudeste, a região mais populosa e industrializada.",
          "No estado do RJ, o Norte Fluminense (Campos dos Goytacazes, Macaé) se destaca na produção de petróleo da Bacia de Campos; a Região Serrana tem relevo montanhoso e clima mais ameno."],
  exemplo:{ q:"Por que Macaé cresceu tanto nas últimas décadas?",
            passos:["Virou base de apoio da exploração de petróleo na Bacia de Campos.","Empresas e trabalhadores se instalaram na cidade."] },
  ex:[ { q:"Em quantas regiões o IBGE divide o Brasil?", a:["3","4","5","6"], c:2, e:"Norte, Nordeste, Centro-Oeste, Sudeste e Sul." },
       { q:"O estado do Rio de Janeiro pertence à região:", a:["Sul","Sudeste","Centro-Oeste","Nordeste"], c:1, e:"Sudeste." } ],
  flash:[["Regiões do IBGE","Norte, Nordeste, Centro-Oeste, Sudeste e Sul"],["Regiões geoeconômicas","Amazônia, Nordeste e Centro-Sul"]] },

/* ======================= INGLÊS ======================= */
{ id:"present", materia:"Inglês", titulo:"Verb to be, Simple Present e Present Continuous",
  resumo:["Verb to be: I am; you/we/they are; he/she/it is.",
          "Simple Present (hábitos e verdades): na 3ª pessoa do singular acrescente -s/-es: she goes, he studies.",
          "Negativa e pergunta com do/does: She doesn't play. Does she play? (depois de does, o verbo volta à forma base).",
          "Present Continuous (ações acontecendo agora): am/is/are + verbo com -ing: They are playing now.",
          "Palavras-pista: every day, always, usually → Simple Present; now, at the moment, look! → Present Continuous."],
  exemplo:{ q:"Complete: \"My brother ___ (watch) TV every night.\"",
            passos:["Hábito (every night) → Simple Present.","3ª pessoa: watches."] },
  ex:[ { q:"\"She ___ to school every day.\"", a:["go","goes","going","is go"], c:1, e:"3ª pessoa no Simple Present: goes." },
       { q:"\"They ___ playing soccer now.\"", a:["is","are","am","do"], c:1, e:"They + are + -ing." } ],
  flash:[["does + verbo","verbo na forma base (Does she play?)"],["now / at the moment","Present Continuous"]] },

{ id:"past", materia:"Inglês", titulo:"Simple Past",
  resumo:["Verbos regulares recebem -ed: play → played, study → studied.",
          "Irregulares têm forma própria: go → went, see → saw, buy → bought, take → took, have → had.",
          "Negativa e pergunta com did/didn't + verbo na forma base: I didn't go. Did you see it?",
          "Was/were: passado do verb to be (I/he/she/it was; you/we/they were).",
          "Pistas: yesterday, last week, ago, in 2010."],
  exemplo:{ q:"Passe para a negativa: \"She bought a book.\"",
            passos:["Use didn't + forma base.","She didn't buy a book."] },
  ex:[ { q:"\"Yesterday I ___ a movie.\"", a:["watch","watched","watching","watches"], c:1, e:"Yesterday → passado: watched." },
       { q:"\"Did she ___ the bus?\"", a:["took","takes","take","taking"], c:2, e:"Depois de did: forma base." } ],
  flash:[["go (passado)","went"],["did + verbo","forma base (Did you see?)"]] },

{ id:"reading", materia:"Inglês", titulo:"Estratégias de leitura (reading)",
  resumo:["Cognatos são palavras parecidas com o português e de mesmo sentido: important, family, information.",
          "Falsos cognatos enganam: actually (na verdade), pretend (fingir), push (empurrar), parents (pais), college (faculdade), library (biblioteca).",
          "Skimming: leitura rápida para captar a ideia geral. Scanning: busca de uma informação específica (data, nome, número).",
          "Leia a pergunta antes do texto e procure palavras-chave. Use o contexto para deduzir palavras desconhecidas.",
          "Prefixos e sufixos ajudam: un- (negação), -ful (cheio de), -less (sem), -ly (advérbio)."],
  exemplo:{ q:"O que significa \"careless\"?",
            passos:["care = cuidado; -less = sem.","careless = descuidado."] },
  ex:[ { q:"\"Actually\" significa:", a:["atualmente","na verdade","atuar","atual"], c:1, e:"Falso cognato: atualmente = nowadays." },
       { q:"Técnica para encontrar rapidamente uma data no texto:", a:["skimming","scanning","translating","summarizing"], c:1, e:"Scanning busca informação específica." } ],
  flash:[["Skimming","ideia geral"],["Scanning","informação específica"]] },

{ id:"modals", materia:"Inglês", titulo:"Modal verbs",
  resumo:["Can / could: habilidade ou permissão (I can swim; Could I go?).",
          "Must: obrigação forte ou dedução (You must wear a seatbelt). Mustn't: proibição.",
          "Should: conselho (You should study more).",
          "May / might: possibilidade (It might rain). Will: futuro e decisões (I will help you).",
          "Depois de um modal, o verbo vem na forma base, sem \"to\" e sem -s: She can play (e não \"she cans plays\")."],
  exemplo:{ q:"Dê um conselho a um amigo cansado.",
            passos:["Conselho → should.","You should go to bed early."] },
  ex:[ { q:"\"You ___ wear a seatbelt. It's the law.\"", a:["might","must","could","may"], c:1, e:"Obrigação legal: must." },
       { q:"\"You look tired. You ___ rest.\"", a:["should","mustn't","can't","would"], c:0, e:"Conselho: should." } ],
  flash:[["should","conselho"],["mustn't","proibição"]] },

{ id:"comparatives", materia:"Inglês", titulo:"Comparatives and superlatives",
  resumo:["Adjetivos curtos: -er / the -est (tall, taller, the tallest; big, bigger, the biggest).",
          "Adjetivos longos: more / the most (interesting, more interesting, the most interesting).",
          "Irregulares: good → better → the best; bad → worse → the worst; far → farther → the farthest.",
          "Igualdade: as … as (She is as tall as her brother).",
          "Comparativo usa \"than\": This book is better than that one."],
  exemplo:{ q:"Compare: Rio / São Paulo (big).",
            passos:["Adjetivo curto terminado em consoante-vogal-consoante: dobra a consoante.","São Paulo is bigger than Rio."] },
  ex:[ { q:"\"This book is ___ than that one.\" (interesting)", a:["interestinger","more interesting","most interesting","the most interesting"], c:1, e:"Adjetivo longo: more … than." },

ACTIONS.signup = async f => {
  const d = formData(f), err = $("#signupErr");
  const isAdmin = !!d.isAdmin;
  const role = isAdmin ? "admin" : d.role;
  const username = (d.username || "").trim().toLowerCase();
  const problems = [];
  if (!d.name || d.name.trim().length < 2) problems.push("Informe como quer ser chamado(a).");
  if (!/^[a-z0-9._-]{3,24}$/.test(username)) problems.push("O usuário deve ter de 3 a 24 caracteres: letras minúsculas, números, ponto, traço ou sublinhado.");
  if (Object.values(db.users).some(u => u.username === username)) problems.push("Esse nome de usuário já existe neste aparelho.");
  const pp = passwordProblems(d.pw || ""); if (pp.length) problems.push("A senha precisa " + pp.join(" e ") + ".");
  if (d.pw !== d.pw2) problems.push("As senhas não conferem.");
  if (isAdmin && hasAdmin()) problems.push("Já existe um administrador neste aparelho.");
  if (role === "aluno" && d.minor && !d.guardian) problems.push("Para menores de 18 anos, é preciso a autorização do responsável.");
  if (!d.terms) problems.push("É preciso concordar com a política de privacidade.");
  if (problems.length) { err.innerHTML = problems.map(esc).join("<br>"); return; }
  err.textContent = "Criando conta com segurança…";
  try {
    const h = await hashPassword(d.pw);
    const id = uid("u_");
    const status = role === "professor" && hasAdmin() ? "pendente" : "ativo";
    db.users[id] = { id, role, name:d.name.trim().slice(0, 40), username, salt:h.salt, hash:h.hash, created:now(), status,
      grade: role === "aluno" ? d.grade : "", minor: role === "aluno" ? !!d.minor : false,
      consent:{ terms:now(), guardian: role === "aluno" && d.minor ? now() : null } };
    audit("Conta criada: " + username + " (" + role + ")");
    save();
    if (status === "pendente") { toastLater = "Conta criada. Um administrador precisa aprovar seu perfil de professor."; go("entrar"); return; }
    setSession(id);
    toastLater = "Conta criada! Bem-vindo(a).";
    go(role === "aluno" ? "painel" : role === "professor" ? "professor" : "admin");
  } catch (e) { err.textContent = e.message; }
};

function streak(p) {
  const days = new Set(p.answers.map(a => todayKey(a.t)));
  let s = 0, t = startOfDay();
  if (!days.has(todayKey(t))) t -= DAY;
  while (days.has(todayKey(t))) { s++; t -= DAY; }
  return s;
}

ACTIONS.diag = f => {
  const d = formData(f);
  const miss = DIAGNOSTICO.filter((q, i) => d["d" + i] === undefined).length;
  if (miss) { $("#diagErr").textContent = "Faltam " + miss + " pergunta(s). Se não souber, marque a que achar mais provável."; return; }
  const byMat = {}; MATERIAS.forEach(m => byMat[m] = { ok:0, n:0 });
  const weak = []; let score = 0;
  DIAGNOSTICO.forEach((q, i) => {
    const ok = Number(d["d" + i]) === q.c; byMat[q.materia].n++; if (ok) { byMat[q.materia].ok++; score++; } else weak.push(q.aula);

  });
  MATERIAS.forEach(m => { const b = byMat[m]; b.pct = pct(b.ok, b.n); b.level = b.pct >= 80 ? "avançado" : b.pct >= 50 ? "intermediário" : "básico"; });

};

const PAGE = 8;
function filterQuestions(f, p) {
  const fav = p ? new Set(p.favs) : new Set();
  const lastByQ = {}; if (p) p.answers.forEach(a => { if (a.q) lastByQ[a.q] = a; });
  const wrong = p ? new Set(errorNotebook(p).filter(e => !e.lastOk).map(e => e.id)) : new Set();
  const b = f.busca.trim().toLowerCase();
  return allQuestions().filter(q =>
    (!f.inst || q.inst === f.inst || (f.inst === "@alvos" && p && (p.alvos || []).includes(q.inst))) && (!f.ano || String(q.ano) === f.ano) && (!f.materia || q.materia === f.materia) &&
    (!f.assunto || q.assunto === f.assunto) && (!f.dif || String(q.dif) === f.dif) && (!f.gab || q.gabTipo === f.gab) &&
        (!b || (q.enun + " " + Object.values(q.alts || {}).join(" ")).toLowerCase().includes(b)) &&
    (!f.status || (f.status === "nao" && !lastByQ[q.id]) || (f.status === "erradas" && wrong.has(q.id)) || (f.status === "favoritas" && fav.has(q.id)) || (f.status === "feitas" && lastByQ[q.id])));
}
route("questoes", () => {

  const shown = list.slice(f.page * PAGE, f.page * PAGE + PAGE);

  const mats = Array.from(new Set(qs.map(q => q.materia))).map(m => [m, m]);
  const ass = Array.from(new Set(qs.map(q => q.assunto))).map(a => [a, assuntoLabel(a)]).sort((a, b) => a[1].localeCompare(b[1]));
  return `<div class="pagehead"><h1>Banco de questões</h1><p>${qs.length} questões de provas reais (${qs.filter(q => q.gabTipo === "oficial").length} com gabarito oficial conferido), com resolução passo a passo. Cada questão mostra de onde veio o gabarito.</p></div>
  <form class="card filters" data-form="qfilter" style="margin-bottom:14px">
    <div class="field" style="margin:0"><label for="f_inst">Instituição</label><select id="f_inst" data-change="qfilter"><option value="">Todas</option>${p && (p.alvos || []).length ? `<option value="@alvos" ${f.inst === "@alvos" ? "selected" : ""}>Minhas escolas-alvo</option>` : ""}${opt(insts, f.inst)}</select></div>
    <div class="field" style="margin:0"><label for="f_ano">Ano da prova</label><select id="f_ano" data-change="qfilter"><option value="">Todos</option>${opt(anos, f.ano)}</select></div>
    <div class="field" style="margin:0"><label for="f_materia">Matéria</label><select id="f_materia" data-change="qfilter"><option value="">Todas</option>${opt(mats, f.materia)}</select></div>
    <div class="field" style="margin:0"><label for="f_assunto">Assunto</label><select id="f_assunto" data-change="qfilter"><option value="">Todos</option>${opt(ass, f.assunto)}</select></div>
    <div class="field" style="margin:0"><label for="f_gab">Gabarito</label><select id="f_gab" data-change="qfilter"><option value="">Oficial e verificado</option>${opt([["oficial","Só gabarito oficial"],["verificado","Só verificado"]], f.gab)}</select></div>
    <div class="field" style="margin:0"><label for="f_dif">Dificuldade</label><select id="f_dif" data-change="qfilter"><option value="">Todas</option>${opt([1,2,3,4,5].map(n => [n, n + " — " + stars(n)]), f.dif)}</select></div>
    ${p ? `<div class="field" style="margin:0"><label for="f_status">Situação</label><select id="f_status" data-change="qfilter"><option value="">Todas</option>${opt([["nao","Não respondidas"],["feitas","Já respondidas"],["erradas","Erradas (a refazer)"],["favoritas","Favoritas"]], f.status)}</select></div>` : ""}
    <div class="field" style="margin:0"><label for="f_busca">Buscar no texto</label><input type="text" id="f_busca" value="${esc(f.busca)}" placeholder="ex.: idade, juros"></div>

function gabFonteHTML(q) {
  const f = fonteOf(q);
  if (q.gabTipo === "oficial") return f.gabUrl ? `Gabarito conferido em: <a href="${esc(f.gabUrl)}" target="_blank" rel="noopener">${esc(f.gabNome || "gabarito oficial")}</a>.` : "";

}
const gabChip = q => q.gabTipo === "oficial" ? `<span class="chip ok" title="Letra conferida no gabarito oficial da banca">gabarito oficial</span>` : `<span class="chip" title="Gabarito oficial não localizado: letra conferida pela resolução">gabarito verificado</span>`;
function qCard(q, ctx = {}) {
  const st = S.qState[(ctx.key || "") + q.id] || {};
  const p = isStudent() ? prog() : null;
  const fav = p && p.favs.includes(q.id);
  const fonte = fonteOf(q);
  const answered = st.ch !== undefined;
  const disc = q.tipo === "discursiva";
  const head = `<div class="q-head"><span class="chip inst">${esc(instName(q.inst))}${q.unidade ? " · " + esc(q.unidade) : ""}</span><span class="chip">Prova ${q.ano}</span>${q.num ? `<span class="chip">Questão ${q.num}</span>` : ""}${gabChip(q)}
    <span class="chip">${esc(q.materia)}</span><span class="chip">${esc(assuntoLabel(q.assunto))}</span>${disc ? `<span class="chip warn">discursiva</span>` : ""}
    <span class="stars" title="Dificuldade ${q.dif} de 5" aria-label="Dificuldade ${q.dif} de 5">${stars(q.dif)}</span>
    ${p && ctx.src === "banco" ? `<button class="btn ghost sm addl ${(p.listaRascunho || []).includes(q.id) ? "on" : ""}" data-act="toggleListQ" data-q="${q.id}" title="Escolher esta questão para uma lista">${(p.listaRascunho || []).includes(q.id) ? "✓ Na lista" : "＋ Lista"}</button>` : ""}
    ${p ? `<button class="fav ${fav ? "on" : ""}" data-act="fav" data-q="${q.id}" aria-label="${fav ? "Remover dos favoritos" : "Salvar como favorita"}" title="Favorita">${fav ? "★" : "☆"}</button>` : ""}</div>`;
  let body;
  if (disc) {
    body = !st.revealed ? `<button class="btn sec sm" data-act="reveal" data-q="${q.id}" data-k="${ctx.key || ""}" data-src="${ctx.src || "banco"}">Ver resposta e resolução</button>`
      : `<div class="note info"><b>Resposta:</b> ${esc(q.resposta)}</div>${p && st.ch === undefined ? `<div class="row" style="margin-top:10px"><span>Como você foi?</span><button class="btn sm" data-act="selfmark" data-q="${q.id}" data-k="${ctx.key || ""}" data-src="${ctx.src || "banco"}" data-ok="1">Acertei</button><button class="btn sec sm" data-act="selfmark" data-q="${q.id}" data-k="${ctx.key || ""}" data-src="${ctx.src || "banco"}" data-ok="0">Errei</button></div>` : ""}`;
  } else {
    body = `<div class="alts">${Object.entries(q.alts).map(([L, t]) => {
      let cls = ""; if (answered) { if (L === q.gab) cls = "right"; else if (L === st.ch) cls = "wrong"; }
      return `<button class="alt ${cls}" ${answered ? "disabled" : ""} data-act="ans" data-q="${q.id}" data-k="${ctx.key || ""}" data-src="${ctx.src || "banco"}" data-l="${L}"><span class="L">${L}</span><span>${esc(t)}</span></button>`;
    }).join("")}</div>`;
  }
  const showRes = answered || (disc && st.revealed);
  const wrong = answered && !disc ? st.ch !== q.gab : (disc && st.ch === "0");
  const aula = aulaById(q.assunto);
  const res = showRes ? `<div class="res">

/* ============================================================
   MISSÃO DO DIA, ESCOLAS-ALVO E SIMULADOS NO FORMATO REAL
   ============================================================ */
const MISSAO_N = 10;
/* Matérias cobradas por escola (conforme os editais resumidos em INSTITUICOES) */
const MATERIAS_INST = {
  CMRJ:["Matemática","Português"], SCMB:["Matemática","Português"], CPII:["Matemática","Português"],
  CEFET:["Matemática","Português"], IFRJ:["Matemática","Português"], FAETEC:["Matemática","Português"],
  EPCAR:["Português","Matemática","Inglês"],
  CN:["Matemática","Inglês","Português","História","Geografia","Ciências"]
};
const alvosOf = p => (p && p.alvos) || [];
function materiasAlvo(p) {
  const a = alvosOf(p); if (!a.length) return MATERIAS.slice();
  const s = new Set(); a.forEach(i => (MATERIAS_INST[i] || MATERIAS).forEach(m => s.add(m)));
  return MATERIAS.filter(m => s.has(m));
}

/* ---------- montagem da missão ---------- */
function buildMission(p) {
  const qs = allQuestions().filter(q => q.tipo !== "discursiva");
  const answered = new Set(p.answers.map(a => a.q));
  const alvos = alvosOf(p), mats = materiasAlvo(p);
  const picked = [];
  const add = q => { if (q && !picked.includes(q.id) && picked.length < MISSAO_N) picked.push(q.id); };
  const score = q => Math.abs(q.dif - (nivelDe(p, q.materia) || 3)) * 3 + (answered.has(q.id) ? 100 : 0) + (alvos.length && !alvos.includes(q.inst) ? 10 : 0) + (mats.includes(q.materia) ? 0 : 30) + (q.gabTipo === "oficial" ? 0 : 2) + Math.random() * 5;
  reviewDue(p).slice(0, 4).forEach(id => add(qById(id)));                                 // 1) revisões vencidas
  recommendations(p).slice(0, 3).forEach(r => add(qs.filter(q => q.assunto === r.assunto && !picked.includes(q.id)).sort((x, y) => score(x) - score(y))[0])); // 2) pontos fracos
  const byMat = {}; mats.forEach(m => byMat[m] = qs.filter(q => q.materia === m).sort((x, y) => score(x) - score(y)));
  for (let i = 0, guard = 0; picked.length < MISSAO_N && guard < 300; i++, guard++) {    // 3) rodízio entre as matérias das escolas-alvo
    const list = byMat[mats[i % mats.length]];
    while (list.length && picked.includes(list[0].id)) list.shift();
    if (list.length) add(list.shift());
    if (mats.every(m => !byMat[m].length)) break;
  }
  qs.sort((x, y) => score(x) - score(y)).forEach(add);
  return { dia:todayKey(), qids:picked, feitas:{}, ch:{}, pos:0, aula:null, aulaMotivo:"", aulaOk:false, t:now() };
}
function getMission(p) {
  if (!p.missao || p.missao.dia !== todayKey()) { p.missao = buildMission(p); save(); }
  return p.missao;
}
function missionAula(p, m) {
  const cnt = {};
  m.qids.filter(id => m.feitas[id] === false).map(qById).filter(Boolean).forEach(q => { if (aulaById(q.assunto)) cnt[q.assunto] = (cnt[q.assunto] || 0) + 1; });
  const top = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
  if (top) return { id:top[0], motivo:"Você errou " + top[1] + " questão(ões) deste assunto na missão de hoje." };
  const rec = recommendations(p)[0];
  if (rec) return { id:rec.assunto, motivo:"Você acertou tudo hoje. Esta aula é de um assunto em que ainda há erros acumulados." };
  const next = AULAS.find(a => materiasAlvo(p).includes(a.materia) && !p.lessonsDone.includes(a.id)) || AULAS[0];
  return { id:next.id, motivo:"Você acertou tudo hoje. Esta é a próxima aula ainda não estudada nas matérias das suas escolas." };
}
function missionAnswered(qid, ok, letter) {
  const p = prog(), m = p.missao;
  if (!m || m.dia !== todayKey() || !m.qids.includes(qid) || m.feitas[qid] !== undefined) return;
  m.feitas[qid] = ok; m.ch = m.ch || {}; m.ch[qid] = letter;
  if (Object.keys(m.feitas).length >= m.qids.length && !m.aula) { const a = missionAula(p, m); m.aula = a.id; m.aulaMotivo = a.motivo; }
  save();
}
function missionStreak(p) {
  const done = p.missoesFeitas || {}; let s = 0, t = startOfDay();
  if (!done[todayKey(t)]) t -= DAY;
  while (done[todayKey(t)]) { s++; t -= DAY; }
  return s;
}

/* ---------- escolas-alvo ---------- */
function alvosView(p) {
  const sel = new Set(alvosOf(p)), qs = allQuestions();
  return `<div class="pagehead"><h1>Para quais escolas você vai fazer prova?</h1><p>Marque uma ou mais. A missão diária, o banco de questões e os simulados passam a priorizar essas escolas. Dá para mudar quando quiser.</p></div>
  <form class="card" data-form="saveAlvos"><div class="grid g2">${INSTITUICOES.map(i => {
    const n = qs.filter(q => q.inst === i.id).length;
    return `<label class="check alvo"><input type="checkbox" name="alvo" value="${i.id}" ${sel.has(i.id) ? "checked" : ""}><span><b>${esc(i.sigla)}</b> <span class="hint">${esc(i.nome)}</span><br><span class="hint">${n ? n + " questões no banco" : "ainda sem questões no banco"} · ${esc((MATERIAS_INST[i.id] || ["matérias conforme o edital"]).join(", "))}</span></span></label>`;
  }).join("")}</div>
  <div class="row" style="margin-top:14px"><button class="btn">Salvar minhas escolas</button><button class="btn ghost" type="button" data-act="alvosNaoSei">Ainda não sei (estudar tudo)</button>${p.alvos ? `<a class="btn ghost" href="#painel" data-act="alvosCancel">Cancelar</a>` : ""}</div></form>`;
}
function setAlvos(list) {
  const p = prog(); p.alvos = list; S.editAlvos = false;
  if (p.missao && !Object.keys(p.missao.feitas).length) delete p.missao;   // missão ainda não começada: refaz com as novas escolas
  audit("Escolas-alvo definidas: " + (list.join(", ") || "nenhuma"));

function montarFormato(f, curta, p) {
  const done = new Set(p.answers.map(a => a.q)), usados = new Set();
  const avisos = [];
  const partes = f.partes.map(pt => {
    const n = curta ? Math.ceil(pt.n / 4) : pt.n;
    const pool = shuffle(allQuestions().filter(q => q.tipo !== "discursiva" && pt.materias.includes(q.materia) && !usados.has(q.id)))
      .sort((a, b) => ((a.inst === f.inst ? 0 : 4) + (a.gabTipo === "oficial" ? 0 : 1) + (done.has(a.id) ? 2 : 0)) - ((b.inst === f.inst ? 0 : 4) + (b.gabTipo === "oficial" ? 0 : 1) + (done.has(b.id) ? 2 : 0)));
    const ids = pool.slice(0, n).map(q => q.id); ids.forEach(id => usados.add(id));
    const daInst = ids.filter(id => qById(id).inst === f.inst).length;
    if (ids.length < n) avisos.push(`${pt.label}: o banco tem só ${ids.length} das ${n} questões; o simulado terá ${ids.length}.`);
    else if (daInst < ids.length) avisos.push(`${pt.label}: ${daInst} questão(ões) de provas da própria ${instName(f.inst)} e ${ids.length - daInst} de outras escolas com o mesmo conteúdo.`);
    return { label:pt.label, alvo:n, ids };
  });
  return { partes, avisos };
}

/* ============================================================
   ALUNO: cronograma, métodos, redação, desempenho e turmas
   ============================================================ */
const DIAS = ["Segunda","Terça","Quarta","Quinta","Sexta","Sábado","Domingo"];

/* ---------- cronograma inteligente ---------- */
function buildPlan(cfg, p) {
  const inst = cfg.insts || [];
  const matW = { "Matemática":3, "Português":3, "Ciências":1, "História":1, "Geografia":1, "Inglês":1 };
  if (inst.some(i => i === "CN" || i === "EPCAR")) matW["Inglês"] = 2;
  if (inst.includes("CN")) { matW["Ciências"] = 2; matW["História"] = 1.5; matW["Geografia"] = 1.5; }
  if (!inst.length) { matW["Matemática"] = 2; matW["Português"] = 2; matW["Ciências"] = 1.5; }
  const recs = recommendations(p);
  const w = AULAS.map(a => {
    let s = matW[a.materia] || 1;
    const r = recs.find(x => x.assunto === a.id);
    if (r) s += 2 + Math.min(4, r.wrongConc) + (r.diag ? 2 : 0);
    const m = mastery(p, a.id); if (m.pct !== null && m.pct >= 80) s *= 0.4;
    if (p.lessonsDone.includes(a.id) && !r) s *= 0.6;
    if (allQuestions().some(q => q.assunto === a.id) && inst.length) s += 1;
    return { a, s };
  }).sort((x, y) => y.s - x.s);
  const blocksPerDay = Math.max(1, Math.floor(cfg.minutes / 30));
  const days = cfg.days.map(Number).sort((a, b) => a - b);
  const lastDay = days[days.length - 1];
  const queue = []; // intercalação: alterna matérias
  const byMat = {}; w.forEach(x => { (byMat[x.a.materia] = byMat[x.a.materia] || []).push(x); });
  const order = Object.keys(byMat).sort((a, b) => byMat[b][0].s - byMat[a][0].s);
  for (let round = 0; queue.length < 60 && round < 20; round++) order.forEach(m => { const it = byMat[m][round]; if (it && it.s > 0.8) queue.push(it.a); });
  let qi = 0, bid = 0;
  const plan = { created:now(), cfg, days:[] };
  days.forEach((dow, di) => {
    const blocks = [];
    let left = blocksPerDay;
    if (di % 2 === 0 || reviewDue(p).length) { blocks.push({ id:"b" + (bid++), type:"rev", label:"Revisão espaçada e caderno de erros", link:"revisao", min:25 }); left--; }
    if (dow === lastDay && days.length > 1 && left >= 2) { blocks.push({ id:"b" + (bid++), type:"sim", label:"Simulado " + (inst[0] ? instName(inst[0]) : "misto"), link:"simulados", min:Math.min(60, (left) * 25) }); left -= 2; }
    if (dow === days[Math.floor(days.length / 2)] && left >= 2) { blocks.push({ id:"b" + (bid++), type:"red", label:"Redação: escrever e revisar", link:"redacao", min:50 }); left -= 2; }
    while (left > 0) {
      const a = queue[qi % queue.length]; qi++;
      const hasQ = allQuestions().some(q => q.assunto === a.id);
      blocks.push({ id:"b" + (bid++), type:"aula", label:(hasQ && left > 1 ? "Aula + questões: " : "Aula: ") + a.titulo, link:"aula-" + a.id, aula:a.id, min:25 });
      left--;
    }
    plan.days.push({ dow, blocks });
  });
  return plan;
}
route("cronograma", () => {

const INFORMAIS = ["a gente","tipo assim","né","vc","vcs","pq","tá ","pra ","tô ","blz","aí ","daí "];
function analyzeEssay(text, tema) {
  const out = [];
  const clean = text.replace(/\r/g, "").trim();
  const words = clean ? clean.split(/\s+/).filter(Boolean) : [];
  const paras = clean.split(/\n\s*\n|\n/).map(s => s.trim()).filter(s => s.split(/\s+/).length >= 8);
  const sentences = clean.split(/(?<=[.!?])\s+/).filter(s => s.trim());
  const low = " " + clean.toLowerCase() + " ";
  const add = (crit, lvl, msg) => out.push({ crit, lvl, msg });
  // 1. tamanho
  const lines = Math.round(words.length / 10);
  if (words.length < 120) add("Extensão", "bad", `Texto curto: ${words.length} palavras (cerca de ${lines} linhas). Provas costumam pedir de 20 a 30 linhas (aprox. 200 a 320 palavras).`);
  else if (words.length > 420) add("Extensão", "warn", `Texto longo: ${words.length} palavras (cerca de ${lines} linhas). Verifique o limite de linhas da prova.`);
  else add("Extensão", "ok", `${words.length} palavras, cerca de ${lines} linhas manuscritas.`);
  // 2. tema
  const hits = tema.chaves.filter(k => low.includes(k.toLowerCase()));
  if (hits.length / tema.chaves.length >= 0.4) add("Tema", "ok", `O texto retoma palavras-chave do tema (${hits.join(", ")}).`);
  else add("Tema", hits.length ? "warn" : "bad", `Poucas palavras ligadas ao tema${hits.length ? " (" + hits.join(", ") + ")" : ""}. Confira se você está respondendo exatamente ao que foi proposto, e não a um assunto vizinho.`);
  // 3. estrutura
  if (paras.length >= 4) add("Estrutura", "ok", `${paras.length} parágrafos: dá para ter introdução, dois de desenvolvimento e conclusão.`);
  else add("Estrutura", paras.length >= 3 ? "warn" : "bad", `${paras.length} parágrafo(s). O modelo dissertativo usa em geral 4: introdução com a tese, dois de desenvolvimento com argumentos e conclusão.`);
  if (paras.length >= 3) {
    const last = paras[paras.length - 1].toLowerCase();
    if (/(portanto|logo|assim|dessa forma|desse modo|em suma|conclui|por fim|enfim|diante disso)/.test(last)) add("Estrutura", "ok", "A conclusão é anunciada por um conectivo conclusivo.");
    else add("Estrutura", "warn", "O último parágrafo não tem marca de conclusão. Experimente começar com \"Portanto,\" ou \"Diante disso,\" e retomar a tese.");
  }
  // 4. coesão
  const con = CONECTIVOS.filter(c => low.includes(" " + c + " ") || low.includes(" " + c + ","));
  if (con.length >= 5) add("Coesão", "ok", `Bom uso de conectivos (${con.slice(0, 6).join(", ")}…).`);
  else add("Coesão", con.length >= 3 ? "warn" : "bad", `Poucos conectivos variados (${con.length}). Ligue as ideias com "além disso", "no entanto", "portanto", "por exemplo".`);
  // 5. norma e clareza
  const longS = sentences.filter(s => s.split(/\s+/).length > 45);
  if (longS.length) add("Clareza", "warn", `${longS.length} frase(s) com mais de 45 palavras. Divida em frases menores.`);
  const inf = INFORMAIS.filter(x => low.includes(" " + x));
  if (inf.length) add("Registro formal", "bad", `Expressões informais: ${inf.map(x => "\"" + x.trim() + "\"").join(", ")}. Use linguagem formal.`);
  else add("Registro formal", "ok", "Não foram encontradas expressões informais comuns.");
  if (/(^|\s)(eu acho|na minha opinião|eu penso)/i.test(clean)) add("Registro formal", "warn", "Evite \"eu acho\" ou \"na minha opinião\" em texto dissertativo: defenda a ideia de forma impessoal.");
  const freq = {}; words.map(w => w.toLowerCase().replace(/[^\p{L}]/gu, "")).filter(w => w.length > 5).forEach(w => freq[w] = (freq[w] || 0) + 1);
  const rep = Object.entries(freq).filter(([, n]) => n >= 4).sort((a, b) => b[1] - a[1]).slice(0, 3);
  if (rep.length) add("Vocabulário", "warn", `Palavras repetidas: ${rep.map(([w, n]) => w + " (" + n + "x)").join(", ")}. Use sinônimos ou pronomes.`);
  if (/[a-zà-ú][.!?]\s+[a-zà-ú]/.test(clean)) add("Norma", "warn", "Há frase começando com letra minúscula depois de ponto.");
  if (/\s[,.;:]/.test(clean)) add("Norma", "warn", "Há espaço antes de vírgula ou ponto.");
  if (/\bmais\b[^.]{0,3}(também|ainda assim)/i.test(clean)) add("Norma", "warn", "Confira \"mais\" (quantidade) x \"mas\" (oposição).");
  return out;
}

/* ---------- turmas do aluno e atividades ---------- */
function pendingActivities(u) {
  if (!u || u.role !== "aluno") return [];
  const p = prog(u.id), list = [];
  p.classes.forEach(cid => { const c = db.classes[cid]; if (!c) return; (c.activities || []).forEach(a => { if (a.targets && a.targets.length && !a.targets.includes(u.id)) return; if (!p.activitiesDone[a.id]) list.push(Object.assign({ className:c.name }, a)); }); });
  p.imported.forEach(a => { if (!p.activitiesDone[a.id]) list.push(a); });
  return list;
}
function findActivity(id) {
  const p = prog();
  for (const cid of p.classes) { const c = db.classes[cid]; if (c) { const a = (c.activities || []).find(x => x.id === id); if (a) return Object.assign({ className:c.name }, a); } }
  return p.imported.find(a => a.id === id);
}
function markActivity(id, ok, n) { const p = prog(); p.activitiesDone[id] = { t:now(), ok, n }; save(); }
function checkActivityDone() {
  const id = S.currentActivity; if (!id) return;
  const a = findActivity(id); if (!a) return;
  const p = prog();
  const done = a.qs.filter(q => p.answers.some(x => x.q === q && x.src === "atividade" && x.t >= (S.activityStart || 0)));
  if (done.length === a.qs.length && !p.activitiesDone[id]) {
    const ok = a.qs.filter(q => { const l = p.answers.filter(x => x.q === q && x.src === "atividade").pop(); return l && l.ok; }).length;
    markActivity(id, ok, a.qs.length); toastLater = `Atividade concluída: ${ok}/${a.qs.length} acertos.`;
  }
}
function activityAnswers(p) {
  const m = {};
  p.answers.filter(a => a.act).forEach(a => { (m[a.act] = m[a.act] || {})[a.q] = a.ok; });
  p.sims.filter(s => s.activity).forEach(s => { m[s.activity] = {}; s.items.forEach(it => m[s.activity][it.q] = it.ok); });
  return m;
}
function weeklyAcc(p) {
  const all = p.answers.filter(a => a.src !== "diag"), out = [];
  for (let i = 7; i >= 0; i--) { const ws = weekStart() - i * 7 * DAY, l = all.filter(a => a.t >= ws && a.t < ws + 7 * DAY); if (l.length) out.push({ label:new Date(ws).toLocaleDateString("pt-BR", { day:"2-digit", month:"2-digit" }), v:pct(l.filter(a => a.ok).length, l.length), n:l.length }); }
  return out;
}
function buildReport(userId) {
  const u = db.users[userId], p = prog(userId), all = p.answers.filter(a => a.src !== "diag");
  const byMat = {}; Object.entries(statsBy(p, "m")).forEach(([k, v]) => byMat[k] = { ok:v.ok, n:v.n });
  const byAss = {}; Object.keys(ASSUNTOS).concat(AULAS.map(a => a.id)).forEach(a => { const m = mastery(p, a); if (m.n) byAss[a] = m; });
  return { v:1, id:userId, name:u.name, grade:u.grade, t:now(), answered:all.length, ok:all.filter(a => a.ok).length,
    lastActive:all.length ? all[all.length - 1].t : null, byMat, byAss, weak:recommendations(p).slice(0, 6).map(r => r.assunto),
    sims:p.sims.slice(-5).map(s => ({ t:s.t, label:s.label, ok:s.ok, n:s.n })), acts:p.activitiesDone, actAns:activityAnswers(p),
    weekly:weeklyAcc(p), diag:p.diag ? { score:p.diag.score, byMat:p.diag.byMat } : null, essays:p.essays.length };
}

function buildPlano(p, cfg) {

  const peso = {}; mats.forEach(m => peso[m] = (ex.materias[m] / soma) * (FATOR_NIVEL[nivelDe(p, m) || 2] || 1));

  const poe = (w, m, t) => (semanas[w].topicos[m] = semanas[w].topicos[m] || []).push(t);

    L.forEach((t, k) => poe(Math.min(C - 1, Math.floor(k * C / L.length)), m, t));
    const R = W - C;   // depois do conteúdo novo: segunda volta, em revisão rápida
    for (let w = 0; w < R && L.length; w++) for (let k = Math.floor(w * L.length / R); k < Math.floor((w + 1) * L.length / R); k++) poe(C + w, m, Object.assign({}, L[k], { rapida:true }));

  const p = prog(); p.plano = buildPlano(p, { rotina, prova:d.prova || "" }); S.planoEdit = false; S.planoSemana = undefined;

};

/* ============================================================
   ÁREA DO PROFESSOR
   Painel com alertas · turmas em abas (alunos, mapa de dificuldades,
   atividades, mural) · ficha do aluno · atividades com escolha manual
   de questões e resultado por questão · redações com notas por critério
   ============================================================ */
const RUBRICA = ["Adequação ao tema", "Estrutura do texto", "Argumentação e repertório", "Coesão", "Norma-padrão"];
const classCode = () => { const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let c; do { c = Array.from(crypto.getRandomValues(new Uint8Array(6))).map(b => A[b % A.length]).join(""); } while (Object.values(db.classes).some(x => x.code === c)); return c; };
const myClasses = () => Object.values(db.classes).filter(c => c.teacherId === currentUser().id).sort((a, b) => a.name.localeCompare(b.name));
const dueTime = a => a.due ? new Date(a.due + "T23:59:59").getTime() : null;
const daysAgo = t => t ? Math.floor((now() - t) / DAY) : null;
const actTargets = (a, st) => st.filter(s => !a.targets || !a.targets.length || a.targets.includes(s.id));
const cellCls = v => v === null || v === undefined ? "" : v >= 70 ? "ok" : v >= 50 ? "warn" : "bad";

/* Alunos visíveis: do mesmo aparelho (autorizados) + relatórios importados de outros aparelhos */
function classStudents(c) {
  const list = [];
  (c.members || []).forEach(id => { const u = db.users[id]; if (!u) return; const p = prog(id); const ok = !!p.authorized[c.id]; list.push({ id, name:u.name, local:true, authorized:ok, report:ok ? buildReport(id) : null }); });
  (c.reports || []).forEach(r => { if (!list.some(x => x.id === r.id)) list.push({ id:r.id, name:r.name, local:false, authorized:true, report:r }); });
  return list.sort((a, b) => a.name.localeCompare(b.name));
}
function classDifficulties(c, st = classStudents(c)) {
  const agg = {};
  st.filter(s => s.report).forEach(s => Object.entries(s.report.byAss || {}).forEach(([a, m]) => { const g = agg[a] = agg[a] || { sum:0, n:0 }; g.sum += m.pct; g.n++; }));
  return Object.entries(agg).map(([a, g]) => ({ a, avg:Math.round(g.sum / g.n), n:g.n })).sort((x, y) => x.avg - y.avg);
}
function studentFlags(s, c) {
  const f = [], r = s.report; if (!r) return f;
  const d = daysAgo(r.lastActive);
  if (d === null) f.push({ lvl:"warn", txt:"ainda não estudou" });
  else if (d >= 7) f.push({ lvl:"warn", txt:`sem estudar há ${d} dias` });
  if (r.answered >= 10 && pct(r.ok, r.answered) < 50) f.push({ lvl:"bad", txt:`acertos baixos (${pct(r.ok, r.answered)}%)` });
  const late = (c.activities || []).filter(a => actTargets(a, [s]).length && dueTime(a) && dueTime(a) < now() && !(r.acts || {})[a.id]);
  if (late.length) f.push({ lvl:"bad", txt:`${late.length} atividade(s) atrasada(s)` });
  return f;
}
function teacherAlerts() {
  const u = currentUser(); if (!u || u.role !== "professor") return [];
  const out = [];
  myClasses().forEach(c => classStudents(c).forEach(s => studentFlags(s, c).forEach(f => out.push(Object.assign({ c, s }, f)))));
  return out;
}
function pendingEssays() {
  const u = currentUser(); if (!u || u.role !== "professor") return [];
  const cls = myClasses().map(c => c.id), list = [];
  Object.entries(db.progress).forEach(([sid, p]) => (p.essays || []).forEach(e => { if (e.sentTo && cls.includes(e.sentTo) && p.authorized && p.authorized[e.sentTo] && !(e.comments || []).length) list.push(e); }));
  return list;
}
function actStats(c, a, st = classStudents(c)) {
  const tg = actTargets(a, st), per = {};
  a.qs.forEach(q => per[q] = { ok:0, n:0 });
  const rows = tg.map(s => {
    const r = s.report, done = r && r.acts ? r.acts[a.id] : null, ans = r && r.actAns ? r.actAns[a.id] || {} : {};
    Object.entries(ans).forEach(([q, ok]) => { if (per[q]) { per[q].n++; if (ok) per[q].ok++; } });
    return { s, done, ans };
  });
  return { rows, per, tg, doneN:rows.filter(r => r.done).length };
}

function actFormDefaults() { return Object.assign({ classes:[], type:"questoes", title:"", due:"", instr:"", inst:"", ass:"", dif:"", n:5, minutes:30, aula:true, mode:"auto", picked:[] }, S.actForm || {}); }

  f.classes = $$("input[name=na_cls]").filter(i => i.checked).map(i => i.value);
  ["type", "title", "due", "instr", "inst", "ass", "dif", "mode"].forEach(k => { const v = g("na_" + k); if (v !== undefined) f[k] = v; });
  const n = g("na_n"); if (n !== undefined) f.n = Math.max(1, Math.min(30, +n || 5));

ACTIONS.actFormUpd = () => { captureActForm(); rerenderKeep(); };
ACTIONS.actPick = el => { const f = captureActForm(), id = el.dataset.q; f.picked = el.checked ? Array.from(new Set(f.picked.concat(id))) : f.picked.filter(x => x !== id); rerenderKeep(); };
ACTIONS.clearPicked = () => { const f = captureActForm(); f.picked = []; rerenderKeep(); };
ACTIONS.resetActForm = () => { S.actForm = null; render(); };
ACTIONS.previewQ = el => { modal(qCard(qById(el.dataset.q), { key:"prev:" + now() + ":" }), { cancel:false, okText:"Fechar" }); };
ACTIONS.newAct = () => {
  const f = captureActForm(), err = $("#naErr");
  if (!f.classes.length) { err.textContent = "Escolha pelo menos uma turma."; return; }
  if (!f.title.trim()) { err.textContent = "Dê um título à atividade."; return; }
  let ids;
  if (f.mode === "manual") { ids = f.picked.filter(qById); if (f.type === "simulado") ids = ids.filter(id => qById(id).tipo !== "discursiva"); if (!ids.length) { err.textContent = "Selecione pelo menos uma questão."; return; } }
  else { const pool = allQuestions().filter(q => (!f.inst || q.inst === f.inst) && (!f.ass || q.assunto === f.ass) && (!f.dif || String(q.dif) === f.dif) && (f.type !== "simulado" || q.tipo !== "discursiva")); if (!pool.length) { err.textContent = "Nenhuma questão com esses filtros."; return; } ids = shuffle(pool).slice(0, f.n).map(q => q.id); }
  const aulaId = f.aula ? (f.ass || (() => { const c = {}; ids.forEach(id => { const a = qById(id).assunto; c[a] = (c[a] || 0) + 1; }); return Object.entries(c).sort((a, b) => b[1] - a[1])[0][0]; })()) : "";
  f.classes.forEach(cid => { const c = db.classes[cid]; c.activities = c.activities || []; c.activities.push({ id:uid("a_"), type:f.type, title:f.title.trim().slice(0, 80), instr:f.instr.slice(0, 600), due:f.due, qs:ids, minutes:f.minutes, aula:aulaId, targets:[], t:now() }); });
  audit("Atividade criada: " + f.title); save();
  const first = f.classes[0]; S.actForm = null; S.turmaTab = "atividades";
  toastLater = `Atividade com ${ids.length} questão(ões) enviada para ${f.classes.length} turma(s).`; go("turma-" + first);
};
