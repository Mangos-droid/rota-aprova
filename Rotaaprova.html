<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rota Aprova</title>
<meta name="description" content="Plataforma gratuita de reforço escolar e preparação para concursos do Ensino Médio (8º e 9º ano).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
/* Rota Aprova — caderno de estudos: azul-marinho de farda + amarelo marca-texto.
   Layout: barra lateral de navegação + coluna de trabalho; no celular, menu recolhível. */
:root{
  --bg:#f3f5fa; --surface:#ffffff; --text:#13203d; --muted:#5b6782; --line:#dbe0eb;
  --brand:#1d48c9; --brand-ink:#ffffff; --accent:#f5b628; --accent-soft:#fff3cf;
  --ok:#14834f; --ok-soft:#e3f5ec; --bad:#c0392b; --bad-soft:#fbe8e6; --warn:#a86500; --warn-soft:#fff1dc;
  --font-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:12px; --shadow:0 1px 2px rgba(19,32,61,.06), 0 4px 16px rgba(19,32,61,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1426; --surface:#141f38; --text:#e7ecf7; --muted:#9ba7c2; --line:#26345a;
    --brand:#7c9dff; --brand-ink:#0c1426; --accent:#f5c04a; --accent-soft:#3a3016;
    --ok:#4fd197; --ok-soft:#123528; --bad:#ff8a7d; --bad-soft:#3d1c1a; --warn:#ffc069; --warn-soft:#3b2a12;
    --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1426; --surface:#141f38; --text:#e7ecf7; --muted:#9ba7c2; --line:#26345a;
  --brand:#7c9dff; --brand-ink:#0c1426; --accent:#f5c04a; --accent-soft:#3a3016;
  --ok:#4fd197; --ok-soft:#123528; --bad:#ff8a7d; --bad-soft:#3d1c1a; --warn:#ffc069; --warn-soft:#3b2a12;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:16.5px;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--font-display);line-height:1.2;text-wrap:balance;margin:0 0 .5em}
h1{font-size:1.85rem;letter-spacing:-.01em} h2{font-size:1.35rem} h3{font-size:1.1rem} h4{font-size:1rem}
p{margin:0 0 .8em} a{color:var(--brand)} small,.muted{color:var(--muted)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:800;font-size:1.25rem;color:var(--text);text-decoration:none;margin-bottom:18px}
.brand-mark{width:34px;height:34px;border-radius:9px;background:var(--brand);display:grid;place-items:center;color:var(--brand-ink);flex:none}
.brand-mark svg{width:20px;height:20px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .sec{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 10px 4px;font-weight:700}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--text);text-decoration:none;font-weight:600;font-size:.95rem}
.nav a:hover{background:var(--bg)}
.nav a.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.nav .badge{margin-left:auto}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:none;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.content{padding:28px clamp(16px,4vw,44px) 60px;max-width:1080px;width:100%}
.userbox{margin-top:18px;padding:12px;border:1px solid var(--line);border-radius:var(--r);font-size:.9rem}
.userbox strong{display:block}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 30% 0 0;max-width:300px;z-index:40;transform:translateX(-105%);transition:transform .2s;height:100%;box-shadow:var(--shadow)}
  .side.open{transform:none}
  .top{display:flex}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30}
  .content{padding-top:18px}
  h1{font-size:1.5rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- componentes ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card + .card{margin-top:14px}
.grid > .card + .card,.row > .card + .card{margin-top:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.btn{appearance:none;border:1px solid transparent;background:var(--brand);color:var(--brand-ink);font:inherit;font-weight:700;padding:9px 16px;border-radius:9px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;line-height:1.2}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:var(--surface);color:var(--text);border-color:var(--line)}
.btn.ghost{background:transparent;color:var(--brand);border-color:transparent;padding:6px 10px}
.btn.warn{background:var(--bad);color:#fff}
.btn.sm{padding:6px 11px;font-size:.88rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:700;background:var(--bg);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.inst{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--text);border-color:transparent}
.badge{background:var(--accent);color:#1b1b1b;border-radius:999px;font-size:.72rem;font-weight:800;padding:1px 8px}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--font-display);font-size:1.9rem;line-height:1}
.kpi span{color:var(--muted);font-size:.88rem}
.note{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 10px 10px 0;font-size:.95rem}
.note.info{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 9%,var(--surface))}
.note.okn{border-color:var(--ok);background:var(--ok-soft)}
.note.badn{border-color:var(--bad);background:var(--bad-soft)}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(20px,4vw,40px);box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero h1{font-size:clamp(1.7rem,4vw,2.5rem);max-width:20ch}
.hero .lead{font-size:1.08rem;max-width:58ch;color:var(--muted)}
.hero-stripe{position:absolute;right:-40px;top:-40px;width:220px;height:220px;border-radius:50%;background:var(--accent-soft)}
.hero > *:not(.hero-stripe){position:relative}
.list{list-style:none;margin:0;padding:0}
.list li{padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
table{border-collapse:collapse;width:100%;font-size:.93rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tbl{overflow-x:auto}
.bar{height:9px;border-radius:999px;background:var(--line);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--brand);border-radius:999px}
.bar.ok > i{background:var(--ok)} .bar.bad > i{background:var(--bad)} .bar.warn > i{background:var(--accent)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:7px 14px;border-radius:999px;font:inherit;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--text);color:var(--surface);border-color:var(--text)}
.pagehead{margin-bottom:20px}
.pagehead p{color:var(--muted);max-width:70ch}
.empty{text-align:center;padding:30px;color:var(--muted)}

/* ---------- formulários ---------- */
label{font-weight:700;font-size:.92rem;display:block;margin-bottom:4px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=url],select,textarea{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%}
textarea{min-height:110px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:.95rem}
.check input{margin-top:4px;width:18px;height:18px;flex:none}
.hint{font-size:.85rem;color:var(--muted)}
.err{color:var(--bad);font-weight:700;font-size:.92rem}
.auth{max-width:460px;margin:20px auto}
.filters{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}

/* ---------- questões ---------- */
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.q + .q{margin-top:14px}
.q-head{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.q-enun{font-size:1.03rem;margin-bottom:12px}
.stars{color:var(--accent);letter-spacing:1px;font-size:.9rem}
.alts{display:flex;flex-direction:column;gap:8px}
.alt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;appearance:none;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;color:var(--text);cursor:pointer}
.alt:hover:not([disabled]){border-color:var(--brand)}
.alt .L{font-weight:800;min-width:1.4em;font-family:var(--font-display)}
.alt.sel{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,var(--surface))}
.alt.right{border-color:var(--ok);background:var(--ok-soft)}
.alt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.alt[disabled]{cursor:default}
.res{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.res ol{margin:6px 0 0;padding-left:22px}
.res li{margin-bottom:4px}
.src{font-size:.85rem;color:var(--muted);margin-top:10px}
.fav{appearance:none;border:0;background:none;cursor:pointer;font-size:1.25rem;color:var(--muted);padding:2px 6px;margin-left:auto;line-height:1}
.fav.on{color:var(--accent)}
.reco{margin-top:12px}

/* ---------- simulado ---------- */
.timer{font-family:var(--font-display);font-size:1.6rem;font-weight:800}
.qgrid{display:flex;flex-wrap:wrap;gap:6px}
.qgrid button{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-weight:700;cursor:pointer}
.qgrid button.ans{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.qgrid button.cur{outline:3px solid var(--accent)}
.qgrid button.flag{box-shadow:inset 0 -4px 0 var(--accent)}
.sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0}
@media (max-width:900px){.sticky{top:52px}}

/* ---------- cronograma ---------- */
.week{display:grid;grid-template-columns:repeat(7,minmax(130px,1fr));gap:8px;overflow-x:auto}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:120px}
.day h4{font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px}
.blk{font-size:.84rem;border-radius:8px;padding:6px 8px;margin-bottom:6px;background:var(--bg);border-left:4px solid var(--brand);cursor:pointer}
.blk.done{opacity:.55;text-decoration:line-through}
.blk.rev{border-left-color:var(--accent)} .blk.sim{border-left-color:var(--bad)} .blk.red{border-left-color:var(--ok)}

/* ---------- flashcard / pomodoro ---------- */
.flash{min-height:170px;display:grid;place-items:center;text-align:center;font-size:1.2rem;font-family:var(--font-display);cursor:pointer;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:24px}
.flash.back{border-color:var(--accent);background:var(--accent-soft)}
.pomo{font-family:var(--font-display);font-size:3.6rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}

/* ---------- modal / toast / banner ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(8,14,30,.5);display:grid;place-items:center;z-index:100;padding:16px}
.modal{background:var(--surface);color:var(--text);border-radius:16px;padding:22px;max-width:560px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--surface);padding:10px 18px;border-radius:10px;z-index:120;font-weight:700;box-shadow:var(--shadow);max-width:90vw}
.banner{background:var(--warn-soft);color:var(--text);border-bottom:1px solid var(--line);padding:8px 16px;font-size:.9rem}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font-body)}
.chart .gridl{stroke:var(--line)}
.essay-out li{margin-bottom:6px}
pre.code{white-space:pre-wrap;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:.8rem;max-height:160px;overflow:auto}
.foot{color:var(--muted);font-size:.85rem;margin-top:40px;border-top:1px solid var(--line);padding-top:14px}
@media (max-width:820px){#aulaGrid,#essayGrid{grid-template-columns:1fr!important}}
fieldset.q{border:1px solid var(--line)}
fieldset.q legend{padding:0 6px}
label.alt{font-weight:400;margin:0}
label.alt input{margin-top:4px}
details summary{cursor:pointer;font-weight:700}

.heat th{white-space:nowrap}
.heat td.hc{text-align:center;font-weight:700;border:2px solid var(--surface)}
.heat td.hc.ok{background:var(--ok-soft);color:var(--ok)}
.heat td.hc.warn{background:var(--warn-soft);color:var(--warn)}
.heat td.hc.bad{background:var(--bad-soft);color:var(--bad)}

/* ---------- missão do dia (tela inicial com uma única ação) ---------- */
.mission{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:clamp(22px,5vw,44px);box-shadow:var(--shadow);max-width:720px;margin:0 auto;border-top:6px solid var(--accent)}
.mission.done{border-top-color:var(--ok)}
.mission h1{font-size:clamp(1.9rem,5vw,2.6rem);margin:.15em 0 .25em}
.mission-kicker{margin:0;color:var(--muted);font-weight:700}
.mission-sub{font-size:1.12rem;margin:0 0 12px}
.mission-steps{display:flex;gap:10px;flex-wrap:wrap}
.mission-steps span{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.95rem;background:var(--bg)}
.mission-steps span.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.mission .bar{height:12px}
.btn.big{font-size:1.1rem;padding:14px 26px;border-radius:12px}
.mini-links{max-width:720px;margin:16px auto 0;display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:.95rem;text-align:center}
.linkbtn{background:none;border:0;padding:0;color:var(--brand);font:inherit;text-decoration:underline;cursor:pointer}
.mission-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;max-width:880px}
.check.alvo{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);cursor:pointer}
.check.alvo:has(input:checked){border-color:var(--brand);background:color-mix(in srgb, var(--brand) 8%, var(--surface))}
.nav details.more{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.nav details.more summary{list-style:none;padding:8px 10px;border-radius:8px;color:var(--muted);font-size:.9rem;display:flex;align-items:center;gap:8px}
.nav details.more summary::-webkit-details-marker{display:none}
.nav details.more summary::before{content:"▸";transition:transform .15s}
.nav details.more[open] summary::before{transform:rotate(90deg)}
.nav details.more summary:hover{background:var(--bg)}
.card.fmt p{margin:6px 0 10px}
.cloud-badge{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:var(--muted)}
.cloud-badge i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.cloud-badge.off i{background:var(--warn)}

/* ---------- avaliação inicial, cronograma, listas, senha ---------- */
.alt.picked{border-color:var(--brand);background:color-mix(in srgb, var(--brand) 12%, var(--surface))}
.lvl{display:flex;gap:4px;margin:10px 0 2px}
.lvl i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.lvl i.on{background:var(--brand)}
.rotina{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.rot-dia{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--bg)}
.rot-dia select{width:100%}
.day.off{opacity:.55}
.day h4 .hint{font-weight:400}
tr.hl td{background:color-mix(in srgb, var(--accent) 14%, var(--surface))}
.btn.addl{padding:4px 10px;font-size:.82rem}
.btn.addl.on{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.listbar{padding:12px 16px}
.pwwrap{position:relative;display:flex;align-items:center}
.pwwrap input{flex:1;padding-right:84px}
.pwbtn{position:absolute;right:6px;border:0;background:var(--bg);color:var(--brand);font:inherit;font-size:.85rem;font-weight:700;padding:6px 10px;border-radius:8px;cursor:pointer}
.pwbtn:focus-visible{outline:2px solid var(--brand)}
details.card > summary{cursor:pointer}
.day h4 .hint{display:block;text-transform:none;letter-spacing:0;font-size:.78rem;margin-top:2px}
@media (max-width:700px){
  .week{grid-template-columns:1fr;overflow-x:visible}
  .day{min-height:0}
  .day.off{padding:8px 10px}
  .day.off h4{margin-bottom:2px}
}

</style>
</head>
<body>
<div id="root"><p style="padding:24px;font-family:system-ui">Carregando a Trilha Aprova…</p></div>
<noscript><p style="padding:24px">Ative o JavaScript para usar a plataforma.</p></noscript>
<script>
/* ============================================================
   NÚCLEO: armazenamento local, segurança, sessão, rotas, UI
   ============================================================ */
"use strict";
const APP_NAME = "Rota Aprova";
const STORE_KEY = "rota-aprova-v1";
const SESSION_KEY = "rota-aprova-sessao";
const SESSION_MIN = 30;           // logout automático após 30 min sem uso
const PBKDF2_ITER = 150000;

/* ---------- utilitários ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const nl2br = s => esc(s).replace(/\n/g, "<br>");
const now = () => Date.now();
const DAY = 86400000;
const uid = (p = "") => p + Array.from(crypto.getRandomValues(new Uint8Array(8))).map(b => b.toString(36).padStart(2, "0")).join("").slice(0, 12);
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const fmtDate = t => new Date(t).toLocaleDateString("pt-BR");
const fmtDateTime = t => new Date(t).toLocaleString("pt-BR", { dateStyle:"short", timeStyle:"short" });
const shuffle = a => { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };
const stars = n => "★".repeat(n) + "☆".repeat(5 - n);
const todayKey = (t = now()) => { const d = new Date(t); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const startOfDay = (t = now()) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const weekStart = (t = now()) => { const d = new Date(startOfDay(t)); const wd = (d.getDay() + 6) % 7; return d.getTime() - wd * DAY; };
const b64e = u8 => btoa(String.fromCharCode(...u8));
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const encodeCode = (prefix, obj) => prefix + ":" + btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
function decodeCode(prefix, txt) {
  const t = String(txt || "").trim();
  if (!t.startsWith(prefix + ":")) throw new Error("Código inválido: confira se colou o código inteiro.");
  return JSON.parse(decodeURIComponent(escape(atob(t.slice(prefix.length + 1)))));
}

/* ---------- senhas: PBKDF2-SHA256 com sal aleatório ---------- */
async function hashPassword(pw, saltB64) {
  if (!(window.crypto && crypto.subtle)) throw new Error("Este navegador não oferece criptografia segura. Atualize o navegador.");
  const salt = saltB64 ? b64d(saltB64) : crypto.getRandomValues(new Uint8Array(16));
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name:"PBKDF2", salt, iterations:PBKDF2_ITER, hash:"SHA-256" }, key, 256);
  return { salt:b64e(salt), hash:b64e(new Uint8Array(bits)) };
}
function passwordProblems(pw) {
  const p = [];
  if (pw.length < 8) p.push("ter pelo menos 8 caracteres");
  if (!/[A-Za-z]/.test(pw) || !/[0-9]/.test(pw)) p.push("misturar letras e números");
  return p;
}

/* ---------- sessão ---------- */
let memSession = null;
function getSession() {
  let s = memSession;
  try { const raw = sessionStorage.getItem(SESSION_KEY); if (raw) s = JSON.parse(raw); } catch (e) {}
  if (!s) return null;
  if (now() - s.last > SESSION_MIN * 60000) { clearSession(); toastLater = "Sua sessão expirou por inatividade. Entre de novo."; return null; }
  return s;
}
function setSession(userId) {
  memSession = { userId, last:now() };
  try { sessionStorage.setItem(SESSION_KEY, JSON.stringify(memSession)); } catch (e) {}
}
function touchSession() { const s = getSession(); if (s) setSession(s.userId); }
function clearSession() { memSession = null; try { sessionStorage.removeItem(SESSION_KEY); } catch (e) {} }
function currentUser() { const s = getSession(); return s && db.users[s.userId] ? db.users[s.userId] : null; }
let toastLater = null;

const loginAttempts = {};
async function login(username, pw) {
  const uname = username.trim().toLowerCase();
  const a = loginAttempts[uname] || { n:0, until:0 };
  if (a.until > now()) throw new Error("Muitas tentativas. Aguarde " + Math.ceil((a.until - now()) / 1000) + " segundos.");
  const u = Object.values(db.users).find(x => x.username === uname);
  const fail = () => { a.n++; if (a.n >= 5) { a.until = now() + 60000; a.n = 0; } loginAttempts[uname] = a; throw new Error("Usuário ou senha incorretos."); };
  if (!u) { await hashPassword(pw); fail(); }
  const h = await hashPassword(pw, u.salt);
  if (h.hash !== u.hash) fail();
  if (u.status === "pendente") throw new Error("Sua conta de professor aguarda aprovação do administrador.");
  if (u.status === "bloqueado") throw new Error("Esta conta está bloqueada. Fale com o administrador.");
  delete loginAttempts[uname];
  if (typeof resetUI === "function") resetUI();
  setSession(u.id);
  u.lastLogin = now(); save();
  return u;
}
function logout() { clearSession(); if (typeof resetUI === "function") resetUI(); go("inicio"); }

/* Registra uma resposta e atualiza revisão espaçada */
const INTERVALS = [1, 3, 7, 15, 30];
function recordAnswer(rec) {
  const p = prog(); if (!p) return;
  p.answers.push(Object.assign({ t:now() }, rec));
  if (rec.src !== "diag" && rec.q && !String(rec.q).startsWith("fx:")) {
    const r = p.review[rec.q] || { step:-1 };
    if (!rec.ok) { r.step = 0; r.due = startOfDay() + INTERVALS[0] * DAY; r.lastWrong = now(); }
    else if (r.step >= 0) { r.step = Math.min(r.step + 1, INTERVALS.length); r.due = r.step >= INTERVALS.length ? null : startOfDay() + INTERVALS[r.step] * DAY; }
    if (r.step >= 0) p.review[rec.q] = r;
  }
  save();
}
function reviewDue(p) {
  return Object.entries(p.review).filter(([id, r]) => r.due && r.due <= now() && qById(id)).map(([id]) => id);
}
function errorNotebook(p) {
  const last = {};
  p.answers.forEach(a => { if (a.q && !String(a.q).startsWith("fx:") && a.src !== "diag") last[a.q] = a; });
  const everWrong = new Set(p.answers.filter(a => !a.ok && a.q && !String(a.q).startsWith("fx:") && a.src !== "diag").map(a => a.q));
  return Array.from(everWrong).filter(id => qById(id)).map(id => ({ id, lastOk:last[id] && last[id].ok, r:p.review[id] }));
}
/* Domínio por assunto: acertos nas últimas 10 respostas daquele assunto */
function mastery(p, assunto) {
  const list = p.answers.filter(a => a.a === assunto).slice(-10);
  return list.length ? { n:list.length, pct:pct(list.filter(a => a.ok).length, list.length) } : { n:0, pct:null };
}
function statsBy(p, key) {
  const m = {};
  p.answers.filter(a => a.src !== "diag").forEach(a => { const k = a[key] || "—"; m[k] = m[k] || { ok:0, n:0 }; m[k].n++; if (a.ok) m[k].ok++; });
  return m;
}
/* Integração inteligente: assuntos fracos a partir de erros em concurso + diagnóstico */
function recommendations(p) {
  const rec = {};
  p.answers.forEach(a => {
    if (!a.a) return;
    const r = rec[a.a] = rec[a.a] || { assunto:a.a, wrongConc:0, total:0, ok:0 };
    r.total++; if (a.ok) r.ok++;
    if (!a.ok && (a.src === "banco" || a.src === "simulado" || a.src === "atividade" || a.src === "revisao" || a.src === "missao" || a.src === "lista")) r.wrongConc++;
  });
  if (p.diag) p.diag.weak.forEach(w => { rec[w] = rec[w] || { assunto:w, wrongConc:0, total:0, ok:0 }; rec[w].diag = true; });
  return Object.values(rec).map(r => Object.assign(r, { m:mastery(p, r.assunto) }))
    .filter(r => (r.wrongConc >= 1 || r.diag) && (r.m.pct === null || r.m.pct < 70) && aulaById(r.assunto))
    .sort((x, y) => (y.wrongConc - x.wrongConc) || ((x.m.pct ?? 0) - (y.m.pct ?? 0)));
}

/* ---------- UI: toast, modal, cópia ---------- */
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
}
function modal(html, opts = {}) {
  return new Promise(resolve => {
    const bg = document.createElement("div"); bg.className = "modal-bg";
    bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}<div class="row" style="justify-content:flex-end;margin-top:16px">
      ${opts.cancel !== false ? `<button class="btn sec" data-r="0">${esc(opts.cancelText || "Cancelar")}</button>` : ""}
      <button class="btn ${opts.danger ? "warn" : ""}" data-r="1">${esc(opts.okText || "OK")}</button></div></div>`;
    document.body.appendChild(bg);
    const close = v => { const data = {}; $$("input,textarea,select", bg).forEach(i => data[i.id || i.name] = i.type === "checkbox" ? i.checked : i.value); bg.remove(); resolve(v ? (opts.form ? data : true) : false); };
    bg.addEventListener("click", e => { const b = e.target.closest("[data-r]"); if (b) close(b.dataset.r === "1"); else if (e.target === bg) close(false); });
    const f = $("input,textarea,button", bg); if (f) f.focus();
  });
}
const confirmBox = (msg, ok = "Confirmar", danger = false) => modal(`<p>${msg}</p>`, { okText:ok, danger });
async function copyText(txt) {
  try { await navigator.clipboard.writeText(txt); toast("Copiado!"); }
  catch (e) { modal(`<h3>Copie o código abaixo</h3><p class="hint">Seu navegador não permitiu copiar automaticamente. Selecione o texto e copie.</p><textarea style="min-height:160px" readonly>${esc(txt)}</textarea>`, { cancel:false }); }
}

/* ---------- gráficos SVG simples ---------- */
function barChart(items, { max = 100, suffix = "%", h = 22 } = {}) {
  if (!items.length) return `<p class="empty">Sem dados ainda.</p>`;
  const W = 560, lw = 170, H = items.length * (h + 10) + 10;
  const rows = items.map((it, i) => {
    const y = 8 + i * (h + 10), w = Math.max(2, (W - lw - 50) * (it.v / max));
    const color = it.color || (it.v >= 70 ? "var(--ok)" : it.v >= 50 ? "var(--accent)" : "var(--bad)");
    return `<text x="0" y="${y + h * .7}">${esc(it.label.length > 26 ? it.label.slice(0, 25) + "…" : it.label)}</text>
      <rect x="${lw}" y="${y}" width="${W - lw - 50}" height="${h}" rx="5" fill="var(--bg)"></rect>
      <rect x="${lw}" y="${y}" width="${w}" height="${h}" rx="5" fill="${color}"></rect>
      <text x="${lw + w + 6}" y="${y + h * .7}" style="fill:var(--text);font-weight:700">${it.v}${suffix}${it.n != null ? " · " + it.n : ""}</text>`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gráfico de barras">${rows}</svg>`;
}
function lineChart(points, { max = 100, suffix = "%" } = {}) {
  if (points.length < 2) return `<p class="empty">Responda questões em pelo menos duas semanas diferentes para ver a evolução.</p>`;
  const W = 560, H = 200, pl = 34, pr = 14, pt = 12, pb = 28;
  const xs = i => pl + (W - pl - pr) * (i / (points.length - 1));
  const ys = v => pt + (H - pt - pb) * (1 - v / max);
  const grid = [0, 25, 50, 75, 100].map(v => `<line class="gridl" x1="${pl}" x2="${W - pr}" y1="${ys(v)}" y2="${ys(v)}"></line><text x="0" y="${ys(v) + 4}">${v}${suffix}</text>`).join("");
  const d = points.map((p, i) => (i ? "L" : "M") + xs(i).toFixed(1) + " " + ys(p.v).toFixed(1)).join(" ");
  const area = d + ` L${xs(points.length - 1)} ${ys(0)} L${xs(0)} ${ys(0)} Z`;
  const labels = points.map((p, i) => (points.length <= 8 || i % Math.ceil(points.length / 8) === 0) ? `<text x="${xs(i) - 14}" y="${H - 8}">${esc(p.label)}</text>` : "").join("");
  const last = points[points.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gráfico de evolução">${grid}
    <path d="${area}" fill="color-mix(in srgb, var(--brand) 14%, transparent)"></path>
    <path d="${d}" fill="none" stroke="var(--brand)" stroke-width="2.5"></path>
    <circle cx="${xs(points.length - 1)}" cy="${ys(last.v)}" r="5" fill="var(--accent)" stroke="var(--brand)" stroke-width="2"></circle>
    <text x="${xs(points.length - 1) - 26}" y="${ys(last.v) - 10}" style="fill:var(--text);font-weight:700">${last.v}${suffix}</text>${labels}</svg>`;
}

let afterRender = [];
function onMount(fn) { afterRender.push(fn); }
let cleanup = [];
function onLeave(fn) { cleanup.push(fn); }

function render() {
  cleanup.forEach(f => { try { f(); } catch (e) {} }); cleanup = [];
  afterRender = [];
  const full = (location.hash || "#").slice(1);
  let name = full || "", param = "";
  if (!ROUTES[name]) {
    const pre = Object.keys(ROUTES).filter(r => ROUTES[r].param && full.startsWith(r + "-")).sort((a, b) => b.length - a.length)[0];
    if (pre) { name = pre; param = full.slice(pre.length + 1); }
  }
  const u = currentUser();
  if (!name || !ROUTES[name]) name = u ? (u.role === "aluno" ? "painel" : u.role === "professor" ? "professor" : "admin") : "inicio";
  const r = ROUTES[name];
  if (r.auth && !u) { name = "entrar"; }
  else if (r.roles && u && !r.roles.includes(u.role)) { name = u.role === "aluno" ? "painel" : u.role === "professor" ? "professor" : "admin"; }
  let html;
  try { html = ROUTES[name].view(param); } catch (e) { console.error(e); html = `<div class="note badn"><b>Algo deu errado ao abrir esta página.</b> ${esc(e.message)}</div>`; }
  document.getElementById("root").innerHTML = shell(html, name);
  const bl = $("#btnLogout"); if (bl) bl.onclick = logout;
  const bm = $("#btnMenu"); if (bm) bm.onclick = () => { navOpen = true; render(); };
  const sc = $("#scrim"); if (sc) sc.onclick = () => { navOpen = false; render(); };
  afterRender.forEach(f => { try { f(); } catch (e) { console.error(e); } });
  if (toastLater) { toast(toastLater); toastLater = null; }
  if (typeof enhancePasswords === "function") enhancePasswords();
}
window.addEventListener("hashchange", () => { navOpen = false; render(); window.scrollTo(0, 0); });

/* Delegação de eventos: data-act="nome" chama ACTIONS[nome](el, event) */
const ACTIONS = {};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const fn = ACTIONS[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener("submit", e => {
  const f = e.target; if (!f.dataset.form) return;
  e.preventDefault(); const fn = ACTIONS[f.dataset.form]; if (fn) fn(f, e);
});
document.addEventListener("change", e => {
  const el = e.target.closest("[data-change]"); if (!el) return;

  alts:{A:"814",B:"823",C:"851",D:"857"}, gab:"B", gabTipo:"verificado",
  res:["18h27 − 04h44: de 04h44 até 18h44 são 14 h; volte 17 min: 13 h 43 min.","13 × 60 + 43 = 780 + 43 = 823 minutos (alternativa B)."] },
{ id:"ifrj23-22", inst:"IFRJ", ano:2022, fonte:"ifrj23", num:22, materia:"Matemática", assunto:"conjuntos", dif:3,
  enun:"Quatro times (Araçaí, Bertuga, Colegol e Daleticano) ficaram nos 4 primeiros lugares, cada um com um mascote diferente (águia, cachorro, onça, tubarão). Pistas: o Daleticano é rival do time colocado logo abaixo dele, que tem um cachorro; o Araçaí não ficou em 4º e ficou logo abaixo do Colegol, que tem uma onça e não ficou em 2º; o 3º colocado tem um tubarão. Qual time tem a águia?",
  alts:{A:"Araçaí",B:"Bertuga",C:"Colegol",D:"Daleticano"}, gab:"A", gabTipo:"verificado",
  res:["Colegol tem onça e o 3º tem tubarão, então Colegol não é 3º. Também não é 2º (pista).","Se Colegol fosse 4º, o Araçaí não teria lugar logo abaixo. Logo Colegol é 1º e Araçaí é 2º.","Sobram 3º e 4º para Bertuga e Daleticano. O Daleticano tem um time logo abaixo dele, então é o 3º (tubarão) e Bertuga é o 4º (cachorro).","Sobra a águia para o Araçaí (alternativa A)."] },
{ id:"ifrj23-25", inst:"IFRJ", ano:2022, fonte:"ifrj23", num:25, materia:"Matemática", assunto:"geometria", dif:1,
  enun:"Uma pista circular tem 240 m de diâmetro. Usando π = 3,14, quantos metros uma pessoa percorre em uma volta completa?",

  res:["Comprimento da circunferência: C = π · d (ou 2πr).","C = 3,14 × 240 = 753,6 m (alternativa C)."] },
{ id:"ifrj23-26", inst:"IFRJ", ano:2022, fonte:"ifrj23", num:26, materia:"Matemática", assunto:"eq1", dif:2,
  enun:"Um grupo comprou 3 hambúrgueres Doha e 4 Lusail por R$ 85,00. No dia seguinte, comprou 4 Doha e 3 Lusail por R$ 83,00. Quanto custam, juntos, um Doha e um Lusail?",
  alts:{A:"R$ 18,00",B:"R$ 20,00",C:"R$ 24,00",D:"R$ 25,00"}, gab:"C", gabTipo:"verificado",
  res:["Some as duas compras: 7 Doha + 7 Lusail = 85 + 83 = 168.","Divida por 7: 1 Doha + 1 Lusail = R$ 24,00 (alternativa C).","Dica: nem sempre é preciso achar cada preço separadamente."] },
{ id:"ifrj23-27", inst:"IFRJ", ano:2022, fonte:"ifrj23", num:27, materia:"Matemática", assunto:"conjuntos", dif:2,
  enun:"Numa pesquisa com 138 pessoas, 90 torcem por um time brasileiro, 45 por um time estrangeiro e 33 não torcem por nenhum. Quantas torcem pelos dois?",
  alts:{A:"35",B:"30",C:"20",D:"15"}, gab:"B", gabTipo:"verificado",
  res:["Quem torce por pelo menos um: 138 − 33 = 105.","n(A ∪ B) = n(A) + n(B) − n(A ∩ B) ⇒ 105 = 90 + 45 − x.","x = 30 (alternativa B)."] },
{ id:"ifrj23-28", inst:"IFRJ", ano:2022, fonte:"ifrj23", num:28, materia:"Matemática", assunto:"proporcionalidade", dif:2,
  enun:"Um pacote de 500 g de biscoitos custava R$ 3,50. Ele foi reduzido para 350 g e passou a custar R$ 3,00. Se o preço tivesse sido reduzido na mesma proporção do peso, quanto deveria custar o pacote de 350 g?",
  alts:{A:"R$ 2,00",B:"R$ 2,45",C:"R$ 2,80",D:"R$ 3,15"}, gab:"B", gabTipo:"verificado",
  res:["Peso e preço diretamente proporcionais: 500 g → R$ 3,50; 350 g → x.","x = 3,50 × 350 ÷ 500 = 3,50 × 0,7 = R$ 2,45 (alternativa B)."] },

{ id:"faetec20-27", inst:"FAETEC", ano:2019, fonte:"faetec20", num:27, materia:"Matemática", assunto:"geometria", dif:3,
  enun:"O lado de um quadrado é 2 cm maior que o lado de um triângulo equilátero. A soma dos perímetros das duas figuras é 92 cm. Qual é a área do quadrado, em cm²?",
  alts:{A:"196",B:"169",C:"144",D:"121"}, gab:"A", gabTipo:"verificado",
  res:["Lado do quadrado = q; lado do triângulo = q − 2.","Perímetros: 4q + 3(q − 2) = 92 ⇒ 7q − 6 = 92 ⇒ q = 14.","Área do quadrado: 14² = 196 cm² (alternativa A)."] },
{ id:"faetec20-30", inst:"FAETEC", ano:2019, fonte:"faetec20", num:30, materia:"Matemática", assunto:"eq2", dif:3,
  enun:"Um prédio tem (x + 2) andares com 6 salas em cada um, e o total de salas é (x² − 60). Qual é a soma dos algarismos de x?",
  alts:{A:"3",B:"4",C:"5",D:"6"}, gab:"A", gabTipo:"verificado",
  res:["Total de salas: 6(x + 2) = x² − 60.","x² − 6x − 72 = 0 ⇒ Δ = 36 + 288 = 324 ⇒ √Δ = 18.","x = (6 + 18) ÷ 2 = 12 (a raiz negativa não serve).","Soma dos algarismos de 12: 1 + 2 = 3 (alternativa A)."] },
{ id:"faetec20-32", inst:"FAETEC", ano:2019, fonte:"faetec20", num:32, materia:"Matemática", assunto:"problemas", dif:1,

  res:["Cada pessoa compra 2 trechos (ida e volta): 2 × 632 = R$ 1 264.","3 pessoas: 3 × 1 264 = R$ 3 792,00 (alternativa B)."] },

{ id:"faetec20-37", inst:"FAETEC", ano:2019, fonte:"faetec20", num:37, materia:"Matemática", assunto:"geometria", dif:2,
  enun:"Calcule o volume de um cilindro pela fórmula V = π · R² · h, com π = 3,14, R = 5 cm e h = 4,8 cm.",

{ id:"faetec20-40", inst:"FAETEC", ano:2019, fonte:"faetec20", num:40, materia:"Matemática", assunto:"geometria", dif:2,
  enun:"As diagonais de um quadrado o dividem em quatro triângulos congruentes. Como cada triângulo se classifica quanto aos ângulos e quanto aos lados?",
  alts:{A:"acutângulo e escaleno",B:"retângulo e isósceles",C:"retângulo e escaleno",D:"acutângulo e isósceles"}, gab:"B", gabTipo:"verificado",

{ id:"cefet25-07", inst:"CEFET", ano:2025, fonte:"cefet25", num:7, materia:"Matemática", assunto:"conjuntos", dif:2,

{ id:"cefet25-08", inst:"CEFET", ano:2025, fonte:"cefet25", num:8, materia:"Matemática", assunto:"eq1", dif:2,
  enun:"A Tartaruga está 21 m à frente do Coelho. Ela corre a 5 m/s e ele a 8 m/s, ambos constantes. Em quanto tempo o Coelho alcança a Tartaruga e quantos metros ela terá percorrido até lá?",

  res:["O Coelho se aproxima 8 − 5 = 3 m a cada segundo (velocidade relativa).","Tempo: 21 ÷ 3 = 7 s.","A Tartaruga anda 5 × 7 = 35 m (alternativa A)."] },
{ id:"cefet25-09", inst:"CEFET", ano:2025, fonte:"cefet25", num:9, materia:"Matemática", assunto:"eq1", dif:2,
  enun:"Arival comprou lápis, esquadros e compassos por R$ 84,00. O gasto com compassos foi o triplo do gasto com esquadros, e o gasto com esquadros foi o quíntuplo do gasto com lápis. Quanto ele gastou com esquadros?",

  res:["Lápis = p; esquadros = 5p; compassos = 3 · 5p = 15p.","p + 5p + 15p = 21p = 84 ⇒ p = 4.","Esquadros: 5 × 4 = R$ 20,00 (alternativa C)."] },
{ id:"cefet25-16", inst:"CEFET", ano:2025, fonte:"cefet25", num:16, materia:"Matemática", assunto:"potencias", dif:3,
  enun:"Sabendo que x − z = 8 e x + 2y = 7, qual é o valor numérico de x² − xz + 2xy − 2yz?",
  alts:{A:"56",B:"65",C:"67",D:"78"}, gab:"A", gabTipo:"verificado",
  res:["Agrupe os termos: x² − xz + 2xy − 2yz = x(x − z) + 2y(x − z).","Coloque (x − z) em evidência: (x − z)(x + 2y).","8 × 7 = 56 (alternativa A)."] },
{ id:"cefet25-17", inst:"CEFET", ano:2025, fonte:"cefet25", num:17, materia:"Matemática", assunto:"proporcionalidade", dif:1,
  enun:"Um artefato leva 60 horas para ser montado por 4 engenheiros. O tempo é inversamente proporcional ao número de engenheiros. Quanto tempo levarão 5 engenheiros?",

  res:["Inversamente proporcional: o produto engenheiros × horas é constante.","4 × 60 = 240 = 5 × t ⇒ t = 48 horas (alternativa B)."] },
{ id:"cefet25-19", inst:"CEFET", ano:2025, fonte:"cefet25", num:19, materia:"Matemática", assunto:"juros", dif:2,
  enun:"Um investimento de R$ 540,00 rende juros simples em três períodos consecutivos, com taxas de 1%, 3% e 2%. Qual é o valor final?",
  alts:{A:"R$ 550,80",B:"R$ 572,40",C:"R$ 582,60",D:"R$ 584,80"}, gab:"B", gabTipo:"verificado",
  res:["Em juros simples as taxas incidem sempre sobre o capital inicial: 1% + 3% + 2% = 6%.","Juros: 6% de 540 = R$ 32,40.","Montante: 540 + 32,40 = R$ 572,40 (alternativa B)."] },

{ id:"cefet06-02", inst:"CEFET", ano:2005, fonte:"cefet06", num:2, materia:"Matemática", assunto:"eq1", dif:2, tipo:"discursiva",
  enun:"Ao colocar 6 fotos por página de um álbum, sobram 15 fotos. Colocando 7 fotos por página, faltam 2 fotos para completar a última página. Quantas são as fotos e quantas são as páginas?",
  resposta:"17 páginas e 117 fotos.", gabTipo:"verificado",
  res:["Seja p o número de páginas. Com 6 por página sobram 15: fotos = 6p + 15.","Com 7 por página faltam 2: fotos = 7p − 2.","6p + 15 = 7p − 2 ⇒ p = 17.","Fotos: 6 × 17 + 15 = 117."] },
{ id:"cefet06-04", inst:"CEFET", ano:2005, fonte:"cefet06", num:4, materia:"Matemática", assunto:"juros", dif:3, tipo:"discursiva",
  enun:"Um vestido foi pago em duas parcelas iguais de R$ 100,00: uma no ato da compra e outra 30 dias depois. Sabendo que a loja cobra juros de 5% ao mês, qual é o preço do vestido à vista?",
  resposta:"Aproximadamente R$ 195,24.", gabTipo:"verificado",
  res:["A parcela de hoje vale R$ 100,00.","A parcela de daqui a 30 dias já inclui 5% de juros. Trazendo ao valor de hoje: 100 ÷ 1,05 ≈ R$ 95,24.","Preço à vista: 100 + 95,24 ≈ R$ 195,24."] },
{ id:"cefet06-07", inst:"CEFET", ano:2005, fonte:"cefet06", num:7, materia:"Matemática", assunto:"geometria", dif:4, tipo:"discursiva",
  enun:"Quando os raios solares formam 60° com o horizonte, a sombra de uma árvore mede x. Quando o ângulo passa a 30°, a sombra aumenta 10 m. Qual é a altura da árvore?",
  resposta:"5√3 m (cerca de 8,66 m).", gabTipo:"verificado",
  res:["Altura h, sombra x: tg 60° = h/x ⇒ h = x√3.","Com 30°: tg 30° = h/(x + 10) ⇒ h = (x + 10)/√3.","x√3 = (x + 10)/√3 ⇒ 3x = x + 10 ⇒ x = 5 m.","h = 5√3 ≈ 8,66 m."] },

/* ---------------- Colégio Naval 2011/2012 ---------------- */
{ id:"cn11-01", inst:"CN", ano:2011, fonte:"cn11", num:1, materia:"Matemática", assunto:"divis", dif:4,
  enun:"O número 5²⁰¹¹ + 2 · 11²⁰¹¹ é múltiplo de qual dos números abaixo?",
  alts:{A:"13",B:"11",C:"7",D:"5",E:"3"}, gab:"E", gabTipo:"verificado", gabNota:"Coincide com a correção publicada pelo curso indicado na fonte; gabarito oficial da banca não localizado online.",
  res:["Trabalhe com restos na divisão por 3: 5 deixa resto 2 e 11 também deixa resto 2.","Então 5²⁰¹¹ + 2·11²⁰¹¹ tem o mesmo resto que 2²⁰¹¹ + 2·2²⁰¹¹ = 3 · 2²⁰¹¹.","3 · 2²⁰¹¹ é múltiplo de 3. Resposta: 3 (alternativa E)."] },
{ id:"cn11-11", inst:"CN", ano:2011, fonte:"cn11", num:11, materia:"Matemática", assunto:"potencias", dif:3,
  enun:"Para números reais a, b e c, analise: I) se a · b · c > 0, então a² + b² + c² ≠ 0; II) se |a| < b, com b > 0, então −b < a < b; III) se b > c, então b² > c². Qual opção é correta?",
  alts:{A:"Apenas I é verdadeira.",B:"Apenas II é verdadeira.",C:"Apenas III é verdadeira.",D:"Apenas I e II são verdadeiras.",E:"Apenas I e III são verdadeiras."}, gab:"D", gabTipo:"verificado", gabNota:"Coincide com a correção publicada pelo curso indicado na fonte; gabarito oficial da banca não localizado online.",
  res:["I: se abc > 0, nenhum dos três é zero, então a soma dos quadrados é positiva. Verdadeira.","II: |a| < b é exatamente −b < a < b. Verdadeira.","III: contraexemplo b = 1 e c = −2: 1 > −2, mas 1 < 4. Falsa.","Apenas I e II (alternativa D)."] },
{ id:"cn11-14", inst:"CN", ano:2011, fonte:"cn11", num:14, materia:"Matemática", assunto:"divis", dif:5,
  enun:"Um inteiro positivo N, dividido por 5, dá quociente q₁ e resto 1. Dividindo 4q₁ por 5, obtém-se quociente q₂ e resto 1; dividindo 4q₂ por 5, quociente q₃ e resto 1; dividindo 4q₃ por 5, quociente q₄ e resto 1. Sabendo que 621 < N < 1 871, qual é a soma dos algarismos de N?",
  alts:{A:"18",B:"16",C:"15",D:"13",E:"12"}, gab:"D", gabTipo:"verificado", gabNota:"Coincide com a correção publicada pelo curso indicado na fonte; gabarito oficial da banca não localizado online.",
  res:["Volte de trás para frente: 4q₃ = 5q₄ + 1, 4q₂ = 5q₃ + 1, 4q₁ = 5q₂ + 1 e N = 5q₁ + 1.","Para que cada divisão seja exata no formato pedido, os valores precisam ser inteiros; testando q₄ e respeitando 621 < N < 1 871, chega-se a N = 1 246.","Conferência: 1 246 = 5·249 + 1; 4·249 = 996 = 5·199 + 1; 4·199 = 796 = 5·159 + 1; 4·159 = 636 = 5·127 + 1. ✓","Soma dos algarismos: 1 + 2 + 4 + 6 = 13 (alternativa D)."] },
{ id:"cn11-15", inst:"CN", ano:2011, fonte:"cn11", num:15, materia:"Matemática", assunto:"potencias", dif:4,
  enun:"Assinale o único número abaixo que NÃO é inteiro.",
  alts:{A:"raiz sexta de 1 771 561",B:"raiz quarta de 28 561",C:"raiz sexta de 4 826 807",D:"raiz quarta de 331 776",E:"raiz sexta de 148 035 889"}, gab:"C", gabTipo:"verificado", gabNota:"Coincide com a correção publicada pelo curso indicado na fonte; gabarito oficial da banca não localizado online.",
  res:["Teste potências próximas: 11⁶ = 1 771 561 (A é inteiro); 13⁴ = 28 561 (B); 24⁴ = 331 776 (D); 23⁶ = 148 035 889 (E).","13⁶ = 4 826 809, que é diferente de 4 826 807. Logo a raiz sexta de 4 826 807 não é inteira (alternativa C).","Dica: o último algarismo ajuda a descobrir a base (…1 → base termina em 1 ou 9; …9 → 3 ou 7)."] },
{ id:"cn11-18", inst:"CN", ano:2011, fonte:"cn11", num:18, materia:"Matemática", assunto:"geometria", dif:4,
  enun:"Dois polígonos convexos têm N e n lados (N ≠ n) e D e d diagonais, respectivamente, com N − n = D − d. Quantas soluções satisfazem essas condições?",
  alts:{A:"0",B:"1",C:"2",D:"3",E:"indeterminada"}, gab:"A", gabTipo:"verificado", gabNota:"Coincide com a correção publicada pelo curso indicado na fonte; gabarito oficial da banca não localizado online.",
  res:["Diagonais: D = N(N − 3)/2 e d = n(n − 3)/2.","D − d = (N − n)(N + n − 3)/2.","Igualando a N − n (com N ≠ n): (N + n − 3)/2 = 1 ⇒ N + n = 5.","Mas todo polígono tem pelo menos 3 lados, então N + n ≥ 6. Não há solução (alternativa A)."] },

/* ---------------- EPCAR / CPCAR 2012 ---------------- */
{ id:"epcar12-05", inst:"EPCAR", ano:2011, fonte:"epcar12", num:5, materia:"Matemática", assunto:"problemas", dif:4,
  enun:"Hoje (29/07/2012), José tem o dobro da idade que Luiz tinha quando José tinha a idade que Luiz tem hoje. Quando Luiz tiver a idade que José tem hoje, a soma das idades dos dois será 90 anos. Qual será a razão entre as idades de José e de Luiz em 29/07/2017?",
  alts:{A:"6/5",B:"5/4",C:"9/7",D:"27/20"}, gab:"C", gabTipo:"verificado", gabNota:"Coincide com a correção publicada pelo curso indicado na fonte; gabarito oficial da banca não localizado online.",
  res:["Hoje: José = J e Luiz = L. A diferença de idades d = J − L é sempre a mesma.","Quando José tinha L anos, Luiz tinha L − d = 2L − J. Assim J = 2(2L − J) ⇒ 3J = 4L.","Quando Luiz tiver J anos (daqui a d anos), José terá J + d = 2J − L. Soma: J + 2J − L = 3J − L = 90.","Com 3J = 4L: 4L − L = 90 ⇒ L = 30 e J = 40.","Em 2017 (5 anos depois): 45/35 = 9/7 (alternativa C)."] },
{ id:"epcar12-07", inst:"EPCAR", ano:2011, fonte:"epcar12", num:7, materia:"Matemática", assunto:"medidas", dif:3,
  enun:"Maria Fernanda usa um balde de 0,028 hl para regar 16 roseiras, jogando 800 cm³ de água em cada uma, sem desperdício, e enchendo o balde sempre que necessário. Assinale a afirmação correta.",
  alts:{A:"O volume que sobra no balde é maior que 5/7 da capacidade do balde.",B:"É necessário encher o balde somente 5 vezes.",C:"O total de água gasto não chega a 15 litros.",D:"O volume que sobra no balde é menor que 10% do total de água gasto."}, gab:"C", gabTipo:"verificado", gabNota:"Coincide com a correção publicada pelo curso indicado na fonte; gabarito oficial da banca não localizado online.",
  res:["0,028 hl = 2,8 L. 800 cm³ = 0,8 L.","Total gasto: 16 × 0,8 = 12,8 L, que é menos de 15 L (C correta).","Conferindo: são necessários 5 baldes (14 L), sobrando 1,2 L; 1,2 L é menos que 5/7 de 2,8 L (2 L) e é mais que 10% de 12,8 L. Só C está certa."] },
{ id:"epcar12-08", inst:"EPCAR", ano:2011, fonte:"epcar12", num:8, materia:"Matemática", assunto:"proporcionalidade", dif:4,
  enun:"Duas torneiras enchem um reservatório: a primeira sozinha em 36 min e a segunda sozinha em 24 min. Com o reservatório vazio, abre-se a primeira por k minutos e, em seguida, a segunda por (k + 3) minutos, atingindo 2/3 da capacidade. Qual foi o tempo total gasto?",
  alts:{A:"30% de uma hora",B:"31% de uma hora",C:"28% de uma hora",D:"27% de uma hora"}, gab:"B", gabTipo:"verificado", gabNota:"Coincide com a correção publicada pelo curso indicado na fonte; gabarito oficial da banca não localizado online.",
  res:["A primeira enche 1/36 do tanque por minuto; a segunda, 1/24.","k/36 + (k + 3)/24 = 2/3. Multiplicando por 72: 2k + 3k + 9 = 48 ⇒ k = 7,8 min.","Tempo total: k + (k + 3) = 18,6 min.","18,6 ÷ 60 = 0,31 = 31% de uma hora (alternativa B)."] },
{ id:"epcar12-13", inst:"EPCAR", ano:2011, fonte:"epcar12", num:13, materia:"Matemática", assunto:"proporcionalidade", dif:5,
  enun:"Seis funcionários, trabalhando 6 h por dia, pintariam um alojamento em 10 dias. Ao fim do 8º dia, só 3/5 do serviço estavam prontos. A equipe recebeu mais 2 funcionários, todos passaram a trabalhar 9 h por dia e a produtividade dobrou. O restante levou mais de 1 e menos de 2 dias. Se h é o número de horas que cada um trabalhou no 10º dia, h está entre:",
  alts:{A:"0 e 2",B:"4 e 6",C:"2 e 4",D:"6 e 8"}, gab:"C", gabTipo:"verificado", gabNota:"Coincide com a correção publicada pelo curso indicado na fonte; gabarito oficial da banca não localizado online.",
  res:["Em 8 dias foram 6 × 6 × 8 = 288 horas-trabalho, que fizeram 3/5 do serviço. O serviço todo exige 480 horas no ritmo antigo.","Faltam 2/5: 192 horas no ritmo antigo. Com produtividade dobrada, bastam 96 horas-trabalho.","No 9º dia: 8 funcionários × 9 h = 72 horas. Faltam 24 horas para o 10º dia.","24 ÷ 8 funcionários = 3 h cada: entre 2 e 4 (alternativa C)."] },
{ id:"epcar12-14", inst:"EPCAR", ano:2011, fonte:"epcar12", num:14, materia:"Matemática", assunto:"juros", dif:4,
  enun:"Gabriel aplicou R$ 6 500,00 a juros simples em dois bancos: no A, parte a 3% ao mês por 5/6 de ano; no B, o restante a 3,5% ao mês por 3/4 de ano. O total de juros foi R$ 2 002,50. Assinale a afirmação correta.",
  alts:{A:"É possível comprar um televisor de R$ 3 100,00 com a quantia aplicada no banco A.",B:"Os juros do banco A foram menores que R$ 850,00.",C:"Os juros do banco B foram maiores que R$ 1 110,00.",D:"É possível comprar uma moto de R$ 4 600,00 com o montante (capital + juros) do banco B."}, gab:"D", gabTipo:"verificado", gabNota:"Coincide com a correção publicada pelo curso indicado na fonte; gabarito oficial da banca não localizado online.",
  res:["5/6 de ano = 10 meses; 3/4 de ano = 9 meses.","Banco A com x: juros = 0,03 × 10 × x = 0,3x. Banco B: 0,035 × 9 × (6 500 − x) = 0,315(6 500 − x).","0,3x + 2 047,50 − 0,315x = 2 002,50 ⇒ 0,015x = 45 ⇒ x = 3 000.","B: capital 3 500, juros 1 102,50, montante R$ 4 602,50 ≥ 4 600 (alternativa D)."] },
{ id:"epcar12-15", inst:"EPCAR", ano:2011, fonte:"epcar12", num:15, materia:"Matemática", assunto:"eq1", dif:3,
  enun:"Pitágoras e Tales têm, cada um, certa quantia. Se Pitágoras der R$ 50,00 a Tales, ficarão com quantias iguais. Se Tales der R$ 100,00 a Pitágoras, Tales passará a ter 1/4 da quantia de Pitágoras. Assinale a afirmação correta.",
  alts:{A:"Pitágoras possui 2/3 da quantia de Tales.",B:"A soma das quantias que os dois possuem é menor que R$ 600,00.",C:"Tales possui mais que R$ 220,00.",D:"A diferença entre as quantias é menor que R$ 100,00."}, gab:"B", gabTipo:"verificado", gabNota:"Coincide com a correção publicada pelo curso indicado na fonte; gabarito oficial da banca não localizado online.",
  res:["P − 50 = T + 50 ⇒ P = T + 100.","T − 100 = (P + 100)/4 ⇒ 4T − 400 = T + 200 ⇒ T = 200 e P = 300.","Soma: R$ 500,00 < R$ 600,00 (alternativa B)."] },
{ id:"epcar12-18", inst:"EPCAR", ano:2011, fonte:"epcar12", num:18, materia:"Matemática", assunto:"razao", dif:3,
  enun:"Uma mãe dividiu R$ 2 100,00 entre seus filhos de 3, 5 e 6 anos, em partes inversamente proporcionais às idades. Assinale a afirmação verdadeira.",
  alts:{A:"Se a divisão fosse em partes iguais, o filho mais velho receberia 40% a mais do que recebeu.",B:"O filho mais novo recebeu R$ 100,00 a mais que a soma dos outros dois.",C:"O filho mais velho recebeu 20% a menos que o filho do meio.",D:"O filho do meio recebeu 40% do que recebeu o mais novo."}, gab:"A", gabTipo:"verificado", gabNota:"Coincide com a correção publicada pelo curso indicado na fonte; gabarito oficial da banca não localizado online.",
  res:["Inversamente proporcional a 3, 5 e 6 = diretamente a 1/3, 1/5 e 1/6. Com denominador 30: 10, 6 e 5.","Soma das partes 21: cada parte vale 2 100 ÷ 21 = R$ 100. Recebem 1 000, 600 e 500.","Em partes iguais, cada um receberia 700. O mais velho recebeu 500; 700 é 40% a mais que 500 (alternativa A)."] },
{ id:"epcar12-20", inst:"EPCAR", ano:2011, fonte:"epcar12", num:20, materia:"Matemática", assunto:"porcentagem", dif:4,
  enun:"Uma fábrica vende 30 camisas por mês a R$ 25,00 cada, com custo de R$ 10,00 por camisa. A cada redução de R$ 0,50 no preço, vende 5 camisas a mais. Se forem vendidas 150 camisas, o lucro por camisa será de y% do custo. Quantos divisores positivos tem y?",
  alts:{A:"6",B:"10",C:"8",D:"12"}, gab:"C", gabTipo:"verificado", gabNota:"Coincide com a correção publicada pelo curso indicado na fonte; gabarito oficial da banca não localizado online.",
  res:["De 30 para 150 camisas são 120 a mais: 120 ÷ 5 = 24 reduções de R$ 0,50 = R$ 12,00.","Novo preço: 25 − 12 = R$ 13,00. Lucro por camisa: R$ 3,00 sobre custo de R$ 10,00 = 30%.","Divisores de 30: 1, 2, 3, 5, 6, 10, 15, 30 → 8 divisores (alternativa C)."] },

{ id:"epcar24-17", inst:"EPCAR", ano:2023, fonte:"epcar24", num:17, materia:"Matemática", assunto:"divis", dif:4,
  enun:"Os naturais p e q satisfazem p < q, p + q = 108, MDC(p, q) = 12, e o produto p · q é o maior possível. Qual afirmação é correta?",
  alts:{A:"√(p·q) é racional.",B:"p : q = 1 : 2",C:"O MMC de p e q é 240.",D:"Se p e q forem dois lados de um triângulo, o terceiro lado poderá medir 108."}, gab:"C", gabTipo:"oficial",
  res:["MDC 12: p = 12a e q = 12b, com a e b primos entre si e a + b = 9.","Pares possíveis (a < b): (1, 8), (2, 7), (4, 5). O produto é máximo para (4, 5): p = 48 e q = 60.","MMC(48, 60) = 48 × 60 ÷ 12 = 240 (alternativa C).","As outras falham: 48 × 60 = 2 880 não é quadrado perfeito; 48 : 60 = 4 : 5; o lado 108 tornaria o triângulo degenerado (48 + 60 = 108)."] },
{ id:"epcar24-20", inst:"EPCAR", ano:2023, fonte:"epcar24", num:20, materia:"Matemática", assunto:"porcentagem", dif:2,
  enun:"Numa enquete, cada participante escolheu um entre Flamengo, Fluminense, Botafogo e Vasco. O Flamengo teve 45% dos votos e o Vasco, 35%. O Botafogo recebeu 1/4 dos votos do Fluminense. Que porcentagem dos votos o Fluminense recebeu?",
  alts:{A:"4%",B:"7,5%",C:"16%",D:"20%"}, gab:"C", gabTipo:"oficial",
  res:["Sobram 100% − 45% − 35% = 20% para Fluminense + Botafogo.","Fluminense = F; Botafogo = F/4. F + F/4 = 20% ⇒ 1,25F = 20% ⇒ F = 16% (alternativa C)."] },
{ id:"epcar24-21", inst:"EPCAR", ano:2023, fonte:"epcar24", num:21, materia:"Matemática", assunto:"potencias", dif:5,
  enun:"Considere P(x) = x⁸ + x⁷ − 64x² − 64x e os polinômios A(x) = x² − 4, C(x) = x³ + 8, F(x) = x³ + 2x² + 4x e W(x) = x² − 2x + 4. Qual afirmação é correta?",
  alts:{A:"Todos eles dividem P(x).",B:"Nenhum deles divide P(x).",C:"Somente A(x) e F(x) dividem P(x).",D:"Somente C(x) e W(x) dividem P(x)."}, gab:"A", gabTipo:"oficial",
  res:["Agrupe: P(x) = x⁷(x + 1) − 64x(x + 1) = x(x + 1)(x⁶ − 64).","x⁶ − 64 = (x³ − 8)(x³ + 8) = (x − 2)(x² + 2x + 4)(x + 2)(x² − 2x + 4).","A = (x − 2)(x + 2) ✓; C = x³ + 8 ✓; F = x(x² + 2x + 4) ✓; W ✓.","Todos dividem P(x) (alternativa A)."] },
{ id:"epcar24-22", inst:"EPCAR", ano:2023, fonte:"epcar24", num:22, materia:"Matemática", assunto:"eq1", dif:3,
  enun:"Uma doceria vende bombons de uva ou de morango. Três de morango custam o mesmo que dois de uva mais R$ 1,50, e o de uva custa 20% a mais que o de morango. Num domingo foram vendidos 75 bombons por R$ 205,00. Qual é a diferença entre as quantidades vendidas de morango e de uva?",
  alts:{A:"7",B:"5",C:"3",D:"2"}, gab:"B", gabTipo:"oficial",
  res:["Morango = m; uva = 1,2m. 3m = 2(1,2m) + 1,50 ⇒ 0,6m = 1,50 ⇒ m = R$ 2,50 e uva = R$ 3,00.","x de morango e y de uva: x + y = 75 e 2,5x + 3y = 205.","Substituindo y = 75 − x: 2,5x + 225 − 3x = 205 ⇒ x = 40 e y = 35.","Diferença: 5 (alternativa B)."] },
{ id:"epcar24-23", inst:"EPCAR", ano:2023, fonte:"epcar24", num:23, materia:"Matemática", assunto:"eq2", dif:4,
  enun:"Seja p a raiz da equação irracional √(x² + 5x) = 14 − 2x. Qual par de valores pode ser formado pelos outros dois lados de um triângulo que tem p como um dos lados?",
  alts:{A:"3,5 e 4",B:"5 e 9",C:"7 e 2,5",D:"13 e 8,5"}, gab:"A", gabTipo:"oficial",
  res:["Condição: 14 − 2x ≥ 0 ⇒ x ≤ 7.","Elevando ao quadrado: x² + 5x = 196 − 56x + 4x² ⇒ 3x² − 61x + 196 = 0.","Δ = 3 721 − 2 352 = 1 369 = 37². x = (61 ± 37)/6 ⇒ x = 4 ou x ≈ 16,3 (não serve). p = 4.","Desigualdade triangular com lado 4: (3,5; 4) funciona. (5; 9): 4 + 5 = 9, degenerado. (7; 2,5): 4 + 2,5 < 7. (13; 8,5): 4 + 8,5 < 13. Alternativa A."] },
{ id:"epcar24-24", inst:"EPCAR", ano:2023, fonte:"epcar24", num:24, materia:"Matemática", assunto:"funcoes", dif:4,
  enun:"As vendas de uma empresa são V(m) = −(3/8)m² + 3m + 60 e os custos C(m) = (9/8)m² − 9m + 30, em milhares de dólares, com m em décadas. O lucro (vendas menos custos) é máximo após t décadas, e a empresa fecha após k décadas, quando o lucro chega a zero. Quanto vale k − t?",
  alts:{A:"4",B:"6",C:"8",D:"10"}, gab:"B", gabTipo:"oficial",
  res:["Lucro L(m) = V − C = −(12/8)m² + 12m + 30 = −1,5m² + 12m + 30.","Máximo no vértice: t = −12 ÷ (2 · (−1,5)) = 4.","L = 0: −1,5m² + 12m + 30 = 0 ⇒ m² − 8m − 20 = 0 ⇒ m = 10 (a raiz −2 não serve). k = 10.","k − t = 6 (alternativa B)."] },
{ id:"epcar24-26", inst:"EPCAR", ano:2023, fonte:"epcar24", num:26, materia:"Matemática", assunto:"medidas", dif:3,
  enun:"Um hectare (ha) é a área de um quadrado de 100 m de lado. A primeira fase de um plantio cobre 800 ha, que equivalem a x km². Um campo de futebol de referência tem 0,1 km de comprimento e 6,5 dam de largura. Aproximadamente quantos desses campos cabem na área x?",

{ id:"epcar24-27", inst:"EPCAR", ano:2023, fonte:"epcar24", num:27, materia:"Matemática", assunto:"porcentagem", dif:3,

/* ================= EPCAR 2027 — Matemática (gabarito oficial) ================= */
{ id:"ep27-19", inst:"EPCAR", ano:2026, fonte:"epcar27", num:19, materia:"Matemática", assunto:"potencias", dif:2,
  enun:"Um aluno disse que 1 trilhão é igual a 1 milhão de bilhões. O professor corrigiu: 1 trilhão é igual a mil bilhões. Qual é a diferença entre o valor dito pelo aluno e o valor correto?",
  alts:{A:"9,9 × 10¹⁵",B:"9,99 × 10¹⁴",C:"9,9 × 10¹³",D:"9,99 × 10¹²"}, gab:"B", gabTipo:"oficial",
  res:["Aluno: 10⁶ × 10⁹ = 10¹⁵. Professor: 10³ × 10⁹ = 10¹².","Diferença: 10¹⁵ − 10¹² = 10¹² × (1 000 − 1) = 999 × 10¹².","999 × 10¹² = 9,99 × 10¹⁴ (alternativa B)."] },
{ id:"ep27-21", inst:"EPCAR", ano:2026, fonte:"epcar27", num:21, materia:"Matemática", assunto:"funcoes", dif:3,
  enun:"A função f(x) = ax + 2b é estritamente crescente, com f(a) = 3b e f(b) = 3a². Qual é o valor de f(5)?",
  alts:{A:"2",B:"7",C:"12",D:"17"}, gab:"B", gabTipo:"oficial",
  res:["Crescente ⇒ a > 0.","f(a) = a² + 2b = 3b ⇒ b = a².","f(b) = ab + 2b = 3a² ⇒ a·a² + 2a² = 3a² ⇒ a³ = a² ⇒ a = 1 (pois a > 0). Logo b = 1.","f(x) = x + 2 ⇒ f(5) = 7 (alternativa B)."] },
{ id:"ep27-22", inst:"EPCAR", ano:2026, fonte:"epcar27", num:22, materia:"Matemática", assunto:"eq1", dif:3,
  enun:"Considere os números de dois algarismos XY (X = dezenas, Y = unidades) tais que (X + 1)·(Y + 1) = XY + 1, em que XY é o número de dois algarismos. Qual é a soma de todos esses números?",
  alts:{A:"421",B:"431",C:"521",D:"531"}, gab:"D", gabTipo:"oficial",
  res:["O número XY vale 10X + Y.","Desenvolvendo: X·Y + X + Y + 1 = 10X + Y + 1 ⇒ X·Y + X = 10X ⇒ X(Y − 9) = 0.","Como X ≠ 0, Y = 9: os números são 19, 29, …, 99.","Soma: (10 + 20 + … + 90) + 9 × 9 = 450 + 81 = 531 (alternativa D)."] },
{ id:"ep27-23", inst:"EPCAR", ano:2026, fonte:"epcar27", num:23, materia:"Matemática", assunto:"conjuntos", dif:3,
  enun:"Um código secreto tem três algarismos distintos e não nulos. Pistas: 843 → um algarismo certo e no lugar certo; 123 → nenhum algarismo certo; 612 → um certo, mas no lugar errado; 456 → um certo e no lugar certo; 547 → um certo, mas no lugar errado. A mensagem chegou às 6h00 e o código indica em quantos minutos um veículo buscará a equipe. A que horas o veículo chega?",
  alts:{A:"20h36",B:"20h27",C:"17h27",D:"17h18"}, gab:"A", gabTipo:"oficial",
  res:["Por 123, os algarismos 1, 2 e 3 não estão no código. Em 612, o certo só pode ser o 6, fora da 1ª posição.","Em 456, só um algarismo é certo e o 6 está no código: então 4 e 5 não estão, e o 6 ocupa a 3ª posição.","Em 547, o certo é o 7, fora da 3ª posição. Em 843, o certo é o 8, na 1ª posição.","Código: 876 minutos = 14 h 36 min. 6h00 + 14h36 = 20h36 (alternativa A)."] },
{ id:"ep27-25", inst:"EPCAR", ano:2026, fonte:"epcar27", num:25, materia:"Matemática", assunto:"divis", dif:4,
  enun:"Três alunos começam a trabalhar no mesmo dia. Weiglas trabalha 3 dias e folga 1; Nascimento trabalha 6 dias e folga 2; Teixeira trabalha 7 dias e folga 3 (cada um repete seu ciclo). Em 365 dias, o número de dias em que os três folgam juntos:",
  alts:{A:"é primo",B:"é um quadrado perfeito",C:"é divisível por 7",D:"tem seis divisores naturais"}, gab:"D", gabTipo:"oficial",
  res:["Folgas: Weiglas nos dias múltiplos de 4; Nascimento nos dias ≡ 7 ou 0 (mod 8); Teixeira nos dias ≡ 8, 9 ou 0 (mod 10).","Múltiplo de 4 e ≡ 7 ou 0 (mod 8) ⇒ múltiplo de 8. Entre os múltiplos de 8, terminam em 8 ou 0 (o 9 é ímpar): a cada 40 dias, os dias 8 e 40.","Até 365: 8, 40, 48, 80, …, 328, 360 ⇒ 18 dias.","18 tem os divisores 1, 2, 3, 6, 9 e 18: seis divisores (alternativa D)."] },
{ id:"ep27-27", inst:"EPCAR", ano:2026, fonte:"epcar27", num:27, materia:"Matemática", assunto:"divis", dif:4,
  enun:"M, P e K são as idades do pai e de dois irmãos, com mdc(P, M) = 15, mdc(P, K) = 5, mdc(M, K) = 20 e P × M × K = 18 000. O irmão caçula, Joãozinho, tem 13 anos. Qual é a soma das quatro idades?",
  alts:{A:"95",B:"103",C:"108",D:"115"}, gab:"C", gabTipo:"oficial",
  res:["P é múltiplo de 15; K é múltiplo de 20; M é múltiplo de 15 e de 20, logo de 60.","Testando os menores valores: P = 15, M = 60, K = 20 ⇒ 15 × 60 × 20 = 18 000. ✔","Conferindo os mdc: mdc(15, 60) = 15; mdc(15, 20) = 5; mdc(60, 20) = 20. ✔","Soma: 15 + 60 + 20 + 13 = 108 (alternativa C)."] },
{ id:"ep27-28", inst:"EPCAR", ano:2026, fonte:"epcar27", num:28, materia:"Matemática", assunto:"funcoes", dif:4,
  enun:"Um jogador chuta uma bola parada no chão a 34 m do gol. A trajetória é uma parábola que voltaria ao chão a 40 m do ponto do chute, com altura máxima de 5 m. A altura interna do gol é 2,44 m e o travessão tem 12 cm de espessura. A bola:",
  alts:{A:"entrou direto no gol.",B:"bateu no travessão.",C:"passou por cima do travessão.",D:"atingiu a altura máxima a 15 m do chute."}, gab:"B", gabTipo:"oficial",
  res:["Raízes em 0 e 40 ⇒ vértice em x = 20, com altura 5: h(x) = 5 − (x − 20)²/80.","Em x = 34: h = 5 − 14²/80 = 5 − 196/80 = 5 − 2,45 = 2,45 m.","O travessão vai de 2,44 m a 2,56 m: a bola passa a 2,45 m e bate nele (alternativa B)."] },
{ id:"ep27-29", inst:"EPCAR", ano:2026, fonte:"epcar27", num:29, materia:"Matemática", assunto:"geometria", dif:4,
  enun:"Um helicóptero sai da base P numa direção que faz 30° com o norte (para leste), voa 10 km em linha reta até o bairro A, depois 10 km para leste até o bairro B e volta em linha reta a P. Usando √3 = 1,7, qual é a distância total percorrida, em metros?",
  alts:{A:"27 000",B:"30 000",C:"34 000",D:"37 000"}, gab:"D", gabTipo:"oficial",
  res:["P → A: leste 10·sen30° = 5 km; norte 10·cos30° = 5√3 km.","A → B: mais 10 km para leste ⇒ B fica 15 km a leste e 5√3 km ao norte de P.","PB = √(15² + 75) = √300 = 10√3 ≈ 17 km.","Total: 10 + 10 + 17 = 37 km = 37 000 m (alternativa D)."] },
{ id:"ep27-30", inst:"EPCAR", ano:2026, fonte:"epcar27", num:30, materia:"Matemática", assunto:"funcoes", dif:3,
  enun:"Compare o gráfico de f(x) = x² − 2x + 4 com os de g(x) = x² − 2x + 2, h(x) = x² − 2x + 8 e i(x) = x² − 2x + 16. Afirmações: I. Todos cortam o eixo x no mesmo ponto. II. Todos têm o mesmo conjunto imagem. III. Todos têm vértice com a mesma abscissa. Quantas são verdadeiras?",
  alts:{A:"todas",B:"nenhuma",C:"uma",D:"duas"}, gab:"C", gabTipo:"oficial",
  res:["As funções só diferem pelo termo independente: os gráficos são translações verticais.","I: Δ de f = 4 − 16 < 0 (e as outras também têm Δ < 0): nenhum gráfico corta o eixo x. Falsa.","II: imagens [3, ∞), [1, ∞), [7, ∞) e [15, ∞). Falsa.","III: xᵥ = −b/2a = 1 em todas. Verdadeira. Só uma é verdadeira (alternativa C)."] },
{ id:"ep27-32", inst:"EPCAR", ano:2026, fonte:"epcar27", num:32, materia:"Matemática", assunto:"problemas", dif:4,
  enun:"Dois militares correm por exatamente 12 minutos numa pista de 400 m, no mesmo sentido, a 3,4 m/s (militar 1) e 5 m/s (militar 2). O militar 2 larga 200 m atrás do militar 1. I. A diferença entre as distâncias percorridas está entre 2,5 e 2,8 voltas. II. Eles ficam lado a lado pela primeira vez aos 125 s. III. Quando o militar 2 ultrapassa o militar 1 pela segunda vez, o tempo t é tal que t/5 é um quadrado perfeito. Quantas estão corretas?",
  alts:{A:"nenhuma",B:"uma",C:"duas",D:"todas"}, gab:"B", gabTipo:"oficial",
  res:["12 min = 720 s. Distâncias: 3,4 × 720 = 2 448 m e 5 × 720 = 3 600 m. Diferença: 1 152 m = 2,88 voltas. I é falsa.","Velocidade relativa: 1,6 m/s. Para tirar 200 m: 200 ÷ 1,6 = 125 s. II é verdadeira.","Ultrapassagens seguintes a cada 400 ÷ 1,6 = 250 s: 125 s e 375 s (ou 625 s). 375/5 = 75 e 625/5 = 125 não são quadrados. III é falsa.","Uma correta (alternativa B)."] },

/* ================= EPCAR 2027 — Inglês (gabarito oficial) ================= */
{ id:"ep27-02", inst:"EPCAR", ano:2026, fonte:"epcar27", num:2, materia:"Inglês", assunto:"reading", dif:2,
  enun:"Texto I (trecho adaptado de \"The Ugly Duckling\", de Hans Christian Andersen, obra em domínio público): o patinho voa até um jardim, vê três cisnes belíssimos e nada até eles, esperando ser morto. Ao inclinar a cabeça para a água, vê o próprio reflexo e descobre que se tornou um cisne. The turning point of Text I was when the:",
  alts:{A:"bird feels the warmth of sunshine.",B:"bird flapped his wings against his sides.",C:"bird bent his head down to the surface of the water.",D:"beautiful royal birds rushed to meet the strange one."}, gab:"C", gabTipo:"oficial",
  res:["\"Turning point\" é o momento de virada da história.","A virada acontece quando ele se vê refletido na água e percebe que é um cisne.","Alternativa C."] },
{ id:"ep27-03", inst:"EPCAR", ano:2026, fonte:"epcar27", num:3, materia:"Inglês", assunto:"reading", dif:2,
  enun:"No Texto I aparece: \"the fragrant elders bent their long green branches down to the stream\". A palavra \"elders\" refere-se a:",
  alts:{A:"some vegetable.",B:"an old vegetation.",C:"a specific kind of tree.",D:"a specific kind of flower."}, gab:"C", gabTipo:"oficial",
  res:["\"Elder\" pode ser \"mais velho\", mas aqui é o sabugueiro, uma árvore.","A pista está no contexto: elders têm \"long green branches\" (galhos longos).","Alternativa C."] },
{ id:"ep27-04", inst:"EPCAR", ano:2026, fonte:"epcar27", num:4, materia:"Inglês", assunto:"reading", dif:2,
  enun:"Which sentence from Text I best illustrates the meaning of the word \"graceful\"?",
  alts:{A:"\"[…] and swimming lightly over the smooth water.\"",B:"\"[…] they rushed to meet him with outstretched wings.\"",C:"\"[…] bent their long green branches down to the stream […]\"",D:"\"[…] his wings were strong, as he flapped them against his sides […]\""}, gab:"A", gabTipo:"oficial",
  res:["\"Graceful\" = gracioso, que se move com leveza e elegância.","\"Swimming lightly over the smooth water\" descreve justamente esse movimento leve.","Alternativa A."] },
{ id:"ep27-05", inst:"EPCAR", ano:2026, fonte:"epcar27", num:5, materia:"Inglês", assunto:"past", dif:3,
  enun:"The sentence \"They bore him onwards until, before he well knew how it had happened, he found himself in a large garden.\" (sobre as asas do patinho) means:",
  alts:{A:"the duckling was bored by the fact he still had to flap his wings to fly.",B:"his wings carried him ahead even though he had no idea how he was doing it.",C:"the bird had no clue about how he got to the garden, but the journey tired him.",D:"before he could clearly understand what happened the bird's wings got bored."}, gab:"B", gabTipo:"oficial",
  res:["Pegadinha: \"bore\" aqui é o passado de \"bear\" (carregar), e não o verbo \"bore\" (entediar).","\"They bore him onwards\" = as asas o levaram adiante; \"before he well knew how\" = sem saber bem como.","Alternativa B."] },
{ id:"ep27-06", inst:"EPCAR", ano:2026, fonte:"epcar27", num:6, materia:"Inglês", assunto:"reading", dif:3,
  enun:"Texto II: resumo do romance \"Tiger Eyes\" (Judy Blume). Depois da morte do pai, Davey se muda com a mãe para o Novo México. The sentence \"Her mother Gwen opts to whisk the family away for a change of scenery\" means that:",
  alts:{A:"the woman craved redemption and illusion.",B:"Gwen wanted to omit the bitter truth from her family.",C:"the family was not prepared to handle a new reality.",D:"the mother glimpses a new perspective for the family."}, gab:"D", gabTipo:"oficial",
  res:["\"Whisk away\" = levar rapidamente; \"a change of scenery\" = mudança de ares.","A mãe decide mudar de lugar para dar à família um novo começo.","Alternativa D."] },
{ id:"ep27-07", inst:"EPCAR", ano:2026, fonte:"epcar27", num:7, materia:"Inglês", assunto:"conditionals", dif:3,
  enun:"Which alternative illustrates proper use of grammar?",
  alts:{A:"If Wolf doesn't comment on her sadness, she would be closer to him.",B:"If she hadn't gone for a walk in the canyon, she wouldn't have met Wolf.",C:"If she hasn't been living a personal tragedy she could still be in Atlantic City.",D:"If her mother goes to Los Alamos, she had been felt happier."}, gab:"B", gabTipo:"oficial",
  res:["3ª condicional (passado irreal): If + past perfect, would have + particípio.","\"If she hadn't gone…, she wouldn't have met Wolf\" segue exatamente essa estrutura.","As outras misturam tempos que não combinam. Alternativa B."] },
{ id:"ep27-09", inst:"EPCAR", ano:2026, fonte:"epcar27", num:9, materia:"Inglês", assunto:"reading", dif:3,
  enun:"No Texto II, a palavra \"sojourn\" descreve a temporada da família no Novo México. What option expresses an idea similar to the meaning of \"sojourn\"?",
  alts:{A:"He was traumatized by the loss of his best friend.",B:"He felt bummed out because she broke up with him.",C:"Their time spent in Arizona was essential to improve their relationship.",D:"From the day he left the hospital till the day he died, he felt out of place."}, gab:"C", gabTipo:"oficial",
  res:["\"Sojourn\" = estadia temporária em um lugar.","A ideia equivalente é \"time spent in Arizona\" (tempo passado num lugar).","Alternativa C."] },
{ id:"ep27-12", inst:"EPCAR", ano:2026, fonte:"epcar27", num:12, materia:"Inglês", assunto:"reading", dif:3,
  enun:"Uma citação sobre envelhecer diz: \"No matter how many yesterdays you've had…\". In context, this sentence indicates:",
  alts:{A:"a relevant fact that happened a few days ago.",B:"emphasis on an action that changed one's life.",C:"past life experiences connected to the present.",D:"past life experiences that have recently happened."}, gab:"C", gabTipo:"oficial",
  res:["\"No matter how many\" = não importa quantos; \"yesterdays\" = os dias já vividos.","O present perfect (\"you've had\") liga essas experiências passadas ao presente.","Alternativa C."] },
{ id:"ep27-13", inst:"EPCAR", ano:2026, fonte:"epcar27", num:13, materia:"Inglês", assunto:"reading", dif:2,
  enun:"Na mesma citação (\"No matter how many yesterdays you've had…\"), the word \"yesterdays\" implies:",
  alts:{A:"past experiences.",B:"the day before today.",C:"years you knew nothing about.",D:"a metaphor for becoming mature."}, gab:"A", gabTipo:"oficial",
  res:["No plural e nesse contexto, \"yesterdays\" não é \"ontem\": é tudo o que a pessoa já viveu.","Alternativa A."] },

/* ================= EPCAR 2024 — Inglês (gabarito oficial) ================= */
{ id:"ep24-33", inst:"EPCAR", ano:2023, fonte:"epcar24", num:33, materia:"Inglês", assunto:"reading", dif:2,
  enun:"Texto I: página da ONU sobre o Dia Internacional da Amizade, que apresenta a amizade como forma de solidariedade para enfrentar crises, construir confiança e promover a paz. It is correct to say that:",
  alts:{A:"one of the worst challenges that our world faces is the development of social harmony among peoples.",B:"bonds of camaraderie and strong connections of trust only work if peoples share the same culture.",C:"building connections and developing trust already promoted the changes our world needed.",D:"a common spirit of human solidarity must be promoted and defended."}, gab:"D", gabTipo:"oficial",
  res:["O texto defende promover a solidariedade entre os povos, não diz que a harmonia é um desafio ruim (A).","Não exige mesma cultura (B) nem afirma que as mudanças já aconteceram (C).","Alternativa D."] },
{ id:"ep24-34", inst:"EPCAR", ano:2023, fonte:"epcar24", num:34, materia:"Inglês", assunto:"reading", dif:1,
  enun:"Segundo o Texto I (ONU), the International Day of Friendship was proclaimed to:",
  alts:{A:"challenge the economic development and stability.",B:"give opportunity to the countries to protect peoples' culture.",C:"stimulate connection, peace and cooperation between nations.",D:"support poor people around the world and help forces of division."}, gab:"C", gabTipo:"oficial",
  res:["A data (proclamada em 2011) busca aproximar povos e promover a paz.","Alternativa C."] },
{ id:"ep24-36", inst:"EPCAR", ano:2023, fonte:"epcar24", num:36, materia:"Inglês", assunto:"reading", dif:2,
  enun:"Texto II: a canção \"Count on Me\" (Bruno Mars), sobre amigos que se apoiam. Num trecho, o cantor promete ser a luz que guia o amigo no escuro. In this sentence the author is:",
  alts:{A:"offering a lantern to a friend.",B:"promising to have a friend's back.",C:"turning on the lights to clear the room.",D:"protecting a friend from the darkness."}, gab:"B", gabTipo:"oficial",
  res:["A luz é uma metáfora: ele não fala de lanterna nem de lâmpada.","\"To have someone's back\" = dar apoio a alguém.","Alternativa B."] },
{ id:"ep24-38", inst:"EPCAR", ano:2023, fonte:"epcar24", num:38, materia:"Inglês", assunto:"conditionals", dif:3,
  enun:"Na canção do Texto II, o cantor diz que atravessaria o mundo para encontrar o amigo perdido. Choose the sentence that is coherent with the idea supported by the author.",
  alts:{A:"I wouldn't try to find my friend if he/she disappeared.",B:"It may be easy to find my friend when he/she is lost.",C:"If my friend had been lost, I would have looked for him/her.",D:"Even if it were easy to find my friend, I wouldn't look for him/her."}, gab:"C", gabTipo:"oficial",
  res:["A ideia é: se o amigo se perdesse, ele procuraria.","Só a alternativa C diz isso (3ª condicional). A e D dizem o contrário; B fala de facilidade.","Alternativa C."] },
{ id:"ep24-39", inst:"EPCAR", ano:2023, fonte:"epcar24", num:39, materia:"Inglês", assunto:"conditionals", dif:3,
  enun:"According to the idea of Text II (a amizade como apoio garantido), if my friend called me for help, I…",
  alts:{A:"was there for you.",B:"will count on him/her.",C:"would have helped him/her.",D:"would be ready to support him/her."}, gab:"D", gabTipo:"oficial",
  res:["\"If my friend called…\" é 2ª condicional (If + passado simples).","A oração principal pede would + verbo no infinitivo: \"I would be ready…\".","Alternativa D."] },
{ id:"ep24-40", inst:"EPCAR", ano:2023, fonte:"epcar24", num:40, materia:"Inglês", assunto:"reading", dif:2,
  enun:"Texto I (ONU: amizade como solidariedade em tempos de crise) e Texto II (canção sobre contar com os amigos nas dificuldades). Choose the aspect in which a similarity between Texts I and II can be found.",
  alts:{A:"Both texts show that friendship can help people deal with difficulties and problems.",B:"They promote a reflection about friendship as the solution to the world's problems.",C:"There are references to the intensification of friendship until it becomes a romance.",D:"They both talk about the importance of having a friend to celebrate pleasant moments."}, gab:"A", gabTipo:"oficial",
  res:["Os dois textos ligam a amizade ao apoio diante de problemas.","B exagera (\"a solução\"); C e D não aparecem.","Alternativa A."] },
{ id:"ep24-43", inst:"EPCAR", ano:2023, fonte:"epcar24", num:43, materia:"Inglês", assunto:"connectors", dif:3,
  enun:"\"Wednesday, who tells herself that she doesn't need anyone else (…)\". About the words \"who\" and \"that\", we can say that:",
  alts:{A:"both can be replaced by which.",B:"who can be replaced by which.",C:"who can be omitted.",D:"that can be omitted."}, gab:"D", gabTipo:"oficial",
  res:["\"Who\" é pronome relativo para pessoa, numa oração explicativa (entre vírgulas): não pode virar \"which\" nem sumir.","\"That\" aqui é conjunção depois de \"tells herself\" e pode ser omitido: \"tells herself she doesn't need…\".","Alternativa D."] },
{ id:"ep24-44", inst:"EPCAR", ano:2023, fonte:"epcar24", num:44, materia:"Inglês", assunto:"reading", dif:2,
  enun:"Texto III: artigo sobre a amizade de Wednesday e Enid. Mesmo afastada por Wednesday, Enid continua tentando se aproximar. The sentence \"isn't really demotivated\" means that Enid:",
  alts:{A:"still wants to become friends with Wednesday.",B:"is not that encouraged to try it anymore.",C:"gave up on investing in their friendship.",D:"is afraid of being pushed away again."}, gab:"A", gabTipo:"oficial",
  res:["\"Isn't really demotivated\" = não está desanimada de verdade.","Ou seja, ela continua querendo a amizade. Alternativa A."] },

/* ================= CN 2020 — Inglês (verificado) ================= */
{ id:"cn20-i1", inst:"CN", ano:2020, fonte:"cn20", materia:"Inglês", assunto:"reading", dif:2,
  enun:"Num texto sobre meditação, aparece a expressão \"stream of jumbled thoughts\". The adjective \"jumbled\" can be replaced, without change in meaning, by:",
  alts:{A:"good.",B:"awful.",C:"useless.",D:"enjoyable.",E:"disordered."}, gab:"E", gabTipo:"verificado",
  res:["\"Jumbled\" = misturado, bagunçado.","O sinônimo é \"disordered\". Alternativa E."] },
{ id:"cn20-i2", inst:"CN", ano:2020, fonte:"cn20", materia:"Inglês", assunto:"modals", dif:2,
  enun:"John diz que está quase dormindo e precisa ficar acordado. Katie responde na hora: \"I ___ you some coffee.\"",
  alts:{A:"'ll go",B:"'m going get",C:"'ll get",D:"'m go get to",E:"'ll to go to get"}, gab:"C", gabTipo:"verificado",
  res:["Decisão tomada no momento da fala → will.","Will + verbo no infinitivo sem \"to\": \"I'll get you some coffee\".","As outras têm erros de estrutura. Alternativa C."] },
{ id:"cn20-i3", inst:"CN", ano:2020, fonte:"cn20", materia:"Inglês", assunto:"comparatives", dif:2,
  enun:"Na frase \"All authorities have acted quickly and with great caution\", o advérbio \"quickly\" indica o modo da ação. Mark the sentence with the same type of adverb.",
